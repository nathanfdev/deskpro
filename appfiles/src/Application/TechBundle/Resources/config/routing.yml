tech_login:
    pattern:  /login
    defaults: { _controller: TechBundle:Login:index }

tech_logout:
  pattern: /login/logout
  defaults: { _controller: TechBundle:Login:logout }

tech_dashboard:
  pattern: /
  defaults: { _controller: TechBundle:Main:index }

################################################################################
# Styles
################################################################################

tech_admin_styles:
  pattern: /styles
  defaults: { _controller: TechBundle:Styles:index }

tech_admin_styles_intro:
  pattern: /styles/intro
  defaults: { _controller: TechBundle:Styles:intro }

tech_admin_styles_showstyle:
  pattern: /styles/:style_id
  defaults: { _controller: TechBundle:Styles:showStyle }
  requirements: { style_id: "\d+" }

tech_admin_styles_editstyle:
  pattern: /styles/:style_id/edit
  defaults: { _controller: TechBundle:Styles:editStyle }
  requirements: { style_id: "\d+" }

tech_admin_styles_newstyle:
  pattern: /styles/new-style
  defaults: { _controller: TechBundle:Styles:editStyle, style_id: 0 }

tech_admin_styles_resources:
  pattern: /styles/:style_id/resources
  defaults: { _controller: TechBundle:Styles:styleResourceList }
  requirements: { style_id: "\d+" }

tech_admin_styles_templates:
  pattern: /styles/:style_id/templates
  defaults: { _controller: TechBundle:Styles:styleTemplateList }
  requirements: { style_id: "\d+" }

tech_admin_styles_edittemplate:
  pattern: /styles/:style_id/templates/:template_name
  defaults: { _controller: TechBundle:Styles:editTemplate }
  requirements: { style_id: "\d+" }


################################################################################
# Languages
################################################################################

tech_admin_langs:
  pattern: /languages
  defaults: { _controller: TechBundle:Languages:index }

tech_admin_langs_intro:
  pattern: /languages/intro
  defaults: { _controller: TechBundle:Languages:intro }

tech_admin_langs_editlang:
  pattern: /languages/:lang_id/edit
  defaults: { _controller: TechBundle:Languages:editLang }
  requirements: { lang_id: "\d+" }

tech_admin_langs_newlang:
  pattern: /languages/new-language
  defaults: { _controller: TechBundle:Languages:editLang, lang_id: 0 }

tech_admin_langs_phrases:
  pattern: /languages/:lang_id/phrases
  defaults: { _controller: TechBundle:Languages:listPhrases}
  requirements: { lang_id: "\d+", phrase_group: null }

tech_admin_langs_editphrase:
  pattern: /languages/:lang_id/edit-phrase/:phrase_name
  defaults: { _controller: TechBundle:Languages:editPhrase }
  requirements: { lang_id: "\d+" }