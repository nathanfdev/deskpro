proxy:
  pattern: /proxy/{key}
  defaults: { _controller: DeskPRO:Widget:proxy }

serve_blob:
  pattern: /download/{blob_auth_id}
  defaults: { _controller: DeskPRO:Blob:showBlob }

serve_person_picture:
  pattern: /download/person-pic/{person_id}
  defaults: { _controller: DeskPRO:Blob:personPicture, size: 0 }
  requirements: { person_id: "\d+" }

serve_person_picture_size:
  pattern: /download/person-pic/{person_id}/{size}
  defaults: { _controller: DeskPRO:Blob:personPicture, size: 80 }
  requirements: { person_id: "\d+", size: "\d+" }

serve_trans_gif:
  pattern: /download/pixel
  defaults: { _controller: DeskPRO:Blob:getStaticFile, name: 'pixel' }

serve_default_picture:
  pattern: /download/person-pic/default
  defaults: { _controller: DeskPRO:Blob:getStaticFile, name: 'default_picture' }

data_interface_data:
  pattern: /data/interface-data.{_format}
  defaults: { _controller: DeskPRO:Data:interfaceData, _format: js }
  requirements: { _format: js }

favicon:
  pattern: /favicon.ico
  defaults: { _controller: DeskPRO:Blob:favicon }



client_messages_getnew:
  pattern: /client-messages/get-new-messages
  defaults: { _controller: DeskPRO:ClientMessages:getNewMessages, since: "0" }
  requirements: { since: "\d+" }

client_messages_subscribe_channels:
  pattern: /client-messages/subscribe-channels
  defaults: { _controller: DeskPRO:ClientMessages:subscribeChannels }

client_messages_unsubscribe_channels:
  pattern: /client-messages/unsubscribe-channels
  defaults: { _controller: DeskPRO:ClientMessages:unsubscribeChannels }