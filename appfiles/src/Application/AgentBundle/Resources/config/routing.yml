  defaults: { _controller: AgentBundle:Person:ajaxSaveEmails }
  requirements: { person_id: "\d+" }

agent_people_ajaxsave_contact:
  pattern: /people/:person_id/ajax-save-contact
  defaults: { _controller: AgentBundle:Person:ajaxSaveContact }
  requirements: { person_id: "\d+" }

agent_people_ajaxsave_note:
  pattern: /people/:person_id/ajax-save-note
  defaults: { _controller: AgentBundle:Person:ajaxSaveNote }
  requirements: { person_id: "\d+" }

agent_people_ajaxsave_organization:
  pattern: /people/:person_id/ajax-save-organization
  defaults: { _controller: AgentBundle:Person:ajaxSaveOrganization }
  requirements: { person_id: "\d+" }

agent_people_ajaxget_notes:
  pattern: /people/:person_id/ajax-get-notes
  defaults: { _controller: AgentBundle:Person:ajaxGetNotes }
  requirements: { person_id: "\d+" }

agent_peoplesearch_perform:
  pattern: /people-search/search
  defaults: { _controller: AgentBundle:PeopleSearch:performSearch }

agent_peoplesearch_performquick:
  pattern: /people-search/search-quick
  defaults: { _controller: AgentBundle:PeopleSearch:performQuickSearch }

agent_peoplesearch:
  pattern: /people-search
  defaults: { _controller: AgentBundle:PeopleSearch:search }

agent_peoplesearch_labelspane:
  pattern: /people-search/filters-pane
  defaults: { _controller: AgentBundle:PeopleSearch:labelsPane }

agent_peoplesearch_directorypane:
  pattern: /people-search/directory-pane
  defaults: { _controller: AgentBundle:PeopleSearch:directoryPane }


################################################################################
# Ticket Search
################################################################################

agent_ticketsearch:
  pattern: /ticket-search
  defaults: { _controller: AgentBundle:TicketSearch:index }

agent_ticket_view:
  pattern: /tickets/:ticket_id
  defaults: { _controller: AgentBundle:Ticket:view }
  requirements: { filter_id: "\d+" }

agent_ticketsearch_filterspane:
  pattern: /ticket-search/filters-pane
  defaults: { _controller: AgentBundle:TicketSearch:filtersPane }

agent_ticketsearch_runfilter:
  pattern: /ticket-search/filter/:filter_id
  defaults: { _controller: AgentBundle:TicketSearch:runFilter }
  requirements: { filter_id: "\d+" }

agent_ticketqueues_list:
  pattern: /ticket-search/queues/list
  defaults: { _controller: AgentBundle:TicketSearch:listQueues }

agent_ticketqueues_edit:
  pattern: /ticket-search/queues/:queue_id/edit
  defaults: { _controller: AgentBundle:TicketSearch:editQueue }
  requirements: { queue_id: "\d+" }

agent_ticketqueues_new:
  pattern: /ticket-search/queues/new-queue
  defaults: { _controller: AgentBundle:TicketSearch:editQueue, queue_id: 0 }