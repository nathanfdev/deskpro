  defaults: { _controller: AgentBundle:UserChat:sendMessage }

agent_userchat_send_filemessage:
  pattern: /chat/send-file-message/{conversation_id}
  defaults: { _controller: AgentBundle:UserChat:sendFile }

agent_userchat_assign:
  pattern: /chat/assign/{conversation_id}/{agent_id}
  defaults: { _controller: AgentBundle:UserChat:assignChat }

agent_userchat_addpart:
  pattern: /chat/add-part/{conversation_id}/{agent_id}
  defaults: { _controller: AgentBundle:UserChat:addPart }

agent_userchat_end:
  pattern: /chat/end-chat/{conversation_id}
  defaults: { _controller: AgentBundle:UserChat:endChat }

agent_userchat_leave:
  pattern: /chat/leave/{conversation_id}
  defaults: { _controller: AgentBundle:UserChat:leaveChat }

agent_userchat_invite:
  pattern: /chat/invite/{conversation_id}/{agent_id}
  defaults: { _controller: AgentBundle:UserChat:sendInvite }

agent_userchat_changeprop:
  pattern: /chat/change-props/{conversation_id}
  defaults: { _controller: AgentBundle:UserChat:changeProperties }

agent_userchat_getsectiondata:
  pattern: /chat/get-section-data.json
  defaults: { _controller: AgentBundle:UserChat:getSectionData }
