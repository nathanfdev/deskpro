agent_dashboard:
  pattern: /
  defaults: { _controller: AgentBundle:Main:index }

agent_test:
  pattern: /test
  defaults: { _controller: AgentBundle:Test:index }

agent_interface_poller:
  pattern: /poller
  defaults: { _controller: AgentBundle:Poller:handler }


################################################################################
# Languages
################################################################################

agent_admin_langs:
  pattern: /languages
  defaults: { _controller: AgentBundle:Languages:index }

agent_admin_langs_intro:
  pattern: /languages/intro
  defaults: { _controller: AgentBundle:Languages:intro }

agent_admin_langs_editlang:
  pattern: /languages/:lang_id/edit
  defaults: { _controller: AgentBundle:Languages:editLang }
  requirements: { lang_id: "\d+" }

agent_admin_langs_newlang:
  pattern: /languages/new-language
  defaults: { _controller: AgentBundle:Languages:editLang, lang_id: 0 }

agent_admin_langs_phrases:
  pattern: /languages/:lang_id/phrases
  defaults: { _controller: AgentBundle:Languages:listPhrases}
  requirements: { lang_id: "\d+", phrase_group: null }

agent_admin_langs_editphrase:
  pattern: /languages/:lang_id/edit-phrase/:phrase_name
  defaults: { _controller: AgentBundle:Languages:editPhrase }
  requirements: { lang_id: "\d+" }


