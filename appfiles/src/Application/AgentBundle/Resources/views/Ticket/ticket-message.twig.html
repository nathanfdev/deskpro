<li {% if message.person.is_agent %}class="message-item agent"{%else%}class="message-item person"{%endif%}>
	<div class="box">
		<div class="info">
			<cite>{{message.person.name}}</cite>
			<span class="time">
				<span class="edit-btn ticket-message-edit-btn"></span>
				submitted online (from 76.167.170.198), {{message.date_created|date('Y-m-d')}}
			</span>
		</div>
		<div class="message">
			{{message.message_html|raw}}

			{% if message.attachments.count() %}
				<div style="text-align:right; margin-top: 10px;">
					{% for ticket_attach in message.attachments %}
						<a href="{{ ticket_attach.blob.download_url }}" target="_blank">{{ticket_attach.blob.filename}}</a><br />
					{% endfor %}
				</div>
			{%endif%}
		</div>
	</div>
</li>
