user:
  pattern:  /
  defaults: { _controller: UserBundle:Portal:portal, _locale: en }

user_test:
  pattern:  /test
  defaults: { _controller: UserBundle:Test:index }

################################################################################
# Login/logout
################################################################################

user_login:
  pattern: /login
  defaults: { _controller: UserBundle:Login:index }

user_logout:
  pattern: /logout
  defaults: { _controller: UserBundle:Login:logout }

user_login_authenticate_local:
  pattern: /login/authenticate-password
  defaults: { _controller: UserBundle:Login:authenticate, usersource_id: 0 }

user_login_authenticate:
  pattern: /login/authenticate/{usersource_id}
  defaults: { _controller: UserBundle:Login:authenticate, usersource_id: 0 }
  requirements: { usersource_id: "\d+" }

user_login_callback:
  pattern: /login/authenticate-callback/{usersource_id}
  defaults: { _controller: UserBundle:Login:authenticateCallback }
  requirements: { usersource_id: "\d+" }

user_login_resetpass:
  pattern: /login/reset-password
  defaults: { _controller: UserBundle:Login:resetPassword }

user_login_resetpass_send:
  pattern: /login/reset-password/send
  defaults: { _controller: UserBundle:Login:sendResetPassword }

user_login_resetpass_newpass:
  pattern: /login/reset-password/{code}
  defaults: { _controller: UserBundle:Login:resetPasswordNewPass }
  requirements: { code: "[A-Za-z0-9\-]{17,}" }

user_login_resetpass_newpass_querycode:
  pattern: /login/reset-password/query-code
  defaults: { _controller: UserBundle:Login:resetPasswordNewPassQueryCode }

################################################################################
# Register
################################################################################

user_register:
  pattern: /register
  defaults: { _controller: UserBundle:Register:register }

user_register_finish:
  pattern: /register/finish
  defaults: { _controller: UserBundle:Register:finish }

################################################################################
# Profile
################################################################################

user_profile:
  pattern: /profile
  defaults: { _controller: UserBundle:Profile:index }

user_profile_changepassword:
  pattern: /profile/change-password
  defaults: { _controller: UserBundle:Profile:changePassword }

user_profile_emails:
  pattern: /profile/emails
  defaults: { _controller: UserBundle:Profile:emails }

user_profile_emails_new:
  pattern: /profile/emails/new
  defaults: { _controller: UserBundle:Profile:newEmail }

user_profile_emails_remove:
  pattern: /profile/emails/{email_id}/remove
  defaults: { _controller: UserBundle:Profile:removeEmail }

user_profile_emails_validate:
  pattern: /profile/emails/{email_id}/validate
  defaults: { _controller: UserBundle:Profile:validateEmail }

user_profile_emails_validate_sendlink:
  pattern: /profile/emails/{email_id}/validate/send-link
  defaults: { _controller: UserBundle:Profile:sendValidateEmailLink }

user_profile_emails_validate_code:
  pattern: /profile/emails/{email_id}/validate/{code}
  defaults: { _controller: UserBundle:Profile:validateEmail }

user_profile_emails_setdefault:
  pattern: /profile/emails/{email_id}/set-default
  defaults: { _controller: UserBundle:Profile:setDefaultEmail }

################################################################################
# Search
################################################################################

user_search:
  pattern: /search
  defaults: { _controller: UserBundle:Search:search }

user_search_label:
  pattern: /search/labels/{label}
  defaults: { _controller: UserBundle:Search:labels }

user_search_omnisearch:
  pattern: /search/omnisearch/{query}
  defaults: { _controller: UserBundle:Search:omnisearch }

user_search_labels:
  pattern: /tagged/{labels}
  defaults: { _controller: UserBundle:Search:labelled }

################################################################################
# Tickets
################################################################################

user_tickets:
  pattern: /tickets
  defaults: { _controller: UserBundle:Tickets:list }

# This must be before _view, so /new isnt considered a ticket with ref 'new'
user_tickets_new:
  pattern: /tickets/new
  defaults: { _controller: UserBundle:NewTicket:new }

user_tickets_new_thanks:
  pattern: /tickets/new/thanks/{ticket_ref}
  defaults: { _controller: UserBundle:NewTicket:thanks }

user_tickets_view:
  pattern: /ticket/{ticket_id}
  defaults: { _controller: UserBundle:TicketView:load }

user_tickets_addreply:
  pattern: /ticket-edit/{ticket_ref}/add-reply
  defaults: { _controller: UserBundle:Tickets:addReply }

user_tickets_modify:
  pattern: /ticket-edit/{ticket_ref}/modify
  defaults: { _controller: UserBundle:Tickets:modify }

user_tickets_participants:
  pattern: /ticket-edit/{ticket_ref}/people
  defaults: { _controller: UserBundle:Tickets:manageParticipants }

user_tickets_participants_add:
  pattern: /ticket-edit/{ticket_ref}/people/add
  defaults: { _controller: UserBundle:Tickets:addParticipant }

user_tickets_participants_remove:
  pattern: /ticket-edit/{ticket_ref}/people/remove/{person_id}
  defaults: { _controller: UserBundle:Tickets:removeParticipant }

user_tickets_feedback:
  pattern: /ticket-edit/{ticket_ref}/feedback/{message_id}
  defaults: { _controller: UserBundle:Tickets:feedback }

user_tickets_feedback_save:
  pattern: /ticket-edit/{ticket_ref}/feedback/{message_id}/save
  defaults: { _controller: UserBundle:Tickets:feedbackSave }

user_tickets_feedback_closeticket:
  pattern: /ticket-edit/{ticket_ref}/feedback/{message_id}/close-ticket
  defaults: { _controller: UserBundle:Tickets:feedbackCloseTicket }

################################################################################
# Articles
################################################################################

user_articles:
  pattern: /kb/{slug}
  defaults: { _controller: UserBundle:Articles:browse, slug: '' }
  requirements: { slug: "(\d+(\-.*?)?)?" }

user_articles_recent:
  pattern: /kb/recent
  defaults: { _controller: UserBundle:Articles:recent }

user_articles_popular:
  pattern: /kb/popular
  defaults: { _controller: UserBundle:Articles:popular }

user_articles_filter:
  pattern: /kb/find
  defaults: { _controller: UserBundle:Articles:filter }

user_articles_article:
  pattern: /kb/articles/{slug}
  defaults: { _controller: UserBundle:Articles:article }

user_articles_rate:
  pattern: /kb/rate-article/{article_id}
  defaults: { _controller: UserBundle:Articles:rate }

user_articles_newcomment:
  pattern: /kb/new-comment/{article_id}
  defaults: { _controller: UserBundle:Articles:newComment }

################################################################################
# Downloads
################################################################################

user_downloads:
  pattern: /downloads/{slug}
  defaults: { _controller: UserBundle:Downloads:browse, slug: '' }
  requirements: { slug: "(\d+(\-.*?)?)?" }

user_downloads_recent:
  pattern: /downloads/recent/{page}
  defaults: { _controller: UserBundle:Downloads:recent, page: 1 }
  requirements: { page: "\d+" }

user_downloads_popular:
  pattern: /downloads/popular/{page}
  defaults: { _controller: UserBundle:Downloads:popular, page: 1 }
  requirements: { page: "\d+" }

user_downloads_file:
  pattern: /downloads/files/{slug}
  defaults: { _controller: UserBundle:Downloads:file }

################################################################################
# News
################################################################################

user_news_list:
  pattern: /news/list/{slug}/{page}
  defaults: { _controller: UserBundle:News:browse, slug: '', page: 1, list_type: 'list' }
  requirements: { slug: "(\d+(\-.*?)?)?", page: "\d+" }

user_news:
  pattern: /news/{slug}/{page}
  defaults: { _controller: UserBundle:News:browse, slug: '', page: 1 }
  requirements: { slug: "(\d+(\-.*?)?)?", page: "\d+" }

user_news_view:
  pattern: /news/posts/{slug}
  defaults: { _controller: UserBundle:News:view }

user_news_newcomment:
  pattern: /news/new-comment/{post_id}
  defaults: { _controller: UserBundle:News:newComment }

################################################################################
# Ideas
################################################################################

user_ideas:
  pattern: /feedback/{status}/{slug}
  defaults: { _controller: UserBundle:Ideas:filter, status: 'new', slug: 'all' }
  requirements: { slug: "((\d+(\-.*?)?)?)|all", status: "(popular|new|active|closed)" }

user_ideas_view:
  pattern: /feedback/ideas/{slug}
  defaults: { _controller: UserBundle:Ideas:view }

user_ideas_newidea:
  pattern: /feedback/new-idea
  defaults: { _controller: UserBundle:Ideas:newIdea }

user_ideas_newcomment:
  pattern: /feedback/new-comment/{idea_id}
  defaults: { _controller: UserBundle:Ideas:newComment }

user_ideas_vote:
  pattern: /feedback/vote/{idea_id}
  defaults: { _controller: UserBundle:Ideas:vote }=

user_ideas_status:
  pattern: /feedback/all/{status}
  defaults: { _controller: UserBundle:Ideas:index, slug: 0 }

user_ideas_cat:
  pattern: /feedback/{slug}
  defaults: { _controller: UserBundle:Ideas:index, status: new }

user_ideas_cat_status:
  pattern: /feedback/{slug}/{status}
  defaults: { _controller: UserBundle:Ideas:index }

################################################################################
# Chat
################################################################################

user_chat_initsession:
  pattern: /chat/chat-session
  defaults: { _controller: UserBundle:Chat:chatSession }

user_chat_poll:
  pattern: /chat/poll/{session_code}
  defaults: { _controller: UserBundle:Chat:poll }

user_chat_sendmessage:
  pattern: /chat/send-message/{session_code}
  defaults: { _controller: UserBundle:Chat:sendMessage }

user_chat_sendusertyping:
  pattern: /chat/user-typing/{session_code}
  defaults: { _controller: UserBundle:Chat:userTyping }

user_chat_chatended:
  pattern: /chat/chat-finished/{session_code}
  defaults: { _controller: UserBundle:Chat:chatEnded }

user_chat_chatwin:
  pattern: /chat/chat-window/{session_code}
  defaults: { _controller: UserBundle:Chat:chatWindow }

user_chat_ignoreproactive:
  pattern: /chat/ignore-proactive
  defaults: { _controller: UserBundle:Chat:proactiveIgnore }