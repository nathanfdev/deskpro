user:
  pattern:  /
  defaults: { _controller: UserBundle:Main:index }

user_login:
  pattern: /login
  defaults: { _controller: UserBundle:Login:index }

user_logout:
  pattern: /logout
  defaults: { _controller: UserBundle:Login:logout }

user_login_authenticate_local:
  pattern: /login/authenticate-password
  defaults: { _controller: UserBundle:Login:authenticate, usersource_id: 0 }

user_login_authenticate:
  pattern: /login/authenticate/{usersource_id}
  defaults: { _controller: UserBundle:Login:authenticate, usersource_id: 0 }
  requirements: { usersource_id: "\d+" }

user_login_callback:
  pattern: /login/authenticate-callback/{usersource_id}
  defaults: { _controller: UserBundle:Login:authenticateCallback }
  requirements: { usersource_id: "\d+" }


################################################################################
# Register
################################################################################

user_register_finish:
  pattern: /register/finish
  defaults: { _controller: UserBundle:RegisteR:finish }


################################################################################
# Tickets
################################################################################

user_tickets:
  pattern: /tickets
  defaults: { _controller: UserBundle:Tickets:list }

user_tickets_view:
  pattern: /tickets/{ticket_id}
  defaults: { _controller: UserBundle:Tickets:view }
  requirements: { ticket_id: "\d+" }

user_tickets_new:
  pattern: /tickets/new
  defaults: { _controller: UserBundle:NewTicket:new }