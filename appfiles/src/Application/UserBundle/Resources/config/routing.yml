index:
  pattern:  /
  defaults: { _controller: UserBundle:Main:index }

user_login:
  pattern: /login
  defaults: { _controller: UserBundle:Login:index }

user_logout:
  pattern: /logout
  defaults: { _controller: UserBundle:Login:logout }

user_login_authenticate:
  pattern: /login/authenticate
  defaults: { _controller: UserBundle:Login:authenticate }

user_login_callback:
  pattern: /login/authenticate-callback/:usersource_id
  defaults: { _controller: UserBundle:Login:authenticateCallback }
  requirements: { usersource_id: "\d+" }