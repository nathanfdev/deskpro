parameters:
    kernel.include_core_classes: false
    templating.engine.class: "DeskPRO\Templating\Engine"

kernel.config:
  error_handler_level: null

web.config:
  router: { resource: "%kernel.root_dir%/config/routing.yml" }
  validation:
    enabled: true

web.templating:
  escaping: htmlspecialchars
  assets_base_urls: "/dp_400/static" # root paths like this need to have basepath prepended

doctrine.orm:
  auto_generate_proxy_classes: true

doctrine.dbal:
  dp_from_user_config: db
  wrapper_class: "DeskPRO\DBAL\Connection"

deskpro_cache.caches:
  phrases: ~

deskpro_core.config: ~
deskpro_tech_core.config: ~
deskpro_requestuser.config: ~
