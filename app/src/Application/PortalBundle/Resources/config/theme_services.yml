services:

  theme_resolver:
    class: Application\PortalBundle\Theme\ThemeResolver
    arguments:
        - @service_container
        - @theme_repository
        - @tag_processor
        - @logger


  tag_processor:
    lazy: true
    class: Application\PortalBundle\Theme\TagProcessor
    arguments:
      - @tag_request_factory
      - [ @tag_handler.esi, @tag_handler.inline ]


  tag_handler.esi:
    class: Application\PortalBundle\Theme\TagHandler\EsiTagHandler
    arguments:
      - @service_container
      - @portal_cache_helper


  tag_handler.inline:
    class: Application\PortalBundle\Theme\TagHandler\InlineTagHandler
    arguments:
      - @service_container


  tag_request_factory:
    class: Application\PortalBundle\Theme\TagRequestFactory
    arguments:
      - @request_stack


  theme_view_factory:
    class: Application\PortalBundle\Theme\ThemeViewFactory
    arguments: [@brand_stack]


  theme_repository:
    class: Application\PortalBundle\Theme\ThemeRepository
    arguments: [@portal_cache.themes, @annotation_reader, @logger]


  portal_cache.themes:
    class: Symfony\Component\Config\ConfigCache
    arguments:
      - %kernel.cache_dir%/portalThemes.php
      - %kernel.debug%


  portal_cache.template_cache_warmer:
    class: Application\PortalBundle\CacheWarmer\ThemeTemplateCacheWarmer
    arguments: [@theme_resolver]
    tags:
      - { name: 'kernel.cache_warmer' }


  portal_cache.theme_cache_warmer:
    class: Application\PortalBundle\CacheWarmer\ThemeRepositoryCacheWarmer
    arguments: [@theme_repository]
    tags:
      - { name: 'kernel.cache_warmer' }