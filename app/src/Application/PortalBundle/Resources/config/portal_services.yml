parameters:
  router.options.matcher.cache_class: null
  portal.session.name: sess_data

### This file will be split / cleaned up into more logical files and imported like below. Hard to follow at the moment with all these service defs piled together.

imports:
  - { resource: 'portal_helpers.yml' }

services:
  templating.portal:
    class: Application\PortalBundle\Templating\PortalTemplating
    arguments: [@templating.engine.twig]

  brand_stack:
    class: Application\DeskPRO\Brand\BrandStack
    arguments: [@brand_container_factory, @default_brand]

  theme_resolver:
    class: Application\PortalBundle\Theme\ThemeResolver
    arguments: [@service_container, @theme_repository, @logger]

  theme_view_factory:
    class: Application\PortalBundle\Theme\ThemeViewFactory
    arguments: [@brand_stack]

  theme_repository:
    class: Application\PortalBundle\Theme\ThemeRepository
    arguments: [@portal_cache.themes, @annotation_reader, @logger]

  brand_container_factory:
    class: Application\DeskPRO\Brand\BrandContainerFactory
    arguments: [@settings_resolver, @theme_resolver]

  person_repository:
    class: Application\DeskPRO\EntityRepository\Person
    factory_service: doctrine.orm.default_entity_manager
    factory_method: getRepository
    arguments: ['DeskPRO:Person']

  brand_repository:
    class: Application\DeskPRO\EntityRepository\Brand
    factory_service: doctrine.orm.default_entity_manager
    factory_method: getRepository
    arguments: ['DeskPRO:Brand']

  template_repository:
    class: Application\DeskPRO\EntityRepository\Template
    factory_service: doctrine.orm.default_entity_manager
    factory_method: getRepository
    arguments: ['DeskPRO:Template']

  default_brand_finder:
    class: Application\DeskPRO\Brand\DefaultBrandFinder
    arguments: [@settings_resolver, @brand_repository]

  default_brand:
    class: Application\DeskPRO\Entity\Brand
    factory_service: default_brand_finder
    factory_method: getDefaultBrand

  param_converter.deskpro_slug:
    class: Application\PortalBundle\Request\DeskproSlugConverter
    arguments: [@doctrine.orm.default_entity_manager]
    tags:
      - { name: request.param_converter, priority: -1, converter: deskpro_slug }

  param_converter.tag_request:
    class: Application\PortalBundle\Request\TagRequestConverter
    arguments: [@brand_stack]
    tags:
      - { name: request.param_converter, priority: 1, converter: tag_request }

  portal_loadder.twig:
    class: Application\PortalBundle\Twig\PortalLoader
    arguments: [@brand_stack, @template_repository]
    tags:
      - { name: twig.loader }

  portal_extension.twig:
    class: Application\PortalBundle\Twig\PortalExtension
    arguments: [@brand_stack, @settings_resolver]
    tags:
      - { name: twig.extension }

  portal_cache.template_map:
    class: Symfony\Component\Config\ConfigCache
    arguments:
      - %kernel.cache_dir%/portalTemplateMap.php
      - %kernel.debug%

  portal_cache.themes:
    class: Symfony\Component\Config\ConfigCache
    arguments:
      - %kernel.cache_dir%/portalThemes.php
      - %kernel.debug%

  portal_cache.template_cache_warmer:
    class: Application\PortalBundle\CacheWarmer\ThemeTemplateCacheWarmer
    arguments: [@theme_resolver]
    tags:
      - { name: 'kernel.cache_warmer' }

  portal_cache.theme_cache_warmer:
    class: Application\PortalBundle\CacheWarmer\ThemeRepositoryCacheWarmer
    arguments: [@theme_repository]
    tags:
      - { name: 'kernel.cache_warmer' }

  data_collector.portal:
    class: Application\PortalBundle\DataCollector\PortalCollector
    arguments: [@brand_stack, @language_stack]
    tags:
      - { name: data_collector, template: "PortalBundle:Collector:portal.html.twig", id: "portal" }

  tag_options.listener:
      class: Application\PortalBundle\EventListener\TagOptionsListener
      arguments: [@annotation_reader]
      tags:
        - { name: kernel.event_subscriber }


  ##
  ## Event Listeners
  ##

  brand_detector.listener:
    class: Application\PortalBundle\EventListener\BrandDetectionListener
    arguments: [@brand_stack, @settings_resolver, @brand_repository, @default_brand, @logger]
    tags:
      - { name: kernel.event_subscriber }

  redirect_exception.listener:
    class: Application\PortalBundle\EventListener\RedirectExceptionListener
    arguments: [@router, @logger]
    tags:
      - { name: kernel.event_subscriber }

  controller_name_converter:
      class: Application\PortalBundle\HttpKernel\ControllerNameParser
      tags: [{name: monolog.logger, channel: request}]
      arguments: [@kernel, @brand_stack]

  ##
  ## Session Handler
  ##

  session.handler.dbal:
    class: Application\PortalBundle\Session\DbalSessionHandler
    arguments: [@doctrine.dbal.default_connection, %portal.session.name%]



  visitor_identification_provider:
    class: Application\PortalBundle\Visitor\VisitorIdentificationProvider
    arguments: [@request_stack, @logger]

  visitor_identification.listener:
    class: Application\PortalBundle\EventListener\VisitorIdentificationListener
    arguments: [@visitor_identification_provider, @logger]
    tags:
      - { name: kernel.event_subscriber }

  ##
  ## Misc
  ##

  pagerfanta.view.deskpro:
      class: Application\PortalBundle\View\Pagerfanta\DeskproView
      public: false
      tags: [{ name: pagerfanta.view, alias: deskpro }]
