services:

  session.handler.dbal:
    class: Application\PortalBundle\Session\DbalSessionHandler
    arguments: [@doctrine.dbal.default_connection, %portal.session.name%]


  portal_http_cache_user_context:
      class: Application\PortalBundle\HttpKernel\PortalUserHashContextProvider
      arguments: [@security.token_storage, @security.authorization_checker, @portal_permissions_manager]
      tags:
        - { name: fos_http_cache.user_context_provider }


  portal_cache_helper:
      class: Application\PortalBundle\HttpKernel\PortalCacheHelper
      arguments: [@request_stack]


  visitor_identification_provider:
    class: Application\PortalBundle\Visitor\VisitorIdentificationProvider
    arguments: [@request_stack, @logger]


  pagerfanta.view.deskpro:
      class: Application\PortalBundle\View\Pagerfanta\DeskproView
      public: false
      tags:
        - { name: pagerfanta.view, alias: deskpro }


  portal_mode_factory:
      class: Application\PortalBundle\Mode\PortalModeFactory


  portal_mode_storage:
      class: Application\PortalBundle\Mode\PortalModeStorage