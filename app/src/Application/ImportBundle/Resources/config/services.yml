services:

  deskpro.import.formatter:
    class: Application\ImportBundle\Generator\Exporter\Formatter\Formatter
    factory_class: Application\ImportBundle\Generator\Exporter\Formatter\FormatterFactory
    factory_method: create

  deskpro.import.csv_reader_factory:
    class: Application\ImportBundle\Reader\Csv\CsvReaderFactory

  deskpro.import.json_reader_factory:
    class: Application\ImportBundle\Reader\Json\JsonReaderFactory

  deskpro.import.deskpro_reader_factory:
    class: Application\ImportBundle\Reader\DeskPRO\DeskPROReaderFactory
    arguments: [@service_container]

  deskpro.import.osticket_reader_factory:
    class: Application\ImportBundle\Reader\OsTicket\OsTicketReaderFactory

  deskpro.import.zendesk_reader_factory:
    class: Application\ImportBundle\Reader\ZenDesk\ZenDeskReaderFactory

  deskpro.import:
    class: Application\ImportBundle\Service\Import
    arguments: [@service_container]

  deskpro.import.generator:
    scope: prototype
    class: Application\ImportBundle\Generator\Generator
    factory_class: Application\ImportBundle\Generator\GeneratorFactory
    factory_method: createGenerator
    arguments: [@service_container]

  deskpro.import.batch_exporter:
    class: Application\ImportBundle\Generator\Exporter\Batch
    factory_class: Application\ImportBundle\Generator\Exporter\BatchFactory
    factory_method: createExporter
