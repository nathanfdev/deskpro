services:
  deskpro.import.batch_exporter:
    class: Application\ImportBundle\Generator\Exporter\Batch
    factory_class: Application\ImportBundle\Generator\Exporter\BatchFactory
    factory_method: createExporter

  deskpro.import.generator:
    class: Application\ImportBundle\Generator\Generator
    factory_class: Application\ImportBundle\Generator\GeneratorFactory
    factory_method: createGenerator
    arguments: [@service_container]
