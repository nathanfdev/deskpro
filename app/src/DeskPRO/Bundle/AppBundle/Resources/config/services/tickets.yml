services:

  ticket_manager:
    class: Application\DeskPRO\Tickets\TicketManager
    arguments: [@service_container]

  tickets.view:
    class: DeskPRO\Bundle\AppBundle\DataService\TicketViewDataService
    arguments: [@doctrine.orm.default_entity_manager, @form_field_manager, @ticket_layout_factory, @deskpro.core.translate, @tickets.custom_per_field_manager, @brand_aware_settings_resolver]

  chat.view:
    class: DeskPRO\Bundle\AppBundle\DataService\Chat\ChatViewDataService
    arguments: [@doctrine.orm.default_entity_manager]

  tickets.table:
    class: DeskPRO\Bundle\AppBundle\DataService\TicketTableDataService
    arguments: [@doctrine.orm.default_entity_manager, @data.tickets, @language_manager, @data.departments, @ticket_layout_factory, @form_field_manager, @brand_aware_settings_resolver]

  tickets.custom_per_field_manager:
    class: DeskPRO\Bundle\PortalBundle\CustomField\Context\CustomPerFieldManager
    arguments: [@doctrine.orm.default_entity_manager]

  tickets.new_ticket:
    class: DeskPRO\Bundle\AppBundle\Ticket\NewTicket
    arguments: [@doctrine.orm.default_entity_manager, @ticket_manager, @tickets.custom_per_field_manager]
