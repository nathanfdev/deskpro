services:

  data.person:
    class: DeskPRO\Bundle\AppBundle\DataService\PersonDataService
    arguments: [@doctrine.orm.default_entity_manager]

  data.tickets:
    class: DeskPRO\Bundle\AppBundle\DataService\TicketsDataService
    arguments: [@doctrine.orm.default_entity_manager]

  data.ticket_timeline:
    class: DeskPRO\Bundle\AppBundle\DataService\TicketTimelineDataService
    arguments: [@doctrine.orm.default_entity_manager]

  data.departments:
    class: DeskPRO\Bundle\AppBundle\DataService\DepartmentDataService
    arguments: [@doctrine.orm.default_entity_manager, @portal_permissions_manager]

  data.articles:
    class: DeskPRO\Bundle\AppBundle\DataService\ArticlesDataService
    arguments: [@doctrine.orm.default_entity_manager]

  data.news:
    class: DeskPRO\Bundle\AppBundle\DataService\NewsDataService
    arguments: [@doctrine.orm.default_entity_manager]

  data.downloads:
    class: DeskPRO\Bundle\AppBundle\DataService\DownloadsDataService
    arguments: [@doctrine.orm.default_entity_manager]

  data.feedback:
    class: DeskPRO\Bundle\AppBundle\DataService\FeedbackDataService
    arguments: [@doctrine.orm.default_entity_manager]

  data.rating:
    class: DeskPRO\Bundle\AppBundle\DataService\RatingsDataService
    arguments: [@doctrine.orm.default_entity_manager]

  data.filters:
      class: DeskPRO\Bundle\AppBundle\DataService\FiltersDataService
      arguments: [@doctrine.orm.default_entity_manager]
