services:

  object_router:
    class: DeskPRO\Bundle\AppBundle\ObjectRouter\ObjectRouter
    arguments:
      - @router
      - @settings_resolver
      - @object_router.annotation_config

  object_router.annotation_config:
    class: DeskPRO\Bundle\AppBundle\ObjectRouter\ObjectRouterAnnotationConfig
    arguments:
      - @annotation_reader
      - @object_router.config_cache

  object_router.config_cache:
    class: Symfony\Component\Config\ConfigCache
    arguments:
      - %kernel.cache_dir%/objectRouter.php
      - %kernel.debug%

  blob.storage:
    class: Application\DeskPRO\BlobStorage\DeskproBlobStorage
    factory_class: Application\DeskPRO\DependencyInjection\SystemServices\BlobStorageService
    factory_method: create
    arguments: [@service_container]

  avatar_resolver:
    class: DeskPRO\Bundle\AppBundle\Content\AvatarResolver
    #todo #portal second param here needs to be setting for gravatar
    arguments: [@router.default, true]

  translator.noop:
      class: DeskPRO\Bundle\AppBundle\Translator\NoopTranslator
