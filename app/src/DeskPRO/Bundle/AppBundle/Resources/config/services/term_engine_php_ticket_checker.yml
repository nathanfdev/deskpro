services:

    #
    # ENGINE
    #

    term_engine.php_ticket_checker.engine:
        class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\PhpTicketCheckerEngine
        arguments:
            - @term_engine.php_ticket_checker.compiler
            - @term_engine.expression_language
            - @event_dispatcher

    term_engine.php_ticket_checker.compiler:
        class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\Compiler\PhpTicketCheckerCompiler
        arguments:
            - @term_engine.php_ticket_checker.compiler.factory
            - []  # the visitors added in compiler pass with tag "php_ticket_checker_visitor"

    term_engine.php_ticket_checker.compiler.factory:
        class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\PhpTermCompilerFactory
        # compiler pass will add the term compilers on tag "php_ticket_checker_compiler"


    #
    # TERM COMPILERS
    #

    term_engine.php_ticket_checker.term_compiler:
            class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\AbstractPhpTermCompiler
            abstract: true
            calls:
                - ['setHelperPool', ["@term_engine.php.helper_pool"]]

    term_engine.php_ticket_checker.compiler.agent:
            class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\TermCompiler\PhpAgentTermCompiler
            parent: term_engine.php_ticket_checker.term_compiler
            tags:
                ticket_filter:
                    name: php_ticket_checker_compiler
                    term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\AgentTerm'

    term_engine.php_ticket_checker.compiler.ticket_status:
            class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\TermCompiler\PhpTicketStatusTermCompiler
            parent: term_engine.php_ticket_checker.term_compiler
            tags:
                ticket_filter:
                    name: php_ticket_checker_compiler
                    term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketStatusTerm'

    term_engine.php_ticket_checker.compiler.department:
            class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\TermCompiler\PhpDepartmentTermCompiler
            parent: term_engine.php_ticket_checker.term_compiler
            tags:
                ticket_filter:
                    name: php_ticket_checker_compiler
                    term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\DepartmentTerm'

    term_engine.php_ticket_checker.compiler.agent_team:
            class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\TermCompiler\PhpAgentTeamTermCompiler
            parent: term_engine.php_ticket_checker.term_compiler
            tags:
                ticket_filter:
                    name: php_ticket_checker_compiler
                    term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\AgentTeamTerm'

    term_engine.php_ticket_checker.compiler.person_email:
            class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\TermCompiler\PhpPersonEmailTermCompiler
            parent: term_engine.php_ticket_checker.term_compiler
            tags:
                ticket_filter:
                    name: php_ticket_checker_compiler
                    term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\PersonEmailTerm'

    term_engine.php_ticket_checker.compiler.ticket_participant:
            class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\TermCompiler\PhpTicketParticipantTermCompiler
            parent: term_engine.php_ticket_checker.term_compiler
            tags:
                ticket_filter:
                    name: php_ticket_checker_compiler
                    term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketParticipantTerm'

    term_engine.php_ticket_checker.compiler.ticket_custom_data:
            class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\TermCompiler\PhpTicketCustomDataTermCompiler
            parent: term_engine.php_ticket_checker.term_compiler
            tags:
                ticket_filter:
                    name: php_ticket_checker_compiler
                    term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketCustomDataTerm'


    #
    # VISITORS
    #

    term_engine.dbal_ticket_filters.logger_visitor:
        class: DeskPRO\Bundle\AppBundle\TermEngine\Visitor\LoggingVisitor
        arguments: [@logger]
        tags:
        - { name: php_ticket_checker_visitor }



    #
    # HELPERS - inject these into your TermCompiler to help build DbalQueryPart's for you
    #

    term_engine.php.helper_pool:
        class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\TermCompilerHelperPool

    term_engine.php.method_check:
        class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\Helper\MethodCheckHelper
        tags:
            - { name: php_term_engine_helper }