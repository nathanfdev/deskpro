services:

    # DATA TRANSFORMERS
    #
    # NOTE: If you are making a transformer and no dependency injection is needed, you don't need
    # to make it a service. Instead, you can make a class name by convention.
    # For example the transformer for the type "sandbox_widget" just make the class:
    # DeskPRO\Bundle\ApiBundle\DataSerializer\DataTransformer\SandboxWidgetTransformer
    #
    # note: you don't need a tag for these to work. just make the prefix the same.
    #       to reference this transformer, just use "sandbox_widget" (ignore the prefix when using).

    data_serializer.transformer.task:
      class: DeskPRO\Bundle\ApiBundle\DataSerializer\DataTransformer\TaskTransformer
      arguments:
        - @doctrine.dbal.default_connection

    data_serializer.transformer.ticket:
      class: DeskPRO\Bundle\ApiBundle\DataSerializer\DataTransformer\TicketTransformer
      arguments:
        - @doctrine.orm.default_entity_manager

    data_serializer.transformer.person:
      class: DeskPRO\Bundle\ApiBundle\DataSerializer\DataTransformer\PersonTransformer
      arguments:
        - @avatar_resolver
        - @data.agent

    data_serializer.transformer.person_profile:
      class: DeskPRO\Bundle\ApiBundle\DataSerializer\DataTransformer\PersonProfileTransformer
      arguments:
        - @avatar_resolver

    data_serializer.transformer.agent_team:
      class: DeskPRO\Bundle\ApiBundle\DataSerializer\DataTransformer\AgentTeamTransformer
      arguments:
        - @avatar_resolver

    data_serializer.transformer.department:
      class: DeskPRO\Bundle\ApiBundle\DataSerializer\DataTransformer\DepartmentTransformer
      arguments:
        - @avatar_resolver
