services:

  deskpro.api.request_auth:
      class: Application\LegacyApiBundle\Request\RequestAuth
      scope: request
      arguments:
          - @doctrine.orm.entity_manager
          - @request

  api_view_representation_factory:
      class: DeskPRO\Bundle\ApiBundle\View\ApiViewRepresentationFactory

  jsonp_format_listener:
      class: DeskPRO\Bundle\ApiBundle\EventListener\JsonpFormatListener
      tags:
          - { name: kernel.event_subscriber }


  json_body_listener:
      class: DeskPRO\Bundle\ApiBundle\EventListener\JsonBodyListener
      tags:
          - { name: kernel.event_subscriber }

  json_headers_response_listener:
      class: DeskPRO\Bundle\ApiBundle\EventListener\JsonHeadersResponseListener
      arguments:
          - @serializer
      tags:
        - { name: 'kernel.event_subscriber' }

  follow_rredirect_listener:
      class: DeskPRO\Bundle\ApiBundle\EventListener\FollowRedirectListener
      tags:
        - { name: 'kernel.event_subscriber' }

  api_url_inflector:
      class: DeskPRO\Bundle\ApiBundle\Util\UrlInflector

  api_error_listener:
      class: DeskPRO\Bundle\ApiBundle\EventListener\ApiExceptionListener
      tags:
        - { name: kernel.event_subscriber }

  job.scheduler:
      class: Application\DeskPRO\JobQueue\JobScheduler
      arguments:
          - @doctrine.orm.entity_manager

  job.queue:
      class: Application\DeskPRO\JobQueue\JobQueue
      arguments:
          - @doctrine.orm.entity_manager
          - @job.scheduler

  api_logger_factory:
    class: DeskPRO\Bundle\ApiBundle\Log\ApiLoggerFactory
    arguments:
      - @service_container

  api_logger:
    class: DeskPRO\Bundle\ApiBundle\Log\ApiLoggerDb
    factory: [@api_logger_factory, createLogger]

  api_logger.db:
    class: DeskPRO\Bundle\ApiBundle\Log\ApiLoggerDb
    arguments:
      - @doctrine.orm.default_entity_manager

  api_logger.file:
    class: DeskPRO\Bundle\ApiBundle\Log\ApiLoggerFile
    arguments:
      - %kernel.logs_dir%
      - @settings_resolver
      - @api_logger.file.serializer

  api_logger.file.serializer:
    class: DeskPRO\Bundle\ApiBundle\Log\Serializer\SerializeSerializer
    factory: [@api_logger_factory, createSerializer]

  api_logger.file.serializer.human_readable:
      class: DeskPRO\Bundle\ApiBundle\Log\Serializer\HumanReadableSerializer

  api_logger.file.serializer.serialize:
        class: DeskPRO\Bundle\ApiBundle\Log\Serializer\SerializeSerializer

  api_log_listener:
      class: DeskPRO\Bundle\ApiBundle\EventListener\ApiLogListener
      arguments:
          - @api_logger
          - @security.token_storage
          - @doctrine.orm.default_entity_manager
          - @settings_resolver
      tags:
          - { name: kernel.event_subscriber }

  api_request_id_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\ApiRequestIdListener
    tags:
      - { name: kernel.event_subscriber }