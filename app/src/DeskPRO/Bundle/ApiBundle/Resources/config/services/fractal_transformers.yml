services:

    # the manager
    api_fractal_manager:
        class: DeskPRO\Bundle\ApiBundle\Fractal\FractalManager
        arguments:
            - @service_container
        calls:
            - [setSerializer, [@api_fractal_serializer]]
    api_fractal_serializer:
        class: DeskPRO\Bundle\ApiBundle\Fractal\FractalJsonSerializer

    # the transformers
    # note: you don't need a tag for these to work. just make the prefix the same.
    #       to reference this transformer, just use "sandbox_widget" (ignore the prefix when using).
    api_transformer.sandbox_widget:
        class: DeskPRO\Bundle\ApiBundle\Fractal\Transformer\SandboxWidgetTransformer