services:

  form_saver:
    class: DeskPRO\Bundle\PortalBundle\SavedForm\FormSaver
    arguments:
      - @router
      - @doctrine.orm.default_entity_manager
      - @session

  listener.response.double_submit:
        class: DeskPRO\Bundle\PortalBundle\Form\EventListener\DoubleSubmitJavascriptListener
        tags:
          - { name: kernel.event_subscriber }

  form.form_extension:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Extension\DeskproFormExtension
    tags:
      - { name: form.type_extension, alias: form }

  form.checkbox_extension:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Extension\DeskproCheckboxExtension
    tags:
      - { name: form.type_extension, alias: checkbox }

  form_extension.twig:
    class: DeskPRO\Bundle\PortalBundle\Form\Twig\FormTwigExtension
    tags:
      - { name: twig.extension }

  captcha_decider:
    class: DeskPRO\Bundle\PortalBundle\Form\Captcha\CaptchaDecider
    arguments: [@brand_stack, @security.authorization_checker]

  form_hierarchy_generator:
    class: DeskPRO\Bundle\PortalBundle\Form\Hierarchy\HierarchyGenerator
    arguments: [@doctrine.orm.default_entity_manager, @data.departments, @data.feedback]

  deskpro.validator.valid_captcha:
    class: DeskPRO\Bundle\PortalBundle\Form\Validator\Constraints\ValidCaptchaValidator
    arguments: [@brand_stack, @request_stack]
    tags:
      - { name: validator.constraint_validator, alias: deskpro.captcha }


  #
  # Types
  #

  form.ticket:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\TicketType
    arguments:
      - @form_field_manager
      - @ticket_layout_factory
      - @ticket_layout_differ
      - @form_hierarchy_generator
      - @doctrine.orm.default_entity_manager
      - @language_manager
      - @captcha_decider
    tags:
      - { name: form.type, alias: ticket }


  form.csrf_double_submit_extension:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CsrfDoubleSubmitExtension
    arguments: [@request_stack]
    tags:
      - { name: form.type_extension, alias: form }


  form.ticket_reply:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\TicketReplyType
    tags:
      - { name: form.type, alias: ticket_reply }


  form.person_registration:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\PersonRegistrationType
    arguments: [@form_field_manager, @language_manager, @captcha_decider]
    tags:
      - { name: form.type, alias: person_registration }


  form.person_manage_emails:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\PersonManageEmailsType
    arguments: [@doctrine.orm.default_entity_manager]
    tags:
      - { name: form.type, alias: person_manage_emails }


  form.person_profile:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\PersonEditProfileType
    arguments: [@form_field_manager, @language_manager, @blob.storage, @doctrine.orm.default_entity_manager]
    tags:
      - { name: form.type, alias: person_profile }


  form.comment:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CommentType
    tags:
      - { name: form.type, alias: comment }


  form.new_feedback:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\NewFeedbackType
    arguments: [@captcha_decider]
    tags:
      - { name: form.type, alias: new_feedback }

  form.custom_feedback_fields:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CustomFeedbackType
    arguments: [@form_field_manager]
    tags:
      - { name: form.type, alias: custom_feedback_fields }


  form.feedback_attachment:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\FeedbackAttachmentType
    arguments: [@blob.storage]
    tags:
      - { name: form.type, alias: feedback_attachment }


  form.feedback_attachment_collection:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\FeedbackAttachmentCollectionType
    tags:
      - { name: form.type, alias: feedback_attachment_collection }


  form.feedback_category:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\FeedbackCategoryType
    tags:
      - { name: form.type, alias: feedback_category }


  form.request_password_reset:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\PasswordResetRequestType
    tags:
      - { name: form.type, alias: request_password_reset }


  form.person_change_password:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\PersonChangePasswordType
    tags:
      - { name: form.type, alias: person_change_password }


  form.custom_data_ticket:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CustomDataTicketType
    arguments: [@form_field_manager, @doctrine.orm.default_entity_manager]
    tags:
      - { name: form.type, alias: deskpro_custom_data_ticket }


  form.custom_data_person:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CustomDataPersonType
    arguments: [@form_field_manager]
    tags:
      - { name: form.type, alias: deskpro_custom_data_person }


  form.custom_data_feedback:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CustomDataFeedbackType
    arguments: [@form_field_manager]
    tags:
      - { name: form.type, alias: deskpro_custom_data_feedback }


  form.ticket_message:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\TicketMessageType
    tags:
      - { name: form.type, alias: ticket_message }


  form.ticket_message_attachment:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\TicketMessageAttachmentType
    arguments: [@blob.storage, @doctrine.orm.default_entity_manager]
    tags:
      - { name: form.type, alias: ticket_message_attachment }


  form.ticket_message_attachment_collection:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\TicketMessageAttachmentCollectionType
    tags:
      - { name: form.type, alias: ticket_message_attachment_collection }


  form.custom_field_choice:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CustomFieldChoiceType
    arguments: [@form_hierarchy_generator]
    tags:
      - { name: form.type, alias: deskpro_custom_field_choice }


  form.language:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\LanguageType
    tags:
      - { name: form.type, alias: deskpro_language }


  form.person_email:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\PersonEmailType
    tags:
      - { name: form.type, alias: deskpro_person_email }


  form.person_email_choice:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\PersonEmailChoiceType
    arguments:
      - @doctrine.orm.default_entity_manager
    tags:
      - { name: form.type, alias: deskpro_person_email_choice }


  form.display_html:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\DisplayHtmlType
    tags:
      - { name: form.type, alias: deskpro_display_html }


  form.hidden:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\HiddenType
    arguments: [@request_stack]
    tags:
      - { name: form.type, alias: deskpro_hidden }


  form.department:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\DepartmentType
    tags:
      - { name: form.type, alias: deskpro_department }


  form.product:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\ProductType
    tags:
      - { name: form.type, alias: deskpro_product }


  form.category:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CategoryType
    tags:
      - { name: form.type, alias: deskpro_category }


  form.workflow:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\WorkflowType
    tags:
      - { name: form.type, alias: deskpro_workflow }


  form.priority:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\PriorityType
    tags:
      - { name: form.type, alias: deskpro_priority }


  form.captcha:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CaptchaType
    arguments: [@brand_stack]
    tags:
      - { name: form.type, alias: deskpro_captcha }


  form.blob:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\BlobType
    arguments: [@doctrine.orm.default_entity_manager, @blob.storage]
    tags:
      - { name: form.type, alias: deskpro_blob }


  form.cc:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\CcType
    arguments: [@person_factory]
    tags:
      - { name: form.type, alias: deskpro_cc }


  form.date:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\DateType
    tags:
      - { name: form.type, alias: deskpro_date }


  form.datetime:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\DateTimeType
    tags:
      - { name: form.type, alias: deskpro_datetime }


  form.heirarchical_entity:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\HeirarchicalEntityType
    tags:
      - { name: form.type, alias: deskpro_heirarchical_entity }


  form.entity_hierarchy:
    class: DeskPRO\Bundle\PortalBundle\Form\Form\Type\EntityHeirarchyType
    arguments: [@form_hierarchy_generator]
    tags:
      - { name: form.type, alias: entity_hierarchy }
