services:

  dp.portal.designer.styles_manager:
    class: DeskPRO\Bundle\PortalBundle\Designer\StylesManager
    arguments:
      - @doctrine.orm.default_entity_manager
      - @dp.portal.designer.theme_set_copying_service
      - @dp.portal.designer.sass_doc_parser
      - @=service('brand_stack').getCurrentThemeSet()
      - @=service('brand_stack').getCurrentEditThemeSet()

  dp.portal.designer.advanced_edits_manager:
    class: DeskPRO\Bundle\PortalBundle\Designer\AdvancedEditsManager
    arguments:
      - @doctrine.orm.default_entity_manager
      - @=service('brand_stack').getCurrentThemeSet()
      - @=service('brand_stack').getCurrentEditThemeSet()

  dp.portal.designer.portal_styles_compiler:
    class: DeskPRO\Bundle\PortalBundle\Designer\PortalStylesCompiler
    arguments:
      - @doctrine.orm.default_entity_manager
      - @=service('brand_stack').getCurrentEditThemeSet()
      - '../pub/src/DeskPRO/Bundle/PortalBundle/Resources/style/portal-style.scss'
      - 'custom_vars.scss'
      - @=service('dp.portal.designer.advanced_edits_manager').getEditThemeSetScss()
      - 'custom_style.scss'

  dp.portal.designer.sass_doc_parser:
    class: DeskPRO\Bundle\PortalBundle\Designer\SassDocParser
    arguments:
      - '../web/sassdoc/vars.json'

  dp.portal.designer.theme_set_copying_service:
    class: DeskPRO\Bundle\PortalBundle\Designer\ThemeSetCopyingService
    arguments:
      - @doctrine.orm.default_entity_manager

  dp.portal.designer.portal_customizations_twig_extension:
    class: DeskPRO\Bundle\PortalBundle\Designer\PortalCustomizationsTwigExtension
    arguments: [@service_container]
    tags:
        - { name: twig.extension }

  dp.portal.designer.admin_preview_iframe_listener:
    class: DeskPRO\Bundle\PortalBundle\Designer\AdminPreviewIframeListener
    arguments: [@portal_mode_storage]
    tags:
      - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -255 }
