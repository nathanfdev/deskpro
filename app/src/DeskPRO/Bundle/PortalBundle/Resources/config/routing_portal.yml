# Links to known existing URLs (admin, agent, file.php, etc)
# these are duplicates from DpKernel's config
admin_interface:
    path: /admin
agent_interface:
    path: /agent
serve_blob:
    path: '/file.php/{blob_auth_id}/{filename}'

# Annotations
portal:
    resource: "@PortalBundle/Controller"
    type:     annotation

# START security routes
########################################################################################################################
# The following are caught by our security system, and therefore do not need to have default controllers set on them
portal_logout:
    path: /logout

portal_login_submit:
    path: /login/authenticate-password

portal_login_authenticate:
    path: /login/authenticate/{usersource_id}

portal_login_callback:
    path: /login/authenticate-callback/{usersource_id}

portal_login_usersource_sso:
    path: /login/usersource-sso/{usersource_id}

# saml specific
# only temporarily here, until other interfaces stop relying on the routes of UserBundle
saml_sls:
    path: /saml/sls/{usersource_id}
saml_metadata:
    path: /saml/metadata/{usersource_id}.xml
user_saml_sls:
    path: /saml/sls/{usersource_id}
user_saml_metadata:
    path: /saml/metadata/{usersource_id}.xml

# impersonation route
portal_agent_login:
    path: /impersonate/agent-login/{code}
########################################################################################################################
# END security routes

# DEV
# TODO: delete this route
portal_dev:
    path: /_dev
    defaults:
      _controller: Theme:Dev:dev
