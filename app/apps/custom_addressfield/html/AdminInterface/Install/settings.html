<form name="jira_form" ng-submit="jira_form.$valid && saveSettings()" novalidate>
<article class="form-horizontal dp-form">
	<div class="panel panel-fill indent">

		<div class="panel-body" ng-if="!no_curl_support">

            <div class="form-group">
                <div class="col-lg-12" style="font-size: 130%">
                    <i class="fa fa-question-circle"></i> Please.
                    <br/>
                    <a href="#" target="_blank" class="btn btn-default btn-lg" style="margin-top: 10px;">Read Install Instructions</a>
                </div>
            </div>

			<!--#include file="AdminInterface/Install/settings-list.html" -->

            <div class="form-group">
                <div class="col-lg-4">
                    <h3>Template Code</h3>
                </div>
                <div class="col-lg-8">
                    <textarea class="form-control" rows="5" readonly>{{ assets }}</textarea>
                    <span class="help-block">
                        Copy and paste this code in to the custom-headinclude.html.twig template from
                        <a href="#/tickets/fields">Portal > Templates > Layout</a>.
                    </span>
                </div>
            </div>

		</div>
	</div>
</article>
</form>
