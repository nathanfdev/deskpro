<dp-optionbuilder-row>
	<div class="dp-ob-standard-row">
		<table class="display-table">
			<tr>
				<td class="nowrap">
					<label class="row-label">Send SMS<br/>
						<small>via Twilio</small>
					</label>
				</td>
				<td ng-show="rowOpts.rowEnabled">
					<table class="display-table spaced">
						<tr>
							<td>Message:</td>
							<td>
								<div style="padding-top: 3px; width: 80%;">
									<textarea class="form-control" ng-model="model.message"></textarea>
								</div>
								<div style="padding-bottom: 3px; width: 80%;">
									<span class="help-inline dp-help-content">{{ model.message.length }} characters</span>
								</div>
							</td>
						</tr>
						<!-- Keeping it simple for now -->
						<tr>
							<td>Send To:</td>
							<td>
								<div style="padding-top: 3px; width: 250px;">
									<input type="text"  class="form-control" ng-model="model.to_number"/>
								</div>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</div>
</dp-optionbuilder-row>
