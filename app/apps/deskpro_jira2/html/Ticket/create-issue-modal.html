<form name="create_issue_form" ng-submit="create_issue_form.$valid && confirm()">
    <div class="modal-header">
        <h3 class="modal-title">New JIRA Issue:</h3>
    </div>
    <div class="modal-body">

        <label style="display: block; margin: 10px 0;">
            {{ meta.fieldName('project') }}*:
            <select ui-select2 ng-model="issue.project.id" required style="min-width: 200px;">
                <option ng-repeat="project in meta.projects" value="{{ project.id }}">{{ project.name }}</option>
            </select>
        </label>

        <label style="display: block; margin: 10px 0;">
            {{ meta.fieldName('issuetype') }}*:
            <select ui-select2 ng-model="issue.issuetype.id" required style="min-width: 200px;">
                <option ng-repeat="type in project.issuetypes" value="{{ type.id }}">{{ type.name }}</option>
            </select>
        </label>

        <label style="display: block; margin: 10px 0;">
            {{ meta.fieldName('summary') }}*:
            <input type="text" ng-model="issue.summary" required />
        </label>

        <div ng-repeat="field in fields">
            <jira-form-widget field="field" ng-model="issue[field.id]" />
        </div>
        <br />

        <div ng-show="sending">->spinner<-</div>
        <button class="btn btn-primary" dp-submit-form style="display: block; margin: 0 auto;"
                ng-show="!sending">
            Create JIRA Issue
        </button>

    </div>
</form>
