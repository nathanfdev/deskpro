<div class="modal-header">
    <h3 class="modal-title">Link JIRA Issue:</h3>
</div>
<div class="modal-body">

    <ul>
        <li ng-if="meta.isEnabled('summary', 'issuekey')">
            {{ meta.fieldName('issuekey') }}: {{ issue.key }}
        </li>
        <li ng-repeat="field in issue.filtered_fields">
            {{ meta.fieldName(field.id) }}: {{ meta.fieldValue(field.id, field.value) }}
        </li>
    </ul>

    <button ng-click="confirm()">Confirm</button>

</div>
