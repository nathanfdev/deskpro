<div class="modal-header">
    <h3 class="modal-title">JIRA Issue:</h3>
</div>
<div class="modal-body">

    <ul>
        <li ng-repeat="(k, v) in issue.fields">
            {{ k }}: {{ render(v) }}
        </li>
    </ul>

    <form name="comment_form" ng-submit="comment_form.$valid && sendMessage()">
        <textarea name="message" ng-model="message" required></textarea>
        <br />
        <button dp-submit-form>Add Comment</button>
    </form>


</div>
