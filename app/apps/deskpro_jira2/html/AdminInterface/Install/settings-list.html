<div class="form-group">
	<div class="col-lg-4">
		<h3>{{ definitions.url.label }}</h3>
	</div>
	<div class="col-lg-8" dp-error-class="jira_form.url">
		<input type="url" name="url" class="form-control" ng-model="setting_values.url"
               placeholder="https://example.atlassian.net" required />
		<span class="help-block">
			<span>{{ definitions.url.description }}</span>
		</span>
	</div>
</div>

<div class="form-group">
	<div class="col-lg-4">
		<h3>{{ definitions.consumer_key.label }}</h3>
	</div>
	<div class="col-lg-8" dp-error-class="jira_form.consumer_key">
		<input type="text" name="consumer_key" class="form-control" ng-model="setting_values.consumer_key"
                required />
		<span class="help-block">
			<span>{{ definitions.consumer_key.description }}</span>
		</span>
	</div>
</div>

<div class="form-group">
    <div class="col-lg-4">
        <h3>{{ definitions.comments.label }}</h3>
    </div>
    <div class="col-lg-8" dp-error-class="jira_form.consumer_key">
        <label>
            <input type="checkbox" ng-model="setting_values.comments" />
            {{ definitions.comments.description }}
        </label>
    </div>
</div>
