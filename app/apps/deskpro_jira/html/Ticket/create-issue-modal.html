<form name="create_issue_form" ng-submit="create_issue_form.$valid && confirm()">
    <div class="modal-header">
        <button type="button" class="close" ng-click="dismiss()"><span aria-hidden="true">&times;</span></button>
        <h3 class="modal-title">New Issue</h3>
    </div>
    <div class="modal-body jira-form" ng-style="{maxHeight: meta.windowHeight() - 220, overflowY: 'auto'}">
        <div class="extended-merge">
            <div class="merge-data-wrap" style="margin: 0;">
                <table class="merge-data" width="100%">
                    <tbody>
                        <tr>
                            <th style="text-align: left; text-wrap: none;" nowrap="nowrap">{{ meta.fieldName('project') }}*:</th>
                            <td>
                                <select name="issuetype" ui-select2 ng-model="issue.project.id" required style="min-width: 200px;">
                                    <option ng-repeat="project in meta.projects" value="{{ project.id }}">{{ project.name }}</option>
                                </select>
                                <div class="text-danger" ng-if="errors.project">{{ errors.project }}</div>
                            </td>
                        </tr>
                        <tr>
                            <th style="text-align: left; text-wrap: none;" nowrap="nowrap">{{ meta.fieldName('issuetype') }}*:</th>
                            <td>
                                <select name="issuetype" ui-select2 ng-model="issue.issuetype.id" required style="min-width: 200px;">
                                    <option ng-repeat="type in project.issuetypes" value="{{ type.id }}">{{ type.name }}</option>
                                </select>
                                <div class="text-danger" ng-if="errors.issuetype">{{ errors.issuetype }}</div>
                            </td>
                        </tr>
                        <tr>
                            <th style="text-align: left; text-wrap: none;" nowrap="nowrap">{{ meta.fieldName('summary') }}*:</th>
                            <td>
                                <input name="summary" type="text" ng-model="issue.summary" required />
                                <div class="text-danger" ng-if="errors.summary">{{ errors.summary }}</div>
                            </td>
                        </tr>
                    </tbody>
                    <tbody ng-repeat="field in fields">
                        <tr>
                            <th style="text-align: left; text-wrap: none;" nowrap="nowrap">{{ field.name }}{{ field.required ? '*' : '' }}:</th>
                            <td>
                                <jira-form-widget field="field" ng-model="issue[field.id]" error="errors[field.id]" />
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-danger" ng-if="errors">
            Please correct the following error(s):
            <div ng-repeat="error in errors">{{ error }}</div>
        </div>
    </div>
    <div class="modal-footer" style="text-align: center;">
        <button class="dp-btn" type="button" dp-submit-form ng-show="!sending">
            Create Issue
        </button>
        <i class="flat-spinner" ng-show="sending"></i>
    </div>
</form>
