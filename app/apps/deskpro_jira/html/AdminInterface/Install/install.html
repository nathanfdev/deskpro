<article class="form-horizontal dp-form">
	<div class="panel panel-fill indent">
		<div class="panel-body" ng-if="no_curl_support">
			<h3>Server Requirements</h3>
			<p>
				This app requires PHP to be compiled with cURL support.
			</p>
			<p>
				According to our tests, your server does not have the cURL support.
			</p>
			<p>
				<a href="http://php.net/manual/curl.installation.php" target="_blank" class="btn btn-default">Refer to the PHP manual for more information</a>
			</p>
		</div>
		<div class="panel-body" ng-if="!no_curl_support">
			<!--#include file="AdminInterface/Install/settings-list.html" -->
		</div>
	</div>
</article>
<footer class="dp-panelblock-footer" ng-if="!no_curl_support">
	<div class="dp-content">
		<div class="dp-btn-controls">
			<div dp-hide-spinning="saving_settings">
				<a class="btn btn-default" ng-click="Ctrl.cancelInstall()"><i class="fa fa-arrow-left"></i> Cancel</a>
				<button class="btn btn-info" ng-click="openTestModal()"><i class="fa fa-bolt"></i> Test Settings</button>
				<button class="btn btn-success" ng-click="Ctrl.installApp();">Install App <i class="fa fa-arrow-right"></i></button>
			</div>
			<div dp-show-spinning="saving_settings">
				<i class="spinner-flat"></i>
			</div>
		</div>
	</div>
</footer>
