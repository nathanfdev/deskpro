<div class="form-group">
	<div class="col-lg-4">
		<h3>API Token</h3>
	</div>
	<div class="col-lg-8">
		<input type="text" class="form-control" ng-model="setting_values.webhook_url" />
		<span class="help-block">
			This is the Webhook of your Slack room. This can be created at <a href="https://my.slack.com/services/new/incoming-webhook/" target="_blank">https://my.slack.com/services/new/incoming-webhook/</a>
		</span>
	</div>
</div>

<div class="form-group">
	<div class="col-lg-4">
		<h3>Notify</h3>
	</div>
	<div class="col-lg-8">
		<label><input type="checkbox" ng-model="setting_values.notify" /> Yes</label>
		<span class="help-block">Notify room members of a new message</span>
	</div>
</div>
