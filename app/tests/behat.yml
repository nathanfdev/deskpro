api:
    suites:
        api:
            paths:
                - %paths.base%/features/api
            contexts:
                - DpBehat\DataSetContext:
                    dataset_manager: @dataset_manager
                - Behat\MinkExtension\Context\MinkContext
                - behatch:json
                - DpBehat\Api\RestContext
                - DpBehat\Api\SandboxWidgetsContext:
                    em: @doctrine.orm.default_entity_manager
                - DpBehat\Api\AuthContext:
                    em: @doctrine.orm.default_entity_manager
                    user_details: @user_details
    extensions:
        Sanpi\Behatch\Extension: ~
        Behat\MinkExtension:
            base_url: '/'
            default_session: default
            sessions:
                default:
                    symfony2: ~
        Behat\Symfony2Extension:
            kernel:
                bootstrap: features/bootstrap/boot.php
                path: ../sys/Kernel/ApiKernel.php
                class: DeskPRO\Kernel\ApiKernel
                env: test
                debug: true


portal:
    suites:
        portal:
            paths:
                - %paths.base%/features/portal
            contexts:
                - Behat\MinkExtension\Context\MinkContext
                - DpBehat\Portal\TestsContext:
                    session: @session
                    em: @doctrine.orm.default_entity_manager
                - behatch:json
                - behatch:rest
                - DpBehat\LanguageContext:
                    language_manager: @language_manager
                    em: @doctrine.orm.default_entity_manager
                    lang_repo: @language_repository
                    lang_stack: @language_stack
                - DpBehat\Portal\PortalModeContext:
                    mode_storage: @portal_mode_storage
                    mode_factory: @portal_mode_factory
                - DpBehat\Portal\AuthContext:
                    user_details: @user_details
                    token_storage: @security.token_storage
                - DpBehat\Portal\RouterContext
                - DpBehat\Portal\TicketsContext
                - DpBehat\DataSetContext:
                    dataset_manager: @dataset_manager
    extensions:
        Sanpi\Behatch\Extension: ~
        Behat\MinkExtension:
            base_url: '/'
            default_session: default
            sessions:
                default:
                    symfony2: ~
        Behat\Symfony2Extension:
            kernel:
                bootstrap: features/bootstrap/boot.php
                path: ../sys/Kernel/PortalKernel.php
                class: DeskPRO\Kernel\PortalKernel
                env: test
                debug: true
        SensioLabs\Behat\PageObjectExtension:
            namespaces:
                page: DpBehat\Portal\Page
                element: DpBehat\Portal\Page\Element















