api:
    suites:
        api:
            paths:
                - %paths.base%/features/api
                - %paths.base%/features/term-engine
            contexts:
                - DpBehat\DataSetContext:
                    dataset_manager: @dataset_manager
                - Behat\MinkExtension\Context\MinkContext
                - behatch:json
                - DpBehat\Api\RestContext
                - DpBehat\Api\SandboxWidgetsContext:
                    em: @doctrine.orm.default_entity_manager
                - DpBehat\Api\AuthContext
                - DpBehat\TermEngine\TermEngineBehatContext
                - DpBehat\Api\PeopleContext
    extensions:
        Sanpi\Behatch\Extension: ~
        Behat\MinkExtension:
            base_url: '/'
            default_session: default
            sessions:
                default:
                    symfony2: ~
        Behat\Symfony2Extension:
            kernel:
                bootstrap: features/bootstrap/boot.php
                path: ../sys/Kernel/ApiKernel.php
                class: DeskPRO\Kernel\ApiKernel
                env: test
                debug: true


portal:
    suites:
        portal:
            paths:
                - %paths.base%/features/portal
            contexts:
                - Behat\MinkExtension\Context\MinkContext
                - DpBehat\Portal\TestsContext
                - behatch:json
                - behatch:rest
                - DpBehat\LanguageContext
                - DpBehat\Portal\PortalModeContext
                - DpBehat\Portal\PortalBrandThemeContext
                - DpBehat\Portal\AuthContext
                - DpBehat\Portal\RouterContext
                - DpBehat\Portal\TicketsContext
                - DpBehat\Portal\GenericContext
                - DpBehat\Portal\TicketContext
                - DpBehat\Performance\PerformanceContext
                - DpBehat\Http\HttpContext
                - DpBehat\DataSetContext:
                    dataset_manager: @dataset_manager
                - DpBehat\Portal\Api\AuthContext
                - DpBehat\Portal\Api\ChatContext
                - DpBehat\Portal\PortalDesigner\AssetsContext
    extensions:
        Sanpi\Behatch\Extension: ~
        Behat\MinkExtension:
            base_url: '/'
            default_session: default
            sessions:
                default:
                    symfony2: ~
                goutte:
                    goutte: ~
        Behat\Symfony2Extension:
            kernel:
                bootstrap: features/bootstrap/boot.php
                path: ../sys/Kernel/PortalKernel.php
                class: DeskPRO\Kernel\PortalKernel
                env: test
                debug: true
        SensioLabs\Behat\PageObjectExtension:
            namespaces:
                page: DpBehat\Portal\Page
                element: DpBehat\Portal\Page\Element
            factory:
                page_parameters:
                          base_url: /


e2e:
    suites:
        general:
            mink_session: selenium2
            mink_javascript_session: selenium2
            paths:
                - %paths.base%/e2e/general
            contexts:
                - Behat\MinkExtension\Context\MinkContext
                - DpBehat\E2E\SeleniumContext:
                - behatch:browser
                - behatch:debug:
                    screenshotDir: %paths.base%/e2e/logs/screenshots
                - DpBehat\DataSetContext:
                    dataset_manager: @dataset_manager
    extensions:
        Sanpi\Behatch\Extension: ~
        Behat\MinkExtension:
            # Set in boot.php via BEHAT_PARAMS env
            base_url: 'http://localhost:8888/'
            browser_name: "phantomjs"
            selenium2:
              browser: phantomjs
              wd_host: "http://127.0.0.1:4444/wd/hub"
            default_session: selenium2
            sessions:
                default:
                    selenium2: ~
        Behat\Symfony2Extension:
            kernel:
                bootstrap: e2e/bootstrap/boot.php
                path: ../sys/Kernel/ApiKernel.php
                class: DeskPRO\Kernel\ApiKernel
                env: test
                debug: true
