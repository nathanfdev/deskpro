parameters:
  test.client.parameters:
    - HTTP_HOST: '/'

services:

  dataset_manager:
      class: DpBehat\TestBundle\DataSetManager
      arguments:
        - [@dbset.empty, @dbset.fresh]

  dbset.empty:
      class: DpBehat\TestBundle\DataSet\EmptyDb
      arguments:
        - @service_container
        - @doctrine.orm.default_entity_manager
        - @doctrine.dbal.default_connection
        - %kernel.cache_dir%/dbset

  dbset.fresh:
      class: DpBehat\TestBundle\DataSet\FreshDb
      arguments:
        - @service_container
        - @doctrine.orm.default_entity_manager
        - @doctrine.dbal.default_connection
        - %kernel.cache_dir%/dbset

  user_details:
      class: DpBehat\TestBundle\UserDetailsRepo
      arguments:
        - @doctrine.orm.default_entity_manager