extensions:
    - PhpSpec\NyanFormattersExtension\Extension
    - PhpSpec\Extension\CodeCoverageExtension

suites:
    default:
        src_path: ../src
        spec_path: ./

code_coverage:
    whitelist:
      - ../src/Application/AppBundle
      - ../src/Application/PortalBundle
      - ../src/Application/AuthBundle
      - ../src/Application/LanguageBundle
      - ../src/Application/FormsBundle
      - ../src/Application/PersonBundle
      - ../src/Application/TicketBundle
    blacklist:
      - ../vendor
      - ../vendor-src
    format:
      - clover
    output:
      clover: coverage/tmp/phpspec.xml

formatter.name: nyan.cat