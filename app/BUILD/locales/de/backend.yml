agent.login.ie_compat_mode_step3: 'Vergewissern Sie sich, dass die URL des Helpdesks nicht in der Liste ist. Sollte sie in der Liste sein, selektieren Sie den Eintrag und klicken Sie auf die Schaltfläche  „Entfernen“. Vergewissern Sie sich weiters, dass „Alle Websites in der Kompatibilitätsansicht anzeigen“ deaktiviert ist. Wenn Sie DeskPro in einem Intranet verwenden, müssen Sie weiters auch die Option „Intranetsites in der Kompatibilitätsansicht anzeigen“ deaktivieren.'
