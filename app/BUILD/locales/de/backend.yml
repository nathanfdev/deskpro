adm.departments.perm_assign_locked_priv: 'This group is locked because a more privileged group is enabled'
adm.departments.perm_assign_locked_tip: 'This permission is locked because the Full Access'' permission is enabled which always includes the ''Assign'' permission.'
adm.departments.perm_assign_tip: 'Assignment means that the agent cannot view tickets in the department, but they can create or move tickets into it.'
adm.departments.perm_full_tip: 'Full Access means the agent can view tickets in the department as well as create or move tickets into the department.'
adm.departments.perm_group_locked_tip: 'This permission is locked because this agent belongs to an agent group which has this permission enabled.'
adm.departments.rename_department_field: 'Rename the department field'
adm.departments.rename_department_field_explain: 'If the word "Department" is not suitable for your helpdesk, you can change it here. Any place in the user interface that refers to departments will instead use your custom word.'
adm.departments.saved_dep_x_success: 'Saved department "{{title}}" successfully'
