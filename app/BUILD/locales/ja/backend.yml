admin.user_registration.enter_dsn_mysql: 'データベースのDSN接続文字列を入力します。文字列形式のマニュアル（<a href="http://www.php.net/manual/en/ref.pdo-mysql.connection.php">MySQL</a>）を参照してください。例：<var>mysql:host=localhost;dbname=mydb</var>'
admin.user_registration.enter_email_field_here: スキーマにユーザが固有の「メール」フィールドを使用してログインする場合は、ここに入力します。ユーザ名またはメールフィールド、またはその両方を指定する必要があります。
