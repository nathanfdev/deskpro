admin.portal.website_widgets_overlay: ヘルプデスクウィジェット
admin.portal.website_widgets_overlay_explain: タブウィジェットは、Webサイトの左側にタブボタンを配置します。ユーザがタブをクリックすると、サイトの上にオーバーレイが開き、ユーザがヘルプデスクと対話できるページが表示されます。
