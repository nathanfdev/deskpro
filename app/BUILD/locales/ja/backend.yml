admin.user_registration.enter_twitter_secret: 'Twitter consumer secret を入力してください'
admin.user_registration.enter_username_field_here: スキーマにユーザが固有の「ユーザ名」フィールドを使用してログインする場合は、ここに入力します。このフィールドはオプションで、ユーザはメールアドレスではなくログインフォームにユーザ名を入力できます。
admin.user_registration.explain_default_filter: 'デフォルトでは、ユーザを検索するときに実行されるフィルタは<var>(&(objectClass=user)(sAMAccountName=%s))</var>です。入力プレースホルダ－として<var>%s</var>を使用してください。'
admin.user_registration.explain_lost_password: ユーザがこのユーザソースを使用してログインし、後で「パスワードを忘れた」リンクをクリックすると、パスワードをリセットするURLが表示されます。
admin.user_registration.explain_must_login_mode: このモードでは、ヘルプデスクを全ての人が閲覧できますが、チケット、フィードバック、コメントなどのコンテンツを新しく提出するには、ユーザ登録またはログインする必要があります。
admin.user_registration.explain_open_helpdesk: オープンヘルプデスクでは、誰でもヘルプデスクを使用できます。ユーザが新しいコンテンツを提出すると、新しいプロファイルが自動的に作成されます。
admin.user_registration.explain_user_source: ユーザソースは、Deskproがログインしたいときにユーザを認証するために使用する任意のデータベースです。
