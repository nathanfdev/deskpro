admin.user_registration.enter_name_field_here: スキーマにユーザのフルネームを格納するフィールドがある場合は、ここに入力します。
admin.user_registration.enter_port_here: 非標準ポート（セキュアな接続には389または636）を使用している場合は、ここに入力します
admin.user_registration.enter_raw_php_code: '見つかったユーザレコードに対して、入力されたパスワードの有効性をチェックする際に使用するそのままのPHPコードを入力します。次の変数を使用できます：<ul><li>&middot; $userinfo はテーブルの完全な行です。</li><li>&middot; $userinfo_password は行のパスワードフィールドです。これは、$userinfo[''yourpasswordfield''] と同じです。</li><li>&middot; $password_input は、ユーザが入力したパスワードです。これは$userinfo_passwordと照合する必要があります。</li><li>&middot; $pass は、ブール値です。パスワードが正しい場合は、この変数をtrueに設定します。</li></ul>次に、ソルトパスワードをチェックするコードの例を示します：<br /><code>$pass = (md5($password_input . $userinfo[''salt'']) == $userinfo_password);</code>'
admin.user_registration.enter_table_prefix_here: インストールでテーブル接頭辞を使用している場合は、ここに入力します。
admin.user_registration.enter_the_dsn: 'データベースのDSN接続文字列を入力します。文字列形式のマニュアル（{{links}}）を参照してください。例えば、MySQLデータベースの場合：<var>mysql:host=localhost;dbname=mydb</var>'
