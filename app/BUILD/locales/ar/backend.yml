adm.departments.agent_perms_explain: 'Agent permissions control which of your agents have permission to use a department. There are two different types of permissions:'
adm.departments.agent_perms_explain_assign: 'The <strong>assign</strong> permission lets agents assign tickets to a department, but <em>not view</em> tickets within the department.'
adm.departments.agent_perms_explain_chat: 'Agent permissions control which of your agents have permission to use a department.'
