admin.user_registration.enter_raw_php_code: 'Въведете суровия PHP код който ще се използва когато се проверява валидността на въведена парола спрямо запис на потребители. Следните променливи са на разположение: <ul><li>&middot; $userinfo е пълният ред от вашата таблица</li> <li>&middot; $userinfo_password е полето на паролата от реда. Това е същото като $userinfo[''yourpasswordfield'']</li> <li>&middot; $password_input е паролата въведена от потребителя. Това е с което трябва да сравните $userinfo_password.</li> <li>&middot; $pass е булева стойност. Ако паролата е правилна, определи тази стойност като true . Ако е невалидна, определи като false.</li> </ul> Ето някои примерен код за проверка на salted password:<br /> <code>$pass = (md5($password_input . $userinfo[''salt'']) == $userinfo_password);</code>'
