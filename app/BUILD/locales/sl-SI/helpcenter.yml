helpcenter.emails.remind_unresolved_final: 'Že kar nekaj časa je minilo, odkar smo prejeli tvoje zadnje sporočilo v zvezi z odprtim zahtevkom.<br />Če še vedno pričakuješ našo pomoč, enostavno odgovori na to sporočilo.<br />Če pomoči ne potrebuješ več, te prosimo, da nam to sporočiš s klikom na spodnjo povezavo.<br /><a href="{resolve_url}">{resolve_url}</a>'
