adm.departments.agent_perms_explain: 'Agent permissions control which of your agents have permission to use a department. There are two different types of permissions:'
adm.departments.agent_perms_explain_assign: 'The <strong>assign</strong> permission lets agents assign tickets to a department, but <em>not view</em> tickets within the department.'
adm.departments.agent_perms_explain_chat: 'Agent permissions control which of your agents have permission to use a department.'
adm.departments.agent_perms_explain_full: 'The <strong>full access</strong> permission gives agents full access to the department including viewing and assigning tickets.'
adm.departments.agent_perms_explain_participant: 'Note that agents will always be able to see tickets assigned to them or their team, or that they are a follower of. So it is still possible an agent might see a ticket in a department they do not have access to if they are somehow added to the ticket.'
