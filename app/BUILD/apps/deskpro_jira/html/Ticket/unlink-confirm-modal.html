<div class="modal-header">
    <button type="button" class="close" ng-click="dismiss()"><span aria-hidden="true">&times;</span></button>
    <h3 class="modal-title text-danger">Are you sure you want to unlink this issue?</h3>
</div>
<div class="modal-body" ng-style="{maxHeight: meta.windowHeight() - 220, overflowY: 'auto'}">
    <div class="extended-merge">
        <div class="merge-data-wrap" style="margin: 0;">
            <table class="merge-data" width="100%">
                <tr class="header-row">
                    <td colspan="2" style="border-left: none;">
                        Issue ID: <a href="{{ issue.url }}" target="_blank">{{ issue.key }}</a>
                    </td>
                </tr>
                <tr ng-repeat="field in issue.filtered_fields">
                    <th style="text-align: left; text-wrap: none;" nowrap="nowrap">{{ meta.fieldName(field.id) }}</th>
                    <td width="100%">
                        <div ng-if="issue.renderedFields[field.id]" ng-bind-html="meta.fieldValue(field.id, field.value)">
                        </div>
                        <div ng-if="!issue.renderedFields[field.id]">
                            {{ meta.fieldValue(field.id, field.value) }}
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
<div class="modal-footer" style="text-align: center;">
    <button class="dp-btn" ng-click="confirm()">Yes, unlink issue</button>
    <button class="dp-btn" ng-click="dismiss()">Cancel</button>
</div>
