<div class="form-group">
	<div class="col-lg-4">
		<h3>Webhook URL</h3>
	</div>
	<div class="col-lg-8" ng-class="{'has-error': errors.webhook_url}">
		<input type="text" class="form-control" ng-model="setting_values.webhook_url" required="required" />
		<span class="help-block">
			This is the Webhook of your Slack channel. This can be created at <a href="https://my.slack.com/services/new/incoming-webhook/" target="_blank">https://my.slack.com/services/new/incoming-webhook/</a>
		</span>
	</div>
</div>

<div class="form-group">
	<div class="col-lg-4">
		<h3>Notify</h3>
	</div>
	<div class="col-lg-8">
		<label><input type="checkbox" ng-model="setting_values.notify" /> Yes</label>
		<span class="help-block">Notify channel members of a new message</span>
	</div>
</div>
