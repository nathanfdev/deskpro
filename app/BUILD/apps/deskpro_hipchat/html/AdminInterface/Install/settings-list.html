<div class="form-group">
	<div class="col-lg-4">
		<h3>API Token</h3>
	</div>
	<div class="col-lg-8">
		<input type="text" class="form-control" ng-model="setting_values.api_token" />
		<span class="help-block">
			This is the API token for HipChat account. This can be created at https://www.hipchat.com/admin/api
		</span>
	</div>
</div>

<div class="form-group">
	<div class="col-lg-4">
		<h3>Notify</h3>
	</div>
	<div class="col-lg-8">
		<label><input type="checkbox" ng-model="setting_values.notify" /> Yes</label>
		<span class="help-block">Notify room members of a new message</span>
	</div>
</div>
