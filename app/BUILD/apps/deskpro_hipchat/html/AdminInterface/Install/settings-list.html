<div class="form-group">
	<div class="col-lg-4">
		<h3>API Token</h3>
	</div>
	<div class="col-lg-8" ng-class="{'has-error': errors.api_token}">
		<input type="text" class="form-control" ng-model="setting_values.api_token" />
		<span class="help-block">
			This is the API token for HipChat account. This can be created at <a href="https://www.hipchat.com/admin/api" target="_blank">https://www.hipchat.com/admin/api</a>
		</span>
	</div>
</div>
<div class="form-group">
	<div class="col-lg-4">
		<h3>API Target</h3>
	</div>
	<div class="col-lg-8" ng-class="{'has-error': errors.api_target}">
		<input type="text" class="form-control" ng-model="setting_values.api_target" />
		<span class="help-block">
			Enter the base URL to your HipChat API. Leave this blank to use the default (for the hosted version of HipChat).
		</span>
	</div>
</div>
<div class="form-group">
	<div class="col-lg-4">
		<h3>Notify</h3>
	</div>
	<div class="col-lg-8">
		<label><input type="checkbox" ng-model="setting_values.notify" /> Yes</label>
		<span class="help-block">Notify room members of a new message</span>
	</div>
</div>
