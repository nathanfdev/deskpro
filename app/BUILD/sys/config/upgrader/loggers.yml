monolog:
  channels:
    - upgrader.general
    - upgrader.http

  handlers:
    logger.upgrader:
      type: group
      members: [logger.upgrader.stream, logger.upgrader.session]

    logger.upgrader.session:
      type: service
      id: dp.upgrader.session_log_handler

    logger.upgrader.stream:
      level: debug
      type: stream
      path: '%kernel.logs_dir%/upgrader.log'
      channels: [upgrader]
      formatter: deskpro.logging.line_formatter

    logger.upgrader.general:
      min_level: debug
      type: filter
      path: '%kernel.logs_dir%/upgrader.log'
      handler: logger.upgrader
      channels: [upgrader.general]

    logger.upgrader.http:
      min_level: info
      type: filter
      handler: logger.upgrader
      channels: [upgrader.http]

services:
  dp.upgrader.session_log_handler:
    class: DeskPRO\Bundle\UpgradeBundle\Session\SessionLogHandler
    arguments: ["@service_container"]
