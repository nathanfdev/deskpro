
parameters:
  # we override default symfony so warmer services are lazy-loaded
  # see LazyWarmersPass
  cache_warmer.class: DeskPRO\Bundle\AppBundle\HttpKernel\CacheWarmer\CacheWarmerServiceAggregate
  doctrine.dbal.connection_factory.class: DeskPRO\Bundle\AppBundle\Doctrine\ConnectionFactory
  templating.cache_warmer.template_paths.class: DeskPRO\Bundle\AppBundle\CacheWarmer\TemplatePathsCacheWarmer
  jms_serializer.twig_extension.class: DeskPRO\Bundle\AppBundle\Twig\SerializerExtension
  jms_serializer.json_serialization_visitor.class: DeskPRO\Bundle\AppBundle\Serializer\Visitor\JsonSerializationVisitor
  validator.email.class: DeskPRO\Bundle\AppBundle\Validator\Constraints\Person\Email\EmailFormatValidator
  portal.session.name: sess_data
  security.encoder_factory.generic.class: DeskPRO\Bundle\AppBundle\Security\Encoder\EncoderFactory

services:
  dp.url_request_context_factory:
    public: false
    class: DeskPRO\Bundle\AppBundle\Routing\UrlRequestContextFactory
    arguments:
      - "@service_container"

  dp.dynamic_context_router:
    class: DeskPRO\Bundle\AppBundle\Routing\RouterWithDynamicContext
    decorates: "router"
    arguments:
      - "@dp.dynamic_context_router.inner"
      - "@dp.url_request_context_factory"

  doctrine_cache.providers.metadata_cache:
    class: DeskPRO\Component\Doctrine\Common\Cache\FilesystemCache
    factory: [DeskPRO\Bundle\AppBundle\Doctrine\DoctrineMetadataCacheFactory, create]
    arguments: ["@deskpro.app_env"]

monolog:
  channels: # you MUST also update portal_config.yml if you change these
    - "dp.tickets.filters.tengine.dbal.engine"
    - "dp.tickets.filters.tengine.dbal.compiler"
    - "dp.tickets.filters.tengine.php.engine"
    - "dp.tickets.filters.tengine.php.compiler"
  handlers:
    main:
      type:     service
      id:       monolog.handler.deskpro_fingers_crossed

doctrine_mongodb:
    connections:
      default:
        server: "see MongoConnectionPass"
        options: {}
    default_database: dp_audit
    default_document_manager: default
    default_connection: default
    document_managers:
      default:
        mappings:
          AuditBundle:
            type: 'annotation'
            is_bundle: false
            dir: '%kernel.root_dir%/../src/DeskPRO/Bundle/AuditBundle/Document'
            prefix: 'DeskPRO\Bundle\AuditBundle\Document'
