services:
  request_type_classifier.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\RequestTypeClassifierListener
    tags:
      - { name: kernel.event_subscriber }

  exception_logger.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\ExceptionLoggerListener
    tags:
      - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 0 }

  preflight_checks.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\PreflightChecksListener
    arguments: ["@service_container"]
    tags:
      - { name: kernel.event_subscriber }

  license_listener.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\LicenseListener
    arguments: ["@service_container"]
    tags:
      - { name: kernel.event_subscriber }

  license_checks.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\LicenseCheckListener
    arguments: ["@service_container", "@deskpro.interface_info"]
    tags:
      - { name: kernel.event_subscriber }

  welcome_wizard.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\WelcomeWizardListener
    arguments: ["@service_container"]
    tags:
      - { name: kernel.event_subscriber }

  user_banning.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\UserBannedListener
    arguments: ["@service_container", "@deskpro.interface_info"]
    tags:
      - { name: kernel.event_subscriber }

  helpdesk_offline_low.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\HelpdeskOfflineLowListener
    arguments: ["@deskpro.interface_info", "@service_container", "@=service('deskpro.app_env').getUserCacheDir()"]
    tags:
      - { name: kernel.event_subscriber }

  helpdesk_offline_setting.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\HelpdeskOfflineSettingListener
    arguments: ["@deskpro.interface_info", "@service_container", "@brand_stack", "@=service('deskpro.app_env').getUserCacheDir()"]
    tags:
      - { name: kernel.event_subscriber }

  meta_generato.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\MetaGeneratorListener
    tags:
      - { name: kernel.event_subscriber }

  legacy_controller_events.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\LegacyControllerEventsListener
    arguments: ["@service_container"]
    tags:
      - { name: kernel.event_subscriber }

  segment_tracking.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\SegmentTrackingListener
    arguments: ["@security.token_storage", "@settings_resolver"]
    tags:
      - { name: kernel.event_subscriber, priority: -10 }

  bugsnag_js.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\BugsnagJsListener
    arguments: ["@deskpro.app_env"]
    tags:
      - { name: kernel.event_subscriber, priority: -10 }

  dp_scripts.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\DpScriptsListener
    arguments: ["@service_container"]
    tags:
      - { name: kernel.event_subscriber }

  event_listener.action_alerts:
    class: DeskPRO\Bundle\AppBundle\EventListener\ActionAlertsListener
    arguments: ["@service_container"]
    tags:
      - { name: kernel.event_subscriber }