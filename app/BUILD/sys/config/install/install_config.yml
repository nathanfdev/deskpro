parameters:
  locale: en

framework:
  secret: deskpro_installer
  default_locale: en

services:
  deskpro.low_dp_env:
    class: DpRun\DpEnv
    factory: [DeskPRO\Bundle\AppBundle\AppEnv\LowDpEnvGetter, getDpEnv]
  deskpro.app_env:
    class: DeskPRO\Bundle\AppBundle\AppEnv\AppEnvInterface
    factory: [DeskPRO\Bundle\AppBundle\AppEnv\AppEnvFactory, create]
  install.session_manager:
    class: DeskPRO\Bundle\InstallBundle\InstallSession\SessionManager
    arguments:
      - "@=service('deskpro.app_env').getUserTmpDir()"

  dp.software_service.stats:
    class: DeskPRO\Bundle\AppBundle\SoftwareService\StatService\StatService
    arguments:
      - "@=service('deskpro.app_env').getConfig('settings.software_services.stats.endpoint')"
      - "@=parameter('kernel.environment') === 'prod' && !service('deskpro.app_env').getConfig('settings.software_services.stats.disabled') && service('deskpro.app_env').getConfig('env.server_id') !== 'builder.deskprodemo.com'"

doctrine:
  dbal:
    types:
      dpblob:           Application\\DeskPRO\\DBAL\\Types\\DpBlobType
      dpblob_file:      Application\\DeskPRO\\DBAL\\Types\\DpBlobFileType
      dp_json_obj:      Application\\DeskPRO\\DBAL\\Types\\DpJsonObject
      array:            Application\\DeskPRO\\DBAL\\Types\\DpArrayType
      object:           Application\\DeskPRO\\DBAL\\Types\\DpObjectType

monolog:
  handlers:
    main:
      type: stream
      path: "%kernel.logs_dir%/installer.log"
      level: debug
    console:
      type: console
