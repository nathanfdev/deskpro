# ----------------------------------------------------------------------------------------------------------------------
# READ ME
# ----------------------------------------------------------------------------------------------------------------------
#
# 1) To pass the base_url option to mink you can use BEHAT_PARAMS environment variable:
#    export BEHAT_PARAMS='{"extensions":{"Behat\\MinkExtension":{"base_url":"http://localhost/"}}}'
#
# ----------------------------------------------------------------------------------------------------------------------

api:
    suites:
        api:
            paths:
                - %paths.base%/features/api
                - %paths.base%/features/term-engine
            contexts:
                - DpBehat\DataSetContext:
                    dataset_manager: @dataset_manager
                - Behat\MinkExtension\Context\MinkContext
                - behatch:json
                - DpBehat\Api\RestContext
                - DpBehat\Api\AuthContext
                - DpBehat\TermEngine\TermEngineBehatContext
                - DpBehat\Api\PeopleContext
                - DpBehat\Api\AgentsContext
                - DpBehat\PermissionContext
                - DpBehat\Api\ModesAndTagsContext
                - DpBehat\Api\ApiLogContext
                - DpBehat\Api\ApiLimitsContext
                - DpBehat\Api\NotificationsContext
                - DpBehat\Portal\GenericContext
                - DpBehat\BlobContext
                - DpBehat\System\Alerts\IncidentsContext
    extensions:
        Sanpi\Behatch\Extension: ~
        Behat\MinkExtension:
            default_session: default
            sessions:
                default:
                    symfony2: ~
        Behat\Symfony2Extension:
            kernel:
                bootstrap: features/bootstrap/boot.php
                path: ../sys/Kernel/ApiKernel.php
                class: DpSys\Kernel\ApiKernel
                env: test
                debug: true

install:
    suites:
        install:
            paths:
                - %paths.base%/features/install
            contexts:
                - Behat\MinkExtension\Context\MinkContext
                - DpBehat\E2E\E2EContext
                - DpBehat\Install\ServerInfoContext
    extensions:
        Behat\MinkExtension:
            default_session: default
            sessions:
                default:
                    goutte: ~
        Behat\Symfony2Extension:
            kernel:
                bootstrap: features/bootstrap/boot.php
                path: ../sys/Kernel/InstallKernel.php
                class: DpSys\Kernel\InstallKernel
                env: test
                debug: true

portal:
    suites:
        portal:
            paths:
                - %paths.base%/features/portal
            contexts:
                - Behat\MinkExtension\Context\MinkContext
                - DpBehat\Portal\TestsContext
                - behatch:json
                - behatch:rest
                - DpBehat\LanguageContext
                - DpBehat\Portal\PortalModeContext
                - DpBehat\Portal\PortalBrandThemeContext
                - DpBehat\Portal\AuthContext
                - DpBehat\Portal\RouterContext
                - DpBehat\Portal\TicketsContext
                - DpBehat\Portal\ContentContext
                - DpBehat\Portal\GenericContext
                - DpBehat\Portal\TicketContext
                - DpBehat\Http\HttpContext
                - DpBehat\DataSetContext:
                    dataset_manager: @dataset_manager
                - DpBehat\Portal\Api\AuthContext
                - DpBehat\Portal\Api\ChatContext
                - DpBehat\Portal\PortalDesigner\AssetsContext
    extensions:
        Sanpi\Behatch\Extension: ~
        Behat\MinkExtension:
            default_session: default
            sessions:
                default:
                    symfony2: ~
                goutte:
                    goutte: ~

        Behat\Symfony2Extension:
            kernel:
                bootstrap: features/bootstrap/boot.php
                path: ../sys/Kernel/PortalKernel.php
                class: DpSys\Kernel\PortalKernel
                env: test
                debug: true
        SensioLabs\Behat\PageObjectExtension:
            namespaces:
                page: DpBehat\Portal\Page
                element: DpBehat\Portal\Page\Element
            factory:
                page_parameters:
                    base_url: /

production:
    suites:
        production:
            paths:
                - %paths.base%/features/production
            contexts:
                - Behat\MinkExtension\Context\MinkContext
                - behatch:json
                - DpBehat\Api\RestContext
                - DpBehat\Portal\AuthContext
                - DpBehat\Http\HttpContext
                - DpBehat\System\Alerts\EventsContext
                - DpBehat\ProductionModeContext
                - DpBehat\DataSetContext:
                    dataset_manager: @dataset_manager
    extensions:
        Sanpi\Behatch\Extension: ~
        Behat\MinkExtension:
            default_session: default
            sessions:
                default:
                    goutte: ~
        Behat\Symfony2Extension:
            kernel:
                bootstrap: features/bootstrap/boot.php
                path: ../sys/Kernel/ApiKernel.php
                class: DpSys\Kernel\ApiKernel
                env: test
                debug: false
        SensioLabs\Behat\PageObjectExtension:
            namespaces:
                page: DpBehat\Portal\Page
                element: DpBehat\Portal\Page\Element
            factory:
                page_parameters:
                    base_url: /
