  # Entity handlers
  dp.importer.writer.entity_handler_registry:
    class: Application\ImportBundle\Writer\EntityHandler\EntityHandlerRegistry
    arguments: ["@service_container"]

  dp.importer.writer.entity_handler.download:
    class: Application\ImportBundle\Writer\EntityHandler\DownloadHandler
    arguments: ["@dp.importer.writer.mapper_registry", "@dp.importer_logger", "@dp.importer.helper.blob_adapter"]
