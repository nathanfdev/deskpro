services:

  dp.importer_logger:
    class: Monolog\Logger
    arguments: ["importer"]

  dp.importer.exporter_reader:
    class: Application\ImportBundle\Exporter\Reader\JsonReader

  dp.importer.exporter:
    class: Application\ImportBundle\Exporter\Exporter
    arguments: ["@dp.importer.exporter_reader", "@serializer", "@dp.importer_logger"]

  dp.importer.writer:
    class: Application\ImportBundle\Writer\Writer
    arguments:
      - "@dp.importer.writer.entity_handler_registry"
      - "@doctrine.orm.entity_manager"
      - "@deskpro.search.entity_listener"
      - "@dp.importer_logger"

  dp.importer:
    class: Application\ImportBundle\Importer\Importer
    arguments: ["@dp.importer.exporter", "@validator", "@dp.importer.writer", "@serializer", "@dp.importer_logger"]

  dp.importer.entity_persister:
    class: Application\ImportBundle\Writer\EntityPersister
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@ticket_manager"
      - "@validator"
      - "@dp.importer.writer.mapper.import_map"
      - "@dp.importer_logger"

  # Script helpers
  dp.importer.script_helper.writer:
    class: Application\ImportBundle\ScriptHelper\WriteHelper
    arguments: ["@serializer", "@validator", "@form_error.validator_errors_generator.api", "@dp.importer_logger"]

  dp.importer.script_helper.output:
    class: Application\ImportBundle\ScriptHelper\OutputHelper
    arguments: ["@dp.importer_logger"]

  dp.importer.script_helper.db:
    class: Application\ImportBundle\ScriptHelper\DbHelper
    arguments: ["@dp.importer_logger"]

  # Mappers
  dp.importer.writer.mapper_registry:
    class: Application\ImportBundle\Writer\Mapper\MapperRegistry
    arguments: ["@service_container"]

  dp.importer.writer.mapper.article:
    class: Application\ImportBundle\Writer\Mapper\ArticleMapper
    arguments: ["@doctrine.orm.entity_manager"]
    tags:
      - { name: dp.importer.writer.mapper }

  dp.importer.writer.mapper.article_category:
    class: Application\ImportBundle\Writer\Mapper\ArticleCategoryMapper
    arguments: ["@doctrine.orm.entity_manager"]
    tags:
      - { name: dp.importer.writer.mapper }

  dp.importer.writer.mapper.article_attachment:
