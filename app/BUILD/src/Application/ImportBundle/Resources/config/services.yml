imports:
  - { resource: mappers.yml }
  - { resource: helpers.yml }
  - { resource: entity_handlers.yml }

services:

  dp.importer_logger:
    class: Monolog\Logger
    arguments: ["importer"]

  dp.importer.parser_reader:
    class: Application\ImportBundle\Parser\Reader\JsonReader

  dp.importer.parser:
    class: Application\ImportBundle\Parser\Parser
    arguments: ["@dp.importer.parser_reader", "@serializer", "@dp.importer_logger"]

  dp.importer.writer:
    class: Application\ImportBundle\Writer\Writer
    arguments:
      - "@dp.importer.writer.entity_handler_registry"
      - "@doctrine.orm.entity_manager"
      - "@deskpro.search.entity_listener"
      - "@dp.importer_logger"

  dp.importer:
    class: Application\ImportBundle\Importer\Importer
    arguments:
      - "@dp.importer.parser"
      - "@validator"
      - "@dp.importer.writer"
      - "@serializer"
      - "@dp.importer.writer.entity_handler_registry"
      - "@dp.importer_logger"

  dp.importer.entity_persister:
    class: Application\ImportBundle\Writer\EntityPersister
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@ticket_manager"
      - "@validator"
      - "@dp.importer.writer.mapper.import_map"
      - "@dp.importer_logger"
