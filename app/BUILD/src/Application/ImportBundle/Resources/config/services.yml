services:

  dp.importer_logger:
    class: Monolog\Logger
    arguments: ["importer"]

  # validator annotations are disabled for most kernels
  # force enable them for the importer
  dp.importer_validator:
    class: Symfony\Component\Validator\Validator\RecursiveValidator
    factory: ['Application\ImportBundle\Validator\ImporterValidatorFactory', getValidator]
    arguments: ['@service_container']

  dp.importer.parser_reader:
    class: Application\ImportBundle\Parser\Reader\JsonReader

  dp.importer.parser:
    class: Application\ImportBundle\Parser\Parser
    arguments: ["@dp.importer.parser_reader", "@serializer", "@dp.importer_logger"]

  dp.importer.writer:
    class: Application\ImportBundle\Writer\Writer
    arguments:
      - "@dp.importer.writer.entity_handler_registry"
      - "@doctrine.orm.entity_manager"
      - "@deskpro.search.entity_listener"
      - "@serializer"
      - "@deskpro.app_env"
      - "@dp.importer_logger"

  dp.importer:
    class: Application\ImportBundle\Importer\Importer
    arguments:
      - "@dp.importer.parser"
      - "@dp.importer_validator"
      - "@dp.importer.writer"
      - "@serializer"
      - "@dp.importer.writer.entity_handler_registry"
      - "@dp.importer_logger"

  dp.importer.entity_persister:
    class: Application\ImportBundle\Writer\EntityPersister
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@ticket_manager"
      - "@dp.importer_validator"
      - "@dp.importer.writer.mapper.import_map"
      - "@dp.importer_logger"

  dp.importer.csv:
    class: Application\ImportBundle\CsvImport\CsvImporter
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@dp.importer"
      - "@dp.importer.parser"
      - "@mailer"
      - "@deskpro.core.translate"
      - "@email.user_viewmodel_factory"
      - "@email.email_sender"
      - "@deskpro.feature_flags"
