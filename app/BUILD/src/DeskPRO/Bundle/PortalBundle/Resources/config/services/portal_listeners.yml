services:

  redirect_protection_listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\RedirectProtectionListener
    arguments: ["@brand_stack", "@url_host_checker", "@logger"]
    tags:
      - { name: kernel.event_subscriber }

  visitor_identification.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\VisitorIdentificationListener
    arguments: ["@visitor_identification_provider", "@logger"]
    tags:
      - { name: kernel.event_subscriber }

  brand_detector.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\BrandDetectionListener
    arguments:
      - "@brand_stack"
      - "@settings_resolver"
      - "@brand_repository"
      - "@default_brand_finder"
      - "@portal_mode_storage"
      - "@logger"
      - "@url_host_checker"
    tags:
      - { name: kernel.event_subscriber }

  brand_access.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\BrandAccessListener
    arguments:
      - "@brand_stack"
      - "@security.token_storage"
    tags:
      - { name: kernel.event_subscriber }

  disabled_helpdesk.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\DisabledHelpdeskListener
    arguments: ["@brand_stack", "@settings_resolver", "@logger"]
    tags:
      - { name: kernel.event_subscriber }

  disabled_portal.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\DisabledPortalListener
    arguments:
      - "@brand_stack"
      - "@settings_resolver"
      - "@logger"
      - "@templating"
      - "@portal_mode_storage"
      - "@security.token_storage"
    tags:
      - { name: kernel.event_subscriber }

  cookie_settings.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\CookieSettingsListener
    tags:
      - { name: kernel.event_subscriber }

  google_analytics.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\GoogleAnalyticsListener
    arguments: ["@settings_resolver"]
    tags:
      - { name: kernel.event_subscriber }

  embed_widget_defaults.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\EmbedWidgetDefaultsListener
    arguments: ["@portal_mode_storage"]
    tags:
      - { name: kernel.event_subscriber }

  iframe_resizer.listener:
      class: DeskPRO\Bundle\PortalBundle\EventListener\IframeResizerListener
      arguments: ["@portal_mode_storage"]
      tags:
        - { name: kernel.event_subscriber }

  portal_mode.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\PortalModeListener
    arguments: ["@portal_mode_factory", "@portal_mode_storage", "@logger"]
    tags:
      - { name: kernel.event_subscriber }

  original_uri.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\OriginalUriListener
    tags:
      - { name: kernel.event_subscriber }

  redirect_to_url_exception.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\RedirectToUrlExceptionListener
    arguments: ["@logger", "@?url_corrector_factory", "@?brand_stack"]
    tags:
      - { name: kernel.event_subscriber }

  redirect_permanent_exception.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\PermanentRedirectExceptionListener
    arguments: ["@router", "@logger"]
    tags:
      - { name: kernel.event_subscriber }

  logout_exception.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\LogoutExceptionRedirectListener
    arguments:
      - "@router"
      - "portal_logout_confirm"
    tags:
      - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 0 }

  api_exception.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\ApiExceptionListener
    tags:
      - { name: kernel.event_subscriber}

  no_ticket_access_redirect.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\NoTicketAccessRedirectListener
    arguments:
      - "@security.token_storage"
      - "@doctrine.orm.default_entity_manager"
      - "@router"
    tags:
      - { name: kernel.event_subscriber}

  user_disabled.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\UserDisabledListener
    arguments:
      - "@security.token_storage"
    tags:
      - { name: kernel.event_subscriber}

  controller_name_converter:
      class: DeskPRO\Bundle\PortalBundle\HttpKernel\ControllerNameParser
      tags: [{name: monolog.logger, channel: request}]
      arguments: ["@kernel", "@brand_stack", "@portal_brand_theme_loader"]

  tag_options.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\TagOptionsListener
    arguments: ["@annotation_reader", "@service_container"]
    tags:
      - { name: kernel.event_subscriber }

# Not kernel listeners, but tagged to be called by other listeners
  param_converter.portal_api_chat_conversation:
    class: DeskPRO\Bundle\PortalBundle\Request\ApiChatConversationConverter
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
      - { name: request.param_converter, priority: -1, converter: portal_api_chat }

  param_converter.deskpro_slug:
    class: DeskPRO\Bundle\PortalBundle\Request\DeskproSlugConverter
    arguments: ["@doctrine.orm.default_entity_manager", "@content_slug_manager"]
    tags:
      - { name: request.param_converter, priority: -1, converter: deskpro_slug }

  param_converter.tag_request:
    class: DeskPRO\Bundle\PortalBundle\Request\TagRequestConverter
    arguments: ["@brand_stack", "@portal_brand_theme_loader"]
    tags:
      - { name: request.param_converter, priority: 1, converter: tag_request }

  data_collector.portal:
    class: DeskPRO\Bundle\PortalBundle\DataCollector\PortalCollector
    arguments: ["@brand_stack", "@portal_brand_theme_loader", "@language_stack", "@portal_mode_storage"]
    tags:
      - { name: data_collector, template: "PortalBundle:Collector:portal.html.twig", id: "portal" }

  start_session.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\StartSessionListener
    arguments: ["@session"]
    tags:
      - { name: kernel.event_subscriber }
