parameters:
  dp_sys.alerts.email.from: "noreply@deskpro.com"
  dp_sys.alerts.email.incident_raised_admins_message: >
    Hi, this is automatically generated by DeskPRO notification about "{{incident_title}}" incident that has just
    happened and which needs your attention (all admins were notified). We recommend you to visit the
    "System -> Incidents" sections in DeskPRO admin area to check the list of all isues with specific instructions on
    fixing them.

services:

  # --------------------------------------------------------------------------------------------------------------------
  # Common services
  # --------------------------------------------------------------------------------------------------------------------

  dp_sys.alerts.event_logger:
    class: DeskPRO\Bundle\SystemBundle\SystemAlerts\EventLogger
    arguments:
      - "@doctrine.orm.system_entity_manager"

  dp_sys.alerts.monolog_handler:
    class: DeskPRO\Bundle\SystemBundle\SystemAlerts\Bridge\SystemAlertsMonologHandler
    arguments:
      - "@service_container"

  dp_sys.alerts.incident_manager:
    class: DeskPRO\Bundle\SystemBundle\SystemAlerts\IncidentManager
    arguments:
      - "@dp_sys.alerts.triggering_process"
      - "@doctrine.orm.system_entity_manager"

  dp_sys.alerts.triggering_process:
    class: DeskPRO\Bundle\SystemBundle\SystemAlerts\Triggering\TriggeringProcess
    arguments:
      - "@doctrine.orm.system_entity_manager"

  dp_sys.alerts.instructions_generator:
    class: DeskPRO\Bundle\SystemBundle\SystemAlerts\Instructions\InstructionsGenerator
    arguments:
      - "@twig"
    calls:
      - [addIncidentTemplate, ["Email\IncomingEmailFailureIncident", "Email:incoming-failure.html.twig"]]
      - [addIncidentTemplate, ["Email\OutgoingEmailFailureIncident", "Email:outgoing-failure.html.twig"]]

  # --------------------------------------------------------------------------------------------------------------------
  # Trigger services
  # --------------------------------------------------------------------------------------------------------------------

  dp_sys.alerts.incoming_email_failure_trigger:
    class: DeskPRO\Bundle\SystemBundle\SystemAlerts\Triggering\Trigger\Email\IncomingEmailFailureTrigger
    arguments:
      - "@doctrine.orm.system_entity_manager"
    tags:
      -  { name: dp_sys.alerts.trigger }
    calls:
      - [setSilenceTime, [10]]
      -
        - setRaisedCallback
        -
          - ["@dp_sys.alerts.email_notification_action", "notifyAdmins"]
          -
            - "%dp_sys.alerts.email.from%"
            - "DeskPRO incoming email continuing failures"
            - "%dp_sys.alerts.email.incident_raised_admins_message%"

  dp_sys.alerts.outgoing_email_failure_trigger:
    class: DeskPRO\Bundle\SystemBundle\SystemAlerts\Triggering\Trigger\Email\OutgoingEmailFailureTrigger
    arguments:
      - "@doctrine.orm.system_entity_manager"
    tags:
      -  { name: dp_sys.alerts.trigger }
    calls:
      - [setSilenceTime, [10]]
      -
        - setRaisedCallback
        -
          - ["@dp_sys.alerts.email_notification_action", "notifyAdmins"]
          -
            - "%dp_sys.alerts.email.from%"
            - "DeskPRO outgoing email continuing failures"
            - "%dp_sys.alerts.email.incident_raised_admins_message%"

  # --------------------------------------------------------------------------------------------------------------------
  # Trigger action services
  # --------------------------------------------------------------------------------------------------------------------

  dp_sys.alerts.email_notification_action:
    class: DeskPRO\Bundle\SystemBundle\SystemAlerts\Action\EmailNotificationAction
    arguments:
      - "@mailer"
      - "@=service('doctrine.orm.default_entity_manager').getRepository('DeskPRO:Person')"

  # --------------------------------------------------------------------------------------------------------------------
  # Incident subject listeners
  # --------------------------------------------------------------------------------------------------------------------

  dp_sys.alerts.email_account_entity_listener:
    public: false
    class: DeskPRO\Bundle\SystemBundle\SystemAlerts\SubjectListeners\Email\EmailAccountListener
    arguments:
      - "@service_container"
    tags:
      - { name: doctrine.event_listener, event: preUpdate }
      - { name: doctrine.event_listener, event: preRemove }
