services:
  DeskPRO\Bundle\AppStoreBundle\Domain\AppBundleValidator:
    class: DeskPRO\Bundle\AppStoreBundle\Domain\AppBundleValidator
    factory: [DeskPRO\Bundle\AppStoreBundle\Infrastructure\Services, createAppBundleValidator]
    arguments: ["@file_locator"]

  apps2.application_manager:
    class: DeskPRO\Bundle\AppStoreBundle\Infrastructure\ApplicationManagerService
    arguments: ["@doctrine.orm.default_entity_manager", "@blob.storage"]

  DeskPRO\Bundle\AppStoreBundle\Infrastructure\ApplicationState\AccessService:
    class: DeskPRO\Bundle\AppStoreBundle\Infrastructure\ApplicationState\AccessService
    factory: [DeskPRO\Bundle\AppStoreBundle\Infrastructure\Services, createApplicationStateAccessService]
    arguments: ["@doctrine.orm.default_entity_manager"]

  DeskPRO\Bundle\AppStoreBundle\Domain\ApplicationInstanceFinder:
    class: DeskPRO\Bundle\AppStoreBundle\Domain\ApplicationInstanceFinder
    factory: [DeskPRO\Bundle\AppStoreBundle\Infrastructure\Services, createApplicationInstanceFinder]
    arguments: ["@doctrine.orm.default_entity_manager"]

  DeskPRO\Bundle\AppStoreBundle\Domain\AssetFinder:
    class: DeskPRO\Bundle\AppStoreBundle\Domain\AssetFinder
    factory: [DeskPRO\Bundle\AppStoreBundle\Infrastructure\Services, createApplicationAssetService]
    arguments: ["@doctrine.orm.default_entity_manager"]

  DeskPRO\Bundle\AppStoreBundle\Domain\ApplicationFinder:
    class: DeskPRO\Bundle\AppStoreBundle\Domain\ApplicationFinder
    factory: [DeskPRO\Bundle\AppStoreBundle\Infrastructure\Services, createApplicationFinder]
    arguments: ["@doctrine.orm.default_entity_manager"]

  DeskPRO\Bundle\AppStoreBundle\Domain\ApplicationStateFinder:
    class: DeskPRO\Bundle\AppStoreBundle\Domain\ApplicationStateFinder
    factory: [DeskPRO\Bundle\AppStoreBundle\Infrastructure\Services, createApplicationStateFinder]
    arguments: ["@doctrine.orm.default_entity_manager"]

  DeskPRO\Bundle\AppStoreBundle\ParamConverter\StateFilterParamConverter:
    class: DeskPRO\Bundle\AppStoreBundle\ParamConverter\StateFilterParamConverter
    factory: [DeskPRO\Bundle\AppStoreBundle\ParamConverter\ParamConverters, createStateFilterConverter]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\AppStoreBundle\ParamConverter\StateFilterParamConverter }

  DeskPRO\Bundle\AppStoreBundle\ParamConverter\AssetFilterParamConverter:
    class: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AssetFilterParamConverter
    factory: [DeskPRO\Bundle\AppStoreBundle\ParamConverter\ParamConverters, createAssetFilterConverter]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AssetFilterParamConverter }

  DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppInstanceParamConverter:
    class: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppInstanceParamConverter
    factory: [DeskPRO\Bundle\AppStoreBundle\ParamConverter\ParamConverters, createAppInstanceConverter]
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppInstanceParamConverter }

  DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppParamConverter:
    class: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppParamConverter
    factory: [DeskPRO\Bundle\AppStoreBundle\ParamConverter\ParamConverters, createAppConverter]
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppParamConverter }

  DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppStateParamConverter:
    class: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppStateParamConverter
    factory: [DeskPRO\Bundle\AppStoreBundle\ParamConverter\ParamConverters, createAppStateConverter]
    arguments: ["@doctrine.orm.default_entity_manager", "@security.token_storage"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppStateParamConverter }

  DeskPRO\Bundle\AppStoreBundle\ParamConverter\OauthProviderConnectionLoaderConverter:
    class: DeskPRO\Bundle\AppStoreBundle\ParamConverter\OauthProviderConnectionLoaderConverter
    factory: [DeskPRO\Bundle\AppStoreBundle\ParamConverter\ParamConverters, createOauthProviderConnectionLoader]
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\AppStoreBundle\ParamConverter\OauthProviderConnectionLoaderConverter }

  DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppZipArchiveBundleParamConverter:
    class: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppZipArchiveBundleParamConverter
    factory: [DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppZipArchiveBundleParamConverter, createFromGlobals]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppZipArchiveBundleParamConverter }

  DeskPRO\Bundle\AppStoreBundle\ParamConverter\SerializedParamConverter:
    class: DeskPRO\Bundle\AppStoreBundle\ParamConverter\SerializedParamConverter
    arguments: ["@jms_serializer"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\AppStoreBundle\ParamConverter\SerializedParamConverter }

  DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppStateOptionsConverter:
    class: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppStateOptionsConverter
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\AppStoreBundle\ParamConverter\AppStateOptionsConverter }

  DeskPRO\Bundle\AppStoreBundle\TypeMapping\StateScopeJmsHandler:
    class: DeskPRO\Bundle\AppStoreBundle\TypeMapping\StateScopeJmsHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }
