services:

  # Same translator config as the DpKernel uses
  deskpro.core.translate:
    class: Application\DeskPRO\Translate\Translate
    arguments: [ "@deskpro.core.translate_loader", "@event_dispatcher" ]

  deskpro.core.translate_loader_system:
    class: Application\DeskPRO\Translate\Loader\SystemLoader
    arguments: [ [ %kernel.root_dir% ~ '/../locales' ] ]

  deskpro.core.translate_loader_db:
    class: Application\DeskPRO\Translate\Loader\DbLoader
    arguments: [ "@doctrine.dbal.default_connection" ]

  deskpro.core.translate_loader:
    class: Application\DeskPRO\Translate\Loader\DeskproLoader
    calls:
     - [setSystemLoader, ["@deskpro.core.translate_loader_system"] ]
     - [setDbLoader, ["@deskpro.core.translate_loader_db"] ]

  language_stack_initializer.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\Language\LanguageStackInitializeListener
    arguments: ["@language_manager", "@?portal_mode_storage", "@logger", "@doctrine.orm.default_entity_manager"]
    tags:
      - { name: kernel.event_subscriber }

  last_language.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\Language\LastLanguageListener
    arguments: ["@language_stack", "@logger"]
    tags:
      - { name: kernel.event_subscriber }

  language_manager:
    class: DeskPRO\Bundle\AppBundle\Language\LanguageManager
    arguments: ["@deskpro.core.translate", "@language_stack", "@doctrine.orm.default_entity_manager"]

  language_stack:
    class: DeskPRO\Bundle\AppBundle\Language\LanguageStack
    arguments: [ "@settings_resolver", "@doctrine.orm.default_entity_manager" ]

  language_repository:
    class: Application\DeskPRO\EntityRepository\Language
    factory: ["@doctrine.orm.default_entity_manager", getRepository]
    arguments: ['DeskPRO:Language']

  language_extension.twig:
    class: DeskPRO\Bundle\AppBundle\Twig\LanguageExtension
    arguments: ["@language_manager"]
    tags:
      - { name: twig.extension }
