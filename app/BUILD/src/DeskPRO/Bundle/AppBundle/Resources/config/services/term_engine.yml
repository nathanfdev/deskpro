services:

  # NOTE: AppBundle\Doctrine\TermEngineTermType instantiates this directly because it cant use it as a service
  term_to_json_converter:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Util\TermToJsonConverter

  term_engine.expression_language:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Expression\TermEngineExpressionLanguage

  term_engine.log_handler:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Log\TermEngineHandler
    arguments:
      - %kernel.logs_dir%
      - "termengine.log"

  dp.app.term_engine.tickets_select_criteria:
    class: DeskPRO\Bundle\AppBundle\DataService\Tickets\TicketsSelectCriteria
    arguments:
      - @=service('doctrine.orm.default_entity_manager').getRepository('App:TicketFilter')