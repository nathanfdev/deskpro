services:

  # Note: SecurityHeadersResponseListener's service is defined in config.shared.php as it is used globally

  event_listener.auto_post_on_get_request:
    class: DeskPRO\Bundle\AppBundle\EventListener\AutoPostOnGetRequestListener
    tags:
      - { name: kernel.event_subscriber }

  event_listener.anti_abuse_exception_listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\AntiAbuse\AntiAbuseExceptionListener
    tags:
      - { name: kernel.event_subscriber }

  dp.api.event_listeners.label_entity:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\LabelListener
    tags:
      - { name: doctrine.event_listener, event: postPersist }
      - { name: doctrine.event_listener, event: postRemove }

  dp.api.event_listeners.ticket_follow_up_entity:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\TicketFollowUpListener
    arguments: ["@service_container"]
    tags:
      - { name: doctrine.event_listener, event: postPersist }
      - { name: doctrine.event_listener, event: postUpdate }
      - { name: doctrine.event_listener, event: preRemove }

  dp.api.event_listeners.snippet_entity:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\SnippetListener
    arguments: ["@service_container"]
    tags:
      - { name: doctrine.event_listener, event: postPersist }
      - { name: doctrine.event_listener, event: postUpdate }
      - { name: doctrine.event_listener, event: preRemove }
      - { name: doctrine.event_listener, event: onFlush }

  event_listener.object_translatable:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\ObjectTranslatableListener
    tags:
      - { name: doctrine.event_subscriber, connection: default }

  event_listener.phrase_translatable:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\PhraseTranslatableListener
    tags:
      - { name: doctrine.event_subscriber, connection: default }

  event_listener.custom_per_data:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\CustomPerDataListener
    tags:
      - { name: doctrine.event_subscriber, connection: default }

  event_listener.agent_message:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\AgentChatMessageListener
    arguments: ["@event_dispatcher"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.voice_account:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\Voice\VoiceAccountListener
    arguments: ["@twilio_adapter", "@doctrine.orm.default_entity_manager", "@router"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.voice_queue:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\Voice\VoiceQueueListener
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.voice_worker:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\Voice\VoiceWorkerListener
    arguments: ["@twilio_adapter", "@doctrine.orm.default_entity_manager", "@event_dispatcher"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.voice_number:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\Voice\VoiceNumberListener
    arguments: ["@twilio_adapter", "@doctrine.orm.default_entity_manager", "@event_dispatcher"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.voice_settings:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\Voice\VoiceSettingsListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@event_dispatcher"
    tags:
      - { name: doctrine.entity_listener }

  event_listener.voice_agent_target:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\Voice\VoiceAgentTargetListener
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.person_email:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\PersonEmailListener
    arguments: ["@email.email_account_manager", "@validator"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.person:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\PersonListener
    arguments: ["@doctrine.orm.default_entity_manager", "@settings_resolver"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.custom_data_ticket:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\CustomDataChangeListener
    tags:
      - { name: doctrine.entity_listener }

  event_listener.brand_listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\Doctrine\BrandListener
    arguments: ["@default_brand_finder", "@doctrine.orm.default_entity_manager"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.listener.client_message_listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\ClientMessage\ClientMessageListener
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@jms_serializer.serializer"
    tags:
      - { name: kernel.event_subscriber }

  annotations_cache_warmer:
    class: DeskPRO\Bundle\AppBundle\CacheWarmer\AnnotationsCacheWarmer
    arguments: ["@service_container"]
    tags:
      - { name: 'kernel.cache_warmer' }

  iface_url_corrector.listener:
    class: DeskPRO\Bundle\PortalBundle\EventListener\InterfaceUrlCorrectorEventListener
    arguments: ["@deskpro.interface_info", "@logger"]
    tags:
      - { name: kernel.event_subscriber }

  url_corrector.listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\UrlCorrectorEventListener
    arguments: ["@deskpro.interface_info", "@brand_stack", "@portal_mode_storage", "@url_corrector_factory", "@logger"]
    tags:
      - { name: kernel.event_subscriber }
