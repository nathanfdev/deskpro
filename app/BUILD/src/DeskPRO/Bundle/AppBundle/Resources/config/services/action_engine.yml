services:

  action_engine.feedback:
    class: DeskPRO\Bundle\AppBundle\ActionEngine\Services\FeedbackApplicatorService
    arguments:
      - "@service_container"
  action_engine.feedback_comments:
    class: DeskPRO\Bundle\AppBundle\ActionEngine\Services\FeedbackCommentApplicatorService
    arguments:
      - "@service_container"
  action_engine.tasks:
    class: DeskPRO\Bundle\AppBundle\ActionEngine\Services\TaskApplicatorService
    arguments:
      - "@service_container"
  action_engine.tickets:
    class: DeskPRO\Bundle\AppBundle\ActionEngine\Services\TicketApplicatorService
    arguments:
      - "@service_container"
  action_engine.tickets.delete:
    class: DeskPRO\Bundle\AppBundle\ActionEngine\Applicators\Tickets\ApplyDeleteAction
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@ticket_manager"
  action_engine.tickets.set_status:
    class: DeskPRO\Bundle\AppBundle\ActionEngine\Applicators\Tickets\ApplySetStatusAction
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@ticket_manager"
  action_engine.tickets.mark_as_spam:
    class: DeskPRO\Bundle\AppBundle\ActionEngine\Applicators\Tickets\ApplyMarkAsSpamAction
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@ticket_manager"

