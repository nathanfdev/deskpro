services:

  # DATA TRANSFORMERS
  #
  # NOTE: If you are making a transformer and no dependency injection is needed, you don't need
  # to make it a service. Instead, you can make a class name by convention.
  # For example the transformer for the type "sandbox_widget" just make the class:
  # DeskPRO\Bundle\AppBundle\DataSerializer\DataTransformer\FooBarTransformer
  #
  # note: you don't need a tag for these to work. just make the prefix the same.
  #       to reference this transformer, just use "foo_bar" (ignore the prefix when using).

  data_serializer.transformer.widget_person:
    class: DeskPRO\Bundle\AppBundle\DataSerializer\DataTransformer\WidgetPersonTransformer
    arguments:
      - "@avatar_resolver"

  data_serializer.transformer.theme_set_asset:
    class: DeskPRO\Bundle\AppBundle\DataSerializer\DataTransformer\ThemeSetAssetTransformer
    arguments:
      - "@router"

  data_serializer.transformer.agent_alert:
    class: DeskPRO\Bundle\AppBundle\DataSerializer\DataTransformer\AgentAlertTransformer
    arguments:
      - "@doctrine.orm.default_entity_manager"

  data_serializer.transformer.custom_data_collection:
    class: DeskPRO\Bundle\AppBundle\DataSerializer\DataTransformer\CustomFields\CustomDataCollectionTransformer
    arguments: ~

  data_serializer.transformer.text_snippet:
    class: DeskPRO\Bundle\AppBundle\DataSerializer\DataTransformer\TextSnippetTransformer
    arguments:
      - "@security.token_storage"

  data_serializer.transformer.text_snippet_category:
    class: DeskPRO\Bundle\AppBundle\DataSerializer\DataTransformer\TextSnippetCategoryTransformer
    arguments:
      - "@security.token_storage"

  data_serializer.transformer.legacy_ticket_filter:
    class: DeskPRO\Bundle\AppBundle\DataSerializer\DataTransformer\LegacyTicketFilterTransformer
    arguments:
      - "@data.ticket_legacy_filter_sets"