parameters:
 security.authentication.switchuser_listener.class: DeskPRO\Bundle\AppBundle\Security\SwitchUserListener
 security.http_utils.class: DeskPRO\Bundle\AppBundle\Security\Http\HttpUtils

services:

  security.feature_listener:
    class: DeskPRO\Bundle\AppBundle\Security\EventListener\FeatureListener
    arguments: ["@deskpro.feature_flags", "@deskpro.features_collection", "@annotation_reader"]
    tags:
      - { name: kernel.event_subscriber }

  # Each kernel bundle will have their own specific security services dedicated to it
  # these are some general security services that should be able to be used app-wide.
  # For specific security implmentation details, see security.yml in the kernel bundles.
  # PortalBundle/ApiBundle/etc.

  ###
  ### Permissions (new permissions services)
  ###

  permissions_manager:
    class: DeskPRO\Bundle\AppBundle\Security\Permissions\PermissionsManager
    arguments: ["@portal_permissions_manager"]

  portal_permissions_manager:
    class: DeskPRO\Bundle\AppBundle\Security\Permissions\Portal\PortalPermissionsManager
    arguments:
      - "@settings_resolver"
      - "@doctrine.orm.default_entity_manager"
      - "@cache.one_day"
      - "@portal_usergroup_decider"
      - "@portal_permissions_loader"

  portal_permissions_loader:
    class: DeskPRO\Bundle\AppBundle\Security\Permissions\Portal\PortalPermissionsLoader
    arguments: ["@doctrine.orm.default_entity_manager"]

  portal_usergroup_decider:
    class: DeskPRO\Bundle\AppBundle\Security\Permissions\Portal\PortalUsergroupDecider
    arguments: ["@doctrine.orm.default_entity_manager"]


  ###
  ### Security Services
  ###

  usersource_identity_saver:
    class: DeskPRO\Bundle\AppBundle\Usersource\UsersourceIdentitySaver
    arguments: ["@doctrine.orm.default_entity_manager"]

  dp_person_user_provider:
    class: DeskPRO\Bundle\AppBundle\Security\DpPersonUserProvider
    arguments: ["@person_repository", "@ban_email_repository"]

  # use a custom user/password validator
  security.validator.user_password:
    class: DeskPRO\Bundle\AppBundle\Validator\Constraints\UserPasswordValidator
    arguments: ["@security.token_storage"]
    tags:
      - { name: validator.constraint_validator, alias: security.validator.user_password }

  dp_authentication_manager.user:
    class: Application\DeskPRO\Auth\AuthenticationManager
    factory: [Application\DeskPRO\DependencyInjection\SystemServices\AuthenticationManagerService, create]
    arguments: ["@service_container", 'user']

  dp_authentication_manager.agent:
    class: Application\DeskPRO\Auth\AuthenticationManager
    factory: [Application\DeskPRO\DependencyInjection\SystemServices\AuthenticationManagerService, create]
    arguments: ["@service_container", 'agent']

  dp_auth_settings:
    class: Application\DeskPRO\Auth\AuthSettings
    factory: [Application\DeskPRO\DependencyInjection\SystemServices\AuthSettingsService, create]
    arguments: ["@service_container"]

  ###
  ### API security
  ###

  api_authorization.action_permissions.driver:
    class: DeskPRO\Bundle\AppBundle\Annotation\ActionPermissions\ActionPermissionsDriver
    arguments:
      - "@annotations.reader"
      - %kernel.cache_dir%

  api_authorization.action_permissions.metadata_factory:
    class: DeskPRO\Bundle\AppBundle\Annotation\Metadata\MetadataFactory
    arguments:
      - "@api_authorization.action_permissions.driver"
      - "@api_authorization.action_permissions.metadata_cache"
      - %kernel.debug%



  api_authorization.action_permissions_voter:
    class: DeskPRO\Bundle\AppBundle\Security\Authorization\ActionPermissionsVoter
    arguments:
      - "@api_authorization.action_permissions.metadata_factory"
      - "@api_authorization.action_permissions_helper"
      - "@doctrine.orm.default_entity_manager"
    tags:
      - { name: security.voter }

  api_authorization.action_permissions_helper:
    class: DeskPRO\Bundle\AppBundle\Security\Authorization\ActionPermissionsHelper
    arguments:
      - "@api_tags.tags_collector"


  api_authorization.action_permissions.metadata_cache:
    class: DeskPRO\Bundle\AppBundle\Annotation\Metadata\MetadataCache
    arguments:
      - %kernel.cache_dir%
      - 'api_permissions'

  ###
  ### Voters
  ###

  security.voter.permission_groups:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\PermissionGroupVoter
    arguments: ["@service_container"]
    public: false
    tags:
      - { name: security.voter }

  security.voter.permission_groups.articles:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\ArticlesVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.article_category:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\ArticleCategoriesVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.article_comments:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\ArticleCommentsVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.user_chats:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\Chat\UserChatVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.agent_chats:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\Chat\AgentChatVoter
    arguments: ["@data.departments"]
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.agent_chat_messages:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\Chat\AgentChatMessageVoter
    arguments: ["@data.departments"]
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.downloads:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\DownloadsVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.download_categories:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\DownloadCategoriesVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.download_comments:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\DownloadCommentsVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.feedback:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\FeedbackVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.feedback_comments:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\FeedbackCommentsVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.news:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\NewsVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.news_categories:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\NewsCategoriesVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.news_comments:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\UserPublish\NewsCommentsVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.organizations:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\OrganizationsVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.organization_notes:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\OrganizationNotesVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.people:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\PeopleVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.person_notes:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\PersonNotesVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.person_onboarding:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\PersonOnboardingVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.snippet:
      class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\SnippetVoter
      tags:
        - { name: security.voter.permission_groups }

  security.voter.permission_groups.tasks:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\TasksVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.tickets:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\TicketsVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.ticket_follow_up:
      class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\TicketFollowUpVoter
      tags:
        - { name: security.voter.permission_groups }

  security.voter.permission_groups.ticket_messages:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\TicketMessagesVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.ticket_logs:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\TicketLogsVoter
    tags:
      - { name: security.voter.permission_groups }

  security.voter.permission_groups.client_devices:
    class: DeskPRO\Bundle\AppBundle\Security\Voter\PermissionGroups\EntityVoter\ClientDeviceVoter
    tags:
      - { name: security.voter.permission_groups }
