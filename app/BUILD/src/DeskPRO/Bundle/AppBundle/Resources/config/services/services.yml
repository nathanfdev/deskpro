services:

  brand_aware_settings_resolver:
    class: DeskPRO\Bundle\AppBundle\Settings\BrandAwareSettingsResolver
    arguments: ["@settings_resolver", @?brand_stack]

  user_rule_processor:
    class: Application\DeskPRO\People\UserRuleProcessor
    arguments: ["@doctrine.orm.default_entity_manager"]

  blob.storage:
    class: Application\DeskPRO\BlobStorage\DeskproBlobStorage
    factory: [Application\DeskPRO\DependencyInjection\SystemServices\BlobStorageService, create]
    arguments: ["@service_container"]

  deskpro_password_policy_validator:
    class: Application\DeskPRO\People\PasswordPolicyValidator
    factory: [Application\DeskPRO\DependencyInjection\SystemServices\PasswordPolicyValidatorService, create]
    arguments: ["@service_container"]

  avatar_resolver:
    class: DeskPRO\Bundle\AppBundle\Content\AvatarResolver
    #todo #portal second param here needs to be setting for gravatar
    arguments: ["@router.default", true]

  translator.noop:
      class: DeskPRO\Bundle\AppBundle\Translator\NoopTranslator

  doctrine_association_manager:
    class: DeskPRO\Component\DoctrineAssociation\DoctrineAssociationManager
    arguments: ["@doctrine.orm.default_entity_manager"]

  dp.app.settings_manager:
    class: DeskPRO\Bundle\AppBundle\Settings\SettingsManager
    arguments: ["@doctrine.orm.entity_manager", "@security.token_storage"]

  attachment_accepter:
    class: Application\DeskPRO\Attachments\AcceptAttachment
    factory: [Application\DeskPRO\DependencyInjection\SystemServices\AttachmentAccepterService, create]
    arguments: ["@service_container"]

  api_authorization.action_permissions.metadata_cache:
    class: DeskPRO\Bundle\AppBundle\Annotation\ActionPermissions\Metadata\ActionPermissionsCache
    arguments:
      - %kernel.cache_dir%
