services:

  deskpro.features_access_checker:
    class: DeskPRO\Bundle\AppBundle\Features\FeaturesAccessChecker
    arguments:
      - "@deskpro.app_env"

  deskpro.features_collection:
    class: DeskPRO\Bundle\AppBundle\Features\FeaturesCollection
    arguments: ["@deskpro.features_access_checker"]

  deskpro.features.agent_chat:
    class: DeskPRO\Bundle\AppBundle\Features\AgentChatFeature
    arguments:
      - "@settings_resolver"
    tags:
      - { name: deskpro.feature }

  deskpro.features.voice:
    class: DeskPRO\Bundle\AppBundle\Features\VoiceFeature
    arguments:
      - "@settings_resolver"
    tags:
      - { name: deskpro.feature }

  deskpro.features.guides:
    class: DeskPRO\Bundle\AppBundle\Features\GuidesFeature
    arguments:
      - "@settings_resolver"
    tags:
      - { name: deskpro.feature }

  deskpro.features.new_snippets:
    class: DeskPRO\Bundle\AppBundle\Features\NewSnippetsFeature
    arguments:
      - "@settings_resolver"
    tags:
      - { name: deskpro.feature }

  deskpro.features.new_forward:
      class: DeskPRO\Bundle\AppBundle\Features\NewForwardFeature
      arguments:
        - "@settings_resolver"
      tags:
        - { name: deskpro.feature }

  deskpro.features.new_reports:
    class: DeskPRO\Bundle\AppBundle\Features\NewReportsFeature
    arguments:
      - "@settings_resolver"
    tags:
      - { name: deskpro.feature }

  deskpro.features.follow_up:
    class: DeskPRO\Bundle\AppBundle\Features\FollowUpFeature
    arguments:
      - "@settings_resolver"
    tags:
      - { name: deskpro.feature }
