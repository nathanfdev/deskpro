services:

  #
  # ENGINE
  #

  term_engine.dbal.engine:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\DbalTermEngine
    arguments:
      - "@term_engine.dbal_ticket_filters.engine"

  term_engine.dbal_ticket_filters.engine:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TicketFilter\DbalTicketFilterEngine
    arguments:
      - "@term_engine.dbal_ticket_filters.engine.compiler"
      - "@event_dispatcher"
      - "@doctrine.dbal.default_connection"
      - "@monolog.logger.dp.tickets.filters.tengine.dbal.engine"

  term_engine.dbal_ticket_filters.engine.compiler:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TicketFilter\DbalTicketFilterEngineCompiler
    arguments:
      - "@term_engine.dbal_ticket_filters.compiler"
      - "@term_engine.dbal.compiled_query_cacher"
      - "@monolog.logger.dp.tickets.filters.tengine.dbal.compiler"

  term_engine.dbal_ticket_filters.compiler:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TicketFilter\Compiler\DbalTicketFilterCompiler
    arguments:
      - "@term_engine.dbal_ticket_filters.compiler.factory"
      - []  # the visitors added in compiler pass with tag "dbal_ticket_filter_visitor"
      - "@monolog.logger.dp.tickets.filters.tengine.dbal.compiler"

  term_engine.dbal.compiled_query_cacher:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\Query\DbalQueryCacher
    arguments:
      - "@cache.one_day"
      - "@term_engine.dbal.compiled_query_serializer"
      - "@monolog.logger.dp.tickets.filters.tengine.dbal.compiler"

  term_engine.dbal_ticket_filters.compiler.factory:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TermCompiler\DbalTermCompilerFactory
    # compiler pass will add the term compilers on tag "dbal_ticket_filter_compiler"

  term_engine.dbal.compiled_query_serializer:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\Query\DbalQuerySerializer


  #
  # TERM COMPILERS
  #

  term_engine.dbal_ticket_filters.term_compiler:
      abstract: true
      calls:
        - ['setHelperPool', ["@term_engine.dbal.helper_pool"]]
        - ['setLogger', ["@monolog.logger.dp.tickets.filters.tengine.dbal.compiler"]]

  term_engine.dbal_ticket_filters.compiler.ticket_status:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketStatus\DbalTicketStatusTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketStatus\TicketStatusTerm'

  term_engine.dbal_ticket_filters.compiler.agent:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Agent\DbalAgentTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Agent\AgentTerm'

  term_engine.dbal_ticket_filters.compiler.person:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Person\DbalPersonTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Person\PersonTerm'

  term_engine.dbal_ticket_filters.compiler.department:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Department\DbalDepartmentTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Department\DepartmentTerm'

  term_engine.dbal_ticket_filters.compiler.person_email:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\PersonEmail\DbalPersonEmailTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\PersonEmail\PersonEmailTerm'

  term_engine.dbal_ticket_filters.compiler.agent_team:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\AgentTeam\DbalAgentTeamTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\AgentTeam\AgentTeamTerm'

  term_engine.dbal_ticket_filters.compiler.custom_data:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\CustomData\DbalCustomDataTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      arguments: ["@doctrine.orm.default_entity_manager"]
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\CustomData\CustomDataTerm'

  term_engine.dbal_ticket_filters.compiler.ticket_participant:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketParticipant\DbalTicketParticipantTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketParticipant\TicketParticipantTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_language:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketLanguage\DbalTicketLanguageTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketLanguage\TicketLanguageTerm'

  term_engine.dbal_ticket_filters.compiler.organization:
      class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Organization\DbalOrganizationTermCompiler
      parent: term_engine.dbal_ticket_filters.term_compiler
      tags:
        ticket_filter:
          name: dbal_ticket_filter_compiler
          term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Organization\OrganizationTerm'

  term_engine.dbal_ticket_filters.compiler.problem:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Problem\DbalProblemTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Problem\ProblemTerm'

  term_engine.dbal_ticket_filters.compiler.ticket_custom_data:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketCustomData\DbalTicketCustomDataTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketCustomData\TicketCustomDataTerm'

  term_engine.dbal_ticket_filters.compiler.ticket_id:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketId\DbalTicketIdTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketId\TicketIdTerm'

  term_engine.dbal_ticket_filters.compiler.ticket_subject:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketSubject\DbalTicketSubjectTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketSubjectTicketSubjectTerm'

  term_engine.dbal_ticket_filters.compiler.ticket_date_created:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateCreated\DbalTicketDateCreatedTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateCreated\TicketDateCreatedTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_urgency:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketUrgency\DbalTicketUrgencyTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketUrgency\TicketUrgencyTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_num_user_replies:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketNumUserReplies\DbalTicketNumUserRepliesTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketNumUserReplies\TicketUrgencyTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_num_agent_replies:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketNumAgentReplies\DbalTicketNumAgentRepliesTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketNumAgentReplies\TicketNumAgentRepliesTerm'

  term_engine.dbal_ticket_filters.compiler.ticket_date_resolved:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateResolved\DbalTicketDateResolvedTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateResolved\TicketDateResolvedTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_date_archived:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateArchived\DbalTicketDateArchivedTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateArchived\TicketDateArchivedTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_date_last_user_reply:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateLastUserReply\DbalTicketDateLastUserReplyTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateLastUserReply\TicketDateLastUserReplyTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_date_last_agent_reply:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateLastAgentReply\DbalTicketDateLastAgentReplyTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateLastAgentReply\TicketDateLastAgentReplyTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_date_first_agent_reply:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateFirstAgentReply\DbalTicketDateFirstAgentReplyTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketDateFirstAgentReply\TicketDateFirstAgentReplyTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_ref:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketRef\DbalTicketRefTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketRef\TicketRefTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_creation_system:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketCreationSystem\DbalTicketCreationSystemTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketCreationSystem\TicketCreationSystemTerm'
        
  term_engine.dbal_ticket_filters.compiler.ticket_flagged:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketFlagged\DbalTicketFlaggedTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketFlagged\TicketFlaggedTerm'
  
  term_engine.dbal_ticket_filters.compiler.ticket_label:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketLabel\DbalTicketLabelTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketLabel\TicketLabelTerm'
        
  term_engine.dbal_ticket_filters.compiler.ticket_sla:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketSla\DbalTicketSlaTermCompiler
    parent: term_engine.dbal_ticket_filters.term_compiler
    tags:
      ticket_filter:
        name: dbal_ticket_filter_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketSla\TicketSlaTerm'

  #
  # VISITORS
  #

  term_engine.dbal_ticket_filters.logger_visitor:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Visitor\LoggingVisitor
    arguments: ["@logger"]
    tags:
    - { name: dbal_ticket_filter_visitor }

  #
  # Event Listeners
  #

  term_engine.dbal_ticket_filters.query_manipulator:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\EventListener\DbalQueryManipulatorListener
    arguments:
      - "@term_engine.expression_language"
    tags:
      - { name: kernel.event_subscriber }



  #
  # HELPERS - inject these into your TermCompiler to help build DbalQueryPart's for you
  #

  term_engine.dbal.helper_pool:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\TermCompilerHelperPool

  term_engine.dbal.abstract_helper:
    abstract: true
    arguments:
      - "@monolog.logger.dp.tickets.filters.tengine.dbal.compiler"

  term_engine.dbal.entity_helper:
    parent: term_engine.dbal.abstract_helper
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TermCompiler\Helper\DbalEntityHelper
    tags:
      - { name: dbal_term_engine_helper }

  term_engine.dbal.string_helper:
    parent: term_engine.dbal.abstract_helper
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TermCompiler\Helper\DbalStringHelper
    tags:
      - { name: dbal_term_engine_helper }

  term_engine.dbal.date_helper:
    parent: term_engine.dbal.abstract_helper
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TermCompiler\Helper\DbalDateHelper
    tags:
      - { name: dbal_term_engine_helper }

  term_engine.dbal.numeric_helper:
    parent: term_engine.dbal.abstract_helper
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TermCompiler\Helper\DbalNumericHelper
    tags:
      - { name: dbal_term_engine_helper }
  
  term_engine.dbal.joined_helper:
    parent: term_engine.dbal.abstract_helper
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TermCompiler\Helper\DbalJoinedHelper
    tags:
      - { name: dbal_term_engine_helper }
  
  term_engine.dbal.custom_field:
    parent: term_engine.dbal.abstract_helper
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Dbal\TermCompiler\Helper\DbalCustomFieldHelper
    arguments: ["@term_engine.dbal.joined_helper"]
    tags:
      - { name: dbal_term_engine_helper }
