services:

  url_host_checker:
    class: DeskPRO\Bundle\AppBundle\Helper\UrlHostChecker

  brand_form_helper:
    class: DeskPRO\Bundle\AppBundle\Form\BrandFormHelper
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@brand_stack"
      - "@brand_aware_settings_resolver"

  widget_jwt_decoder:
    class: DeskPRO\Bundle\AppBundle\Helper\WidgetJwtDecoder
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@widget_settings_resolver"
      - "@brand_stack"
      -
  attachment_helper:
    class: DeskPRO\Bundle\AppBundle\Helper\AttachmentHelper
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@router"
    tags:
      - { name: doctrine.entity_listener }