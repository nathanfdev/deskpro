services:

  deskpro.notification.service:
    class: DeskPRO\Bundle\AppBundle\Notification\NotificationService
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@settings_resolver"
      - "@security.token_storage"

  #
  # Strategies
  #
  deskpro.notification.strategy_factory:
    class: DeskPRO\Bundle\AppBundle\Notification\Strategy\StrategyFactory
    arguments:
      - "@service_container"

  deskpro.notification.immediate_listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\ImmediateStrategyListener
    tags:
      - { name: kernel.event_subscriber, priority: -10 }

  deskpro.notification.cli_listener:
    class: DeskPRO\Bundle\AppBundle\EventListener\CliStrategyListener
    tags:
      - { name: kernel.event_subscriber, priority: -10 }

  deskpro.notification.event_manager:
    class: DeskPRO\Bundle\AppBundle\Notification\NotificationEventManager
    arguments:
      - "@deskpro.notification.strategy_factory"
    tags:
      - { name: kernel.event_subscriber }

  #
  # Persistance adaper for deffered strategy
  #
  deskpro.notification.peristance.adapter.db:
    class: DeskPRO\Bundle\AppBundle\Notification\Persistance\DbAdapter
    arguments:
      - "@doctrine.orm.default_entity_manager"

  #
  # delivery handlers
  #
  deskpro.notification.delivery.handler.db:
    class: DeskPRO\Bundle\AppBundle\Notification\Delivery\Handler\DbDeliveryHandler
    arguments:
      - "@doctrine.orm.default_entity_manager"

  deskpro.notification.delivery.handler.redis:
    class: DeskPRO\Bundle\AppBundle\Notification\Delivery\Handler\RedisDeliveryHandler
    arguments:
      - "@deskpro.notification.redis_client"

  deskpro.notification.redis_client:
    class: Predis\Client

  deskpro.notification.delivery.handler.pusher:
    class: DeskPRO\Bundle\AppBundle\Notification\Delivery\Handler\PusherDeliveryHandler
    arguments:
      - "@deskpro.notification.pusher"
      - "@settings_resolver"
      - "@database_connection"

  deskpro.notification.delivery.handler.deskpro:
    class: DeskPRO\Bundle\AppBundle\Notification\Delivery\Handler\DeskproDeliveryHandler
    arguments:
      - "@settings_resolver"
      - "@deskpro.notification.deskpro_client"

  deskpro.notification.deskpro_client_factory:
    class: DeskPRO\Bundle\AppBundle\Notification\Delivery\DeskproClientFactory
  deskpro.notification.deskpro_client:
    class: DeskPRO\Bundle\AppBundle\Util\HttpClient
    factory: ["@deskpro.notification.deskpro_client_factory", createClient]
    arguments:
      - "@settings_resolver"

  deskpro.notification.pusher_factory:
    class: DeskPRO\Bundle\AppBundle\Notification\Delivery\PusherFactory
  deskpro.notification.pusher:
    class: Pusher
    factory: ["@deskpro.notification.pusher_factory", createPusher]
    arguments:
      - "@settings_resolver"

  #
  # notification handlers
  #
  deskpro.notification.notify_handler.action_alert:
    class: DeskPRO\Bundle\AppBundle\Notification\ActionAlertHandler

  deskpro.notification.notify_handler.user_notify:
      class: DeskPRO\Bundle\AppBundle\Notification\UserNotificationHandler

  #
  # UserNotification message generators
  #
  deskpro.notification.generator.user_notify.agent_chat_new_message:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\Notification\NewAgentChatMessageGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
      - "@avatar_resolver"
    tags:
      - { name: deskpro.notification.user_notify.generator }

  #
  # UserNotification message generators
  #
  deskpro.notification.generator.user_notify.new_user_chat:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\Notification\NewUserChatMessageGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
      - "@data.agent"
      - "@avatar_resolver"
    tags:
      - { name: deskpro.notification.user_notify.generator }

  #
  # ActionAlert message generators
  #
  deskpro.notification.generator.action_alert.agent_chat_new_message:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\NewAgentChatMessageGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
      - "@jms_serializer.serializer"
    tags:
      - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.helpdesk:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\HelpdeskAlertGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
    tags:
      - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.agent_chat_mark_message:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\MarkAgentChatMessageGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
    tags:
      - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.agent_chat_mark_all_messages:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\MarkAllAgentChatMessagesGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
    tags:
      - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.agent_update_online:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\UpdateOnlineMessageGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
    tags:
      - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.agent_status_changed:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\AgentStatusChangedMessageGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
    tags:
      - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.read_notifications:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\ReadNotificationsMessageGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
      - "@data.agent"
    tags:
      - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.ticket_message:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\TicketMessageGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
      - "@data.agent"
    tags:
      - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.system_event:
      class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\SystemEventGenerator
      arguments:
        - "@doctrine.orm.default_entity_manager"
        - "@security.token_storage"
        - "@data.agent"
      tags:
        - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.organization:
      class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\OrganizationMessageGenerator
      arguments:
        - "@doctrine.orm.default_entity_manager"
        - "@security.token_storage"
        - "@data.agent"
      tags:
        - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.person:
      class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\PersonMessageGenerator
      arguments:
        - "@doctrine.orm.default_entity_manager"
        - "@security.token_storage"
        - "@data.agent"
      tags:
        - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.user_chat:
      class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\UserChatMessageGenerator
      arguments:
        - "@doctrine.orm.default_entity_manager"
        - "@security.token_storage"
        - "@data.agent"
        - "@templating"
        - "@language_manager"
      tags:
        - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.popup_event:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\PopupMessageGenerator
    arguments:
    - "@doctrine.orm.default_entity_manager"
    - "@security.token_storage"
    - "@jms_serializer.serializer"
    - "@data.agent"
    tags:
    - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.messenger.chat:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\Messenger\ChatGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
      - "@avatar_resolver"
    tags:
    - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.messenger.chat_message:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\Messenger\ChatMessageGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
      - "@avatar_resolver"
      - "@messenger.mappers.chat"
    tags:
      - { name: deskpro.notification.action_alert.generator }

  deskpro.notification.generator.action_alert.messenger.chat.agent.assigned:
    class: DeskPRO\Bundle\AppBundle\Notification\Message\Generator\ActionAlert\Messenger\ChatAgentAssignedGenerator
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@security.token_storage"
      - "@avatar_resolver"
    tags:
      - { name: deskpro.notification.action_alert.generator }