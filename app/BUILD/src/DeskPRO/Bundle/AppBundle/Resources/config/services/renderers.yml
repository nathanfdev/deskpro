services:

  inline_attachments.renderer:
    class: DeskPRO\Bundle\AppBundle\Renderer\InlineAttachmentsRenderer
    arguments: ["@router", "@blob.storage"]

  ticket_message.renderer:
    class: DeskPRO\Bundle\AppBundle\Renderer\TicketMessageRenderer
    arguments: ["@inline_attachments.renderer"]

  news.renderer:
    class: DeskPRO\Bundle\AppBundle\Renderer\NewsRenderer