services:

  api_limits.metadata_factory:
    class: DeskPRO\Bundle\AppBundle\Annotation\Metadata\MetadataFactory
    arguments:
      - "@api_limits.metadata_driver"
      - "@api_limits.metadata_cache"
      - %kernel.debug%

  api_limits.metadata_driver:
    class: DeskPRO\Bundle\AppBundle\Annotation\Limits\LimitsDriver
    arguments:
      - "@annotations.reader"

  api_limits.metadata_cache:
    class: DeskPRO\Bundle\AppBundle\Annotation\Metadata\MetadataCache
    arguments:
      - %kernel.cache_dir%
      - 'api_limits'

  api_limits.cache_warmer:
    class: DeskPRO\Bundle\AppBundle\CacheWarmer\ApiLimitsCacheWarmer
    arguments:
      - "@api_limits.metadata_factory"
      - "@api_controllers_finder"
    tags:
      - { name: 'kernel.cache_warmer' }

  api_limits.limit_adapter:
    class: DeskPRO\Bundle\AppBundle\Limits\Adapter\DbLimitAdapter
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@settings_resolver"

  api_limits.limits_service:
    class: DeskPRO\Bundle\AppBundle\Limits\LimitsService
    arguments:
      - "@settings_resolver"
      - "@security.token_storage"
      - "@api_limits.limit_adapter"
      - "@doctrine.orm.default_entity_manager"
