services:

  api_error.form_errors_generator:
    class: DeskPRO\Bundle\AppBundle\Error\FormErrorsGenerator
    arguments:
      - @api_error.code_factory
      - @api_error.message_factory

  api_error.message_factory:
    class: DeskPRO\Bundle\AppBundle\Error\ErrorMessageFactory
    arguments:
      - @deskpro.core.translate

  api_error.code_factory:
    class: DeskPRO\Bundle\AppBundle\Error\ErrorCodeFactory
    arguments:
      - @api_error.code_factory_exception
      - @api_error.code_factory_validator

  api_error.code_factory_validator:
    class: DeskPRO\Bundle\AppBundle\Error\ValidatorErrorCodeFactory

  api_error.code_factory_exception:
    class: DeskPRO\Bundle\AppBundle\Error\ExceptionErrorCodeFactory
