services:

  api_tags.action_permissions.cache_warmer:
    class: DeskPRO\Bundle\AppBundle\CacheWarmer\ActionPermissionsCacheWarmer
    arguments:
      - "@api_tags.tags_collector"
    tags:
      - { name: 'kernel.cache_warmer' }

  api_tags.tags_collector:
      class: DeskPRO\Bundle\AppBundle\ApiTag\TagsCollector
      arguments:
        - "@api_authorization.action_permissions.metadata_factory"
        - "@api_controllers_finder"

  api_tags.tags_manipulator:
      class: DeskPRO\Bundle\AppBundle\ApiTag\TagsManipulator
      arguments:
        - "@doctrine.orm.default_entity_manager"
        - "@api_tags.tags_collector"

  api_tags.hierarchy_creator:
    class: DeskPRO\Bundle\AppBundle\ApiTag\Model\HierarchyCreator