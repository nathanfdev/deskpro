  term_engine.php_ticket_checker.compiler.ticket_label:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketLabel\PhpTicketLabelTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
