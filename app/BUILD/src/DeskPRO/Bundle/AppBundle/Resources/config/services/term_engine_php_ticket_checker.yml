  term_engine.php_ticket_checker.compiler.ticket_creation_system:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketCreationSystem\PhpTicketCreationSystemTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
