    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketNumUserRepliesTerm\TicketNumUserRepliesTerm'
  
  term_engine.php_ticket_checker.compiler.ticket_num_agent_replies:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketNumAgentReplies\PhpTicketNumAgentRepliesTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketNumAgentRepliesTerm\TicketNumAgentRepliesTerm'
  
  term_engine.php_ticket_checker.compiler.ticket_date_created:
