  term_engine.php_ticket_checker.compiler.ticket_sla:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketSla\PhpTicketSlaTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_sla:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketSlaTerm\TicketSlaTerm'

  #
  # VISITORS
  #

  term_engine.dbal_ticket_filters.logger_visitor:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Visitor\LoggingVisitor
    arguments: ["@logger"]
    tags:
    - { name: php_ticket_checker_visitor }



  #
  # HELPERS - inject these into your TermCompiler to help build DbalQueryPart's for you
  #

  term_engine.php.abstract_helper:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\Helper\AbstractPhpHelper
    abstract: true
    arguments:
      - "@monolog.logger.dp.tickets.filters.tengine.php.compiler"

  term_engine.php.helper_pool:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\TermCompilerHelperPool

  term_engine.php.method_check:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\Helper\MethodCheckHelper
    tags:
      - { name: php_term_engine_helper }

  term_engine.php.date_helper:
    parent: term_engine.php.abstract_helper
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\Helper\PhpDateHelper
    tags:
      - { name: php_term_engine_helper }

  term_engine.php.string_helper:
    parent: term_engine.php.abstract_helper
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\Helper\PhpStringHelper
    tags:
      - { name: php_term_engine_helper }

  term_engine.php.agent_helper:
    parent: term_engine.php.abstract_helper
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\Helper\PhpAgentHelper
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
      - { name: php_term_engine_helper }
