services:

  #
  # ENGINE
  #

  term_engine.php_ticket_checker.engine:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\PhpTicketCheckerEngine
    arguments:
      - "@term_engine.php_ticket_checker.engine.compiler"
      - "@term_engine.expression_language"
      - "@event_dispatcher"
      - "@term_engine.php.helper_pool"
      - "@monolog.logger.dp.tickets.filters.tengine.php.engine"

  term_engine.php_ticket_checker.engine.compiler:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\PhpTicketCheckerEngineCompiler
    arguments:
      - "@term_engine.php_ticket_checker.compiler"
      - "@term_engine.php.php_check_cacher"
      - "@monolog.logger.dp.tickets.filters.tengine.php.compiler"

  term_engine.php_ticket_checker.compiler:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TicketChecker\Compiler\PhpTicketCheckerCompiler
    arguments:
      - "@term_engine.php_ticket_checker.compiler.factory"
      - []  # the visitors added in compiler pass with tag "php_ticket_checker_visitor"
      - "@monolog.logger.dp.tickets.filters.tengine.php.compiler"

  term_engine.php.php_check_cacher:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\PhpBuilder\PhpCheckCacher
    arguments:
      - "@cache.one_day"
      - "@term_engine.php.php_check_serializer"
      - "@monolog.logger.dp.tickets.filters.tengine.php.compiler"

  term_engine.php.php_check_serializer:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\PhpBuilder\PhpCheckSerializer

  term_engine.php_ticket_checker.compiler.factory:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\PhpTermCompilerFactory
    # compiler pass will add the term compilers on tag "php_ticket_checker_compiler"


  #
  # TERM COMPILERS
  #

  term_engine.php_ticket_checker.term_compiler:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Engine\Php\TermCompiler\AbstractPhpTermCompiler
    abstract: true
    calls:
      - ['setHelperPool', ["@term_engine.php.helper_pool"]]
      - ['setLogger', ["@monolog.logger.dp.tickets.filters.tengine.php.compiler"]]

  term_engine.php_ticket_checker.compiler.agent:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Agent\PhpAgentTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Agent\AgentTerm'

  term_engine.php_ticket_checker.compiler.person:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Person\PhpPersonTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Person\PersonTerm'

  term_engine.php_ticket_checker.compiler.ticket_status:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketStatus\PhpTicketStatusTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketStatus\TicketStatusTerm'

  term_engine.php_ticket_checker.compiler.department:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Department\PhpDepartmentTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Department\DepartmentTerm'

  term_engine.php_ticket_checker.compiler.agent_team:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\AgentTeam\PhpAgentTeamTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\AgentTeam\AgentTeamTerm'

  term_engine.php_ticket_checker.compiler.custom_data:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\CustomData\PhpCustomDataTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\CustomData\CustomDataTerm'

  term_engine.php_ticket_checker.compiler.person_email:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\PersonEmail\PhpPersonEmailTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\PersonEmail\PersonEmailTerm'

  term_engine.php_ticket_checker.compiler.ticket_participant:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketParticipant\PhpTicketParticipantTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketParticipant\TicketParticipantTerm'
  
  term_engine.php_ticket_checker.compiler.ticket_language:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketLanguage\PhpTicketLanguageTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketLanguage\TicketLanguageTerm'

  term_engine.php_ticket_checker.compiler.organization:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Organization\PhpOrganizationTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Organization\OrganizationTerm'

  term_engine.php_ticket_checker.compiler.problem:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\Problem\PhpProblemTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\Problem\ProblemTerm'

  term_engine.php_ticket_checker.compiler.ticket_urgency:
    class: DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketUrgency\PhpTicketUrgencyTermCompiler
    parent: term_engine.php_ticket_checker.term_compiler
    tags:
      ticket_filter:
        name: php_ticket_checker_compiler
        term: 'DeskPRO\Bundle\AppBundle\TermEngine\Term\TicketUrgency\TicketUrgencyTerm'
  
  term_engine.php_ticket_checker.compiler.ticket_num_user_replies:
