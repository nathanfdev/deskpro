services:

  api_serializer.handler.entity:
    class: DeskPRO\Bundle\AppBundle\Serializer\SerializationHandler\EntitySerializationHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.contact_data:
    class: DeskPRO\Bundle\AppBundle\Serializer\SerializationHandler\ContactDataSerializationHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.to_string:
    class: DeskPRO\Bundle\AppBundle\Serializer\SerializationHandler\ToStringSerializationHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.custom_data:
    class: DeskPRO\Bundle\AppBundle\Serializer\SerializationHandler\CustomDataSerializationHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.date_time:
    class: DeskPRO\Bundle\AppBundle\Serializer\SerializationHandler\DateTimeSerializationHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.organization:
    class: DeskPRO\Bundle\AppBundle\Serializer\SerializationHandler\OrganizationSerializationHandler
    arguments:
      - "@data.chat"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.model_factory:
    class: DeskPRO\Bundle\AppBundle\Model\Factory\ModelFactory
    arguments:
      - "@service_container"

  api_serializer.api_person_factory:
    class: DeskPRO\Bundle\AppBundle\Model\Factory\ApiPersonFactory
    arguments:
      - "@avatar_resolver"
      - "@data.agent"

  api_serializer.sideload_listener:
    class: DeskPRO\Bundle\AppBundle\Serializer\EventListener\SideloadListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@api_serializer.model_factory"
    tags:
      - { name: "jms_serializer.event_subscriber" }

parameters:
  fos_rest.view_handler.default.class: "DeskPRO\Bundle\AppBundle\Serializer\ViewHandler"
