services:

  fos_rest.serializer.jms:
    class: DeskPRO\Bundle\AppBundle\Serializer\JMSSerializerAdapter
    arguments:
      - "@jms_serializer.serializer"
      - "@service_container"
    public: false
    lazy: true

  # common
  api_serializer.handler.raw:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\RawHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.entity:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\EntityHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.to_string:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\ToStringHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.collection:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\CollectionHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.map:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\MapHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.closure:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\DeferredHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  # entities
  api_serializer.handler.label:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\LabelHandler
    arguments:
      - "@doctrine.orm.default_entity_manager"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.custom_def:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\CustomDefHandler
    arguments:
      - "@deskpro.core.translate"
      - "@doctrine.orm.default_entity_manager"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.custom_data:
