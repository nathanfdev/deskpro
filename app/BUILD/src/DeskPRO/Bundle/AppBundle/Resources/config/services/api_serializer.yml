services:

  api_serializer.handler.entity:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\EntityHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.to_string:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\ToStringHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.collection:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\CollectionHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.custom_data:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\CustomDataHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.contact_data:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\ContactDataHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.person:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\PersonHandler
    arguments:
      - "@api_serializer.api_person_factory"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.organization:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\OrganizationHandler
    arguments:
      - "@data.chat"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.model_factory:
    class: DeskPRO\Bundle\AppBundle\Serializer\Model\Factory\ModelFactory
    arguments:
      - "@service_container"

  api_serializer.api_person_factory:
    class: DeskPRO\Bundle\AppBundle\Serializer\Model\Factory\ApiPersonFactory
    arguments:
      - "@avatar_resolver"
      - "@data.agent"

  api_serializer.sideload_listener:
    class: DeskPRO\Bundle\AppBundle\Serializer\EventListener\SideloadListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@api_serializer.model_factory"
    tags:
      - { name: "jms_serializer.event_subscriber" }

parameters:
  fos_rest.view_handler.default.class: "DeskPRO\Bundle\AppBundle\Serializer\ViewHandler"
