services:

  # common

  api_serializer.handler.entity:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\EntityHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.to_string:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\ToStringHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.collection:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\CollectionHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.closure:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Common\DeferredHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }


  # entities
  api_serializer.handler.custom_data:
      class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\CustomDataHandler
      tags:
        - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.contact_data:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\ContactDataHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.person:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\PersonHandler
    arguments:
      - "@avatar_resolver"
      - "@data.agent"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.organization:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\OrganizationHandler
    arguments:
      - "@data.chat"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.department:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\DepartmentHandler
    arguments:
      - "@avatar_resolver"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.task_project:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\TaskProjectHandler
    arguments:
      - "@doctrine.dbal.default_connection"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.task:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\TaskHandler
    arguments:
      - "@doctrine.dbal.default_connection"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.ticket_participant:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\TicketParticipantHandler
    arguments:
      - "@data.chat"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.agent_team:
      class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\AgentTeamHandler
      arguments:
        - "@avatar_resolver"
      tags:
        - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.ticket:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\TicketHandler
    arguments:
      - "@tickets.linker"
      - "@ticket_layout_factory"
      - "@doctrine.orm.default_entity_manager"
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.handler.agent_alert:
    class: DeskPRO\Bundle\AppBundle\Serializer\Handler\Entity\AgentAlertHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  # models
  api_serializer.model_factory:
    class: DeskPRO\Bundle\AppBundle\Serializer\Model\Factory\ModelFactory
    arguments:
      - "@service_container"

  api_serializer.api_person_factory:
    class: DeskPRO\Bundle\AppBundle\Serializer\Model\Factory\ApiPersonFactory
    arguments:
      - "@avatar_resolver"
      - "@data.agent"

  # listeners and subscribers
  api_serializer.sideload_listener:
    class: DeskPRO\Bundle\AppBundle\Serializer\EventListener\SideloadListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@api_serializer.model_factory"
    tags:
      - { name: "jms_serializer.event_subscriber" }

  api_serializer.deferred_listener:
    class: DeskPRO\Bundle\AppBundle\Serializer\EventListener\DeferredPropertiesListener
    tags:
      - { name: "jms_serializer.event_subscriber" }

parameters:
  fos_rest.view_handler.default.class: "DeskPRO\Bundle\AppBundle\Serializer\ViewHandler"
