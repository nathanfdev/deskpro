    arguments:
      - "@doctrine.orm.default_entity_manager"
    tags:
      - { name: "jms_serializer.event_subscriber" }

  api_serializer.ids_only_listener:
    class: DeskPRO\Bundle\AppBundle\Serializer\EventListener\IdsOnlyListener
    arguments: ["@jms_serializer.metadata_factory"]
    tags:
