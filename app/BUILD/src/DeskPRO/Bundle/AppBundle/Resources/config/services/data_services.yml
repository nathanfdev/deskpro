services:

  data.custom_field_util:
    class: DeskPRO\Bundle\AppBundle\DataService\CustomFieldUtil
    arguments: ["@security.token_storage"]

  data.person:
    class: DeskPRO\Bundle\AppBundle\DataService\PersonDataService
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.tickets:
    class: DeskPRO\Bundle\AppBundle\DataService\TicketsDataService
    arguments: ["@doctrine.orm.default_entity_manager", "@brand_stack", "@logger"]

  data.ticket_timeline:
    class: DeskPRO\Bundle\AppBundle\DataService\TicketTimelineDataService
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.departments:
    class: DeskPRO\Bundle\AppBundle\DataService\DepartmentDataService
    arguments: ["@doctrine.orm.default_entity_manager", "@permissions_manager"]

  data.articles:
    class: DeskPRO\Bundle\AppBundle\DataService\ArticlesDataService
    arguments: ["@doctrine.orm.default_entity_manager", "@permissions_manager"]

  data.news:
    class: DeskPRO\Bundle\AppBundle\DataService\NewsDataService
    arguments: ["@doctrine.orm.default_entity_manager", "@permissions_manager"]

  data.email:
    class: DeskPRO\Bundle\AppBundle\DataService\EmailDataService
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.downloads:
    class: DeskPRO\Bundle\AppBundle\DataService\DownloadsDataService
    arguments: ["@doctrine.orm.default_entity_manager", "@permissions_manager"]

  data.feedback:
    class: DeskPRO\Bundle\AppBundle\DataService\Feedback\FeedbackDataService
    arguments: ["@doctrine.orm.default_entity_manager", "@permissions_manager"]

  data.rating:
    class: DeskPRO\Bundle\AppBundle\DataService\RatingsDataService
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.ticket_stars:
    class: DeskPRO\Bundle\AppBundle\Model\TicketStars
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.ticketlabels:
    class: DeskPRO\Bundle\AppBundle\DataService\TicketLabelsDataService
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.ticket_custom_fields:
    class: DeskPRO\Bundle\AppBundle\DataService\TicketCustomFieldsDataService
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.slas:
    class: DeskPRO\Bundle\AppBundle\DataService\SlasDataService
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.ticket_legacy_filter_sets:
    class: DeskPRO\Bundle\AppBundle\DataService\Tickets\LegacyFilterSet\LegacyTicketFilterSetDataService
    arguments: ["@doctrine.orm.default_entity_manager", "@security.token_storage"]

  data.chat:
    class: DeskPRO\Bundle\AppBundle\DataService\Chat\ChatDataService
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.agent:
    class: DeskPRO\Bundle\AppBundle\DataService\AgentDataService
    arguments: ["@doctrine.orm.default_entity_manager"]

  data.tickets.ticket_counts:
    class: DeskPRO\Bundle\AppBundle\DataService\Tickets\TicketCountsDataService
    arguments: ["@doctrine.orm.entity_manager", null, "@security.token_storage"]

  data.guides:
    class: DeskPRO\Bundle\AppBundle\DataService\GuidesDataService
    arguments: ["@doctrine.orm.default_entity_manager", "@permissions_manager"]

  data.ticket_excerpt:
    class: DeskPRO\Bundle\AppBundle\DataService\Tickets\TicketExcerptDataService
    arguments: ["@doctrine.orm.default_entity_manager"]
