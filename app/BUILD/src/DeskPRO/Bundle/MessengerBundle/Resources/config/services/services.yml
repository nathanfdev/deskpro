parameters:
  json_body_listener.ignore_content_type_names:
    - zip

services:
  messenger_authenticator:
    class: DeskPRO\Bundle\MessengerBundle\Security\Authentication\MessengerAuthenticator
    arguments:
      - "@app_secret"

  messenger.handlers.chat:
    class: DeskPRO\Bundle\MessengerBundle\Handler\ChatHandler
    arguments:
      - "@messenger.mappers.chat"
      - "@doctrine.orm.default_entity_manager"
      - "@deskpro.notification.event_manager"