parameters:
  json_body_listener.ignore_content_type_names:
    - zip

services:
  messenger.handlers.chat:
    class: DeskPRO\Bundle\MessengerBundle\Handler\ChatHandler
    arguments:
      - "@messenger.mappers.chat"
      - "@doctrine.orm.default_entity_manager"
      - "@event_dispatcher"
      - "@brand_stack"
      - "@messenger.service.settings_resolver"
      - "@attachment_helper"
      - "@tickets.statuses"
      - "@service_container"
      - "@tickets.messenger_new_ticket"

  messenger.service.action_alerts:
    class: DeskPRO\Bundle\MessengerBundle\Service\ActionAlertsService
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@doctrine.dbal.read_connection"

  messenger.service.tech:
    class: DeskPRO\Bundle\MessengerBundle\Service\TechService
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@permissions_manager"
      - "@portal_permissions_manager"
      - "@portal_usergroup_decider"
      - "@brand_stack"
      - "@service_container"

  messenger.service.settings_resolver:
    class: DeskPRO\Bundle\MessengerBundle\Service\MessengerSettingsResolver
    arguments:
      - "@brand_aware_settings_resolver"
      - "@doctrine.orm.entity_manager"
      - "@language_manager"

  messenger.visitorid_listener:
    class: DeskPRO\Bundle\MessengerBundle\Security\EventListener\VisitorIdListener
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 200}

  messenger.brandid_listener:
    class: DeskPRO\Bundle\MessengerBundle\Security\EventListener\BrandIdListener
    arguments:
      - "@brand_stack"
      - "@doctrine.orm.default_entity_manager"
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 150}

  messenger.chat_settings_subscriber:
    class: DeskPRO\Bundle\MessengerBundle\Notification\EventListener\ChatSettingsSubscriber
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@messenger.service.settings_resolver"
    tags:
      - { name: 'kernel.event_subscriber' }

  tickets.messenger_new_ticket:
    class: DeskPRO\Bundle\MessengerBundle\Service\NewTicketService
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@ticket_manager"
      - "@language_manager"
      - "@person_factory"
      - "@brand_stack"
      - "@tickets.statuses"
