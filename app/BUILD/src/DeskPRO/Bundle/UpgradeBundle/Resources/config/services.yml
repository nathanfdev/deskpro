services:
  dp.upgrader.distro.downloader:
    class: DeskPRO\Bundle\UpgradeBundle\Distro\DistroDownloader
    factory: [DeskPRO\Bundle\UpgradeBundle\Distro\DistroDownloader, create]

  dp.upgrader.distro.manifest_loader:
    class: DeskPRO\Bundle\UpgradeBundle\Distro\DistroManifestLoader
    factory: [DeskPRO\Bundle\UpgradeBundle\Distro\DistroManifestLoader, create]
    arguments:
      - "@=service('deskpro.app_env').getConfig('paths.distro_manifest', constant('DeskPRO\\\\Bundle\\\\UpgradeBundle\\\\Distro\\\\DistroManifestLoader::VERSION_API_ROOT'))"

  dp.upgrader.distro.installer:
    class: DeskPRO\Bundle\UpgradeBundle\Distro\DistroInstaller
    arguments:
      - "@deskpro.zippy"
      - "@dp.upgrader.instance_reader"
      - "@=service('deskpro.app_env').getUserTmpDir()"

  dp.upgrader.instance_reader:
    class: DeskPRO\Bundle\UpgradeBundle\Instance\InstanceReader
    arguments:
      - "@=service('deskpro.app_env').getAppName()"
      - "@=service('deskpro.app_env').getBuildDirRoot()"
      - "@=service('deskpro.app_env').getWwwRoot()"
      - "@=service('deskpro.app_env').getKernelCacheDirRoot()"
