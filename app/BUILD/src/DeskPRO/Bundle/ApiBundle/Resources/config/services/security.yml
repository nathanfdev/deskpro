services:

  api_authenticator:
    class: DeskPRO\Bundle\ApiBundle\Security\Authentication\ApiAuthenticator
    arguments:
      - "@doctrine.orm.default_entity_manager"
  api_anon_authenticator:
    class: DeskPRO\Bundle\ApiBundle\Security\Authentication\ApiAuthenticator
    arguments:
      - "@doctrine.orm.default_entity_manager"

  api_user_provider:
    class: DeskPRO\Bundle\ApiBundle\Security\Authentication\ApiUserProvider
    arguments:
      - "@doctrine.orm.default_entity_manager"

  api_authorization.action_permissions.event_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\ApiEndpointListener
    arguments:
      - "@security.authorization_checker"
      - "@api_view_representation_factory"
    tags:
      - {name: kernel.event_subscriber }

  api_limits.limit_adapter:
    class: DeskPRO\Bundle\ApiBundle\Limits\Adapter\DbLimitAdapter
    arguments:
      - @doctrine.orm.default_entity_manager

  api_limits.limits_service:
    class: DeskPRO\Bundle\ApiBundle\Limits\LimitsService
    arguments:
      - @settings_resolver
      - @security.token_storage
      - @api_limits.limit_adapter
      - @doctrine.orm.default_entity_manager

  api_limits.limits_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\ApiLimitsListener
    arguments:
      - @service_container
    tags:
      - {name: kernel.event_subscriber}


parameters:
  security.authentication.manager.erase_credentials: false