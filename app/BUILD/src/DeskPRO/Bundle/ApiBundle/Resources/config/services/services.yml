parameters:
  json_body_listener.ignore_content_type_names:
    - zip

services:

  deskpro.api.request_auth:
    class: Application\LegacyApiBundle\Request\RequestAuth
    scope: request
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@request"
      - "@settings_resolver"

  version_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\VersionListener
    arguments:
      - "@api.version_info"
      - "@request_matcher"
    tags:
      - { name: kernel.event_subscriber }

  content_type_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\ContentTypeListener
    arguments: ["%json_body_listener.ignore_content_type_names%"]
    tags:
      - { name: kernel.event_subscriber }

  jsonp_format_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\JsonpFormatListener
    tags:
      - { name: kernel.event_subscriber }

  json_headers_response_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\JsonHeadersResponseListener
    arguments:
      - "@serializer"
      - "@settings_resolver"
    tags:
    - { name: 'kernel.event_subscriber' }

  follow_redirect_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\FollowLocationListener
    tags:
    - { name: 'kernel.event_subscriber' }

  persist_explicit_id_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\PersistExplicitIdListener
    tags:
      - { name: kernel.event_subscriber }

  api_url_inflector:
    class: DeskPRO\Bundle\ApiBundle\Util\UrlInflector

  api_error_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\ApiExceptionListener
    tags:
    - { name: 'kernel.event_subscriber' }

  job.scheduler:
    class: Application\DeskPRO\JobQueue\JobScheduler
    arguments:
      - "@doctrine.orm.entity_manager"

  job.queue:
    class: Application\DeskPRO\JobQueue\JobQueue
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@job.scheduler"

  api_client_info:
    class: DeskPRO\Bundle\ApiBundle\Request\ApiClientInfo
    factory: [DeskPRO\Bundle\ApiBundle\Request\ApiClientInfo, createFromRequestStack]
    arguments: ["@request_stack"]

  api_proxy_request_factory:
    class: DeskPRO\Bundle\ApiBundle\Proxy\ProxyRequestFactory
    factory: [DeskPRO\Bundle\ApiBundle\Proxy\ProxyRequestFactory, create]
    arguments:
      - "@doctrine.orm.entity_manager"

  api_proxy_validator:
    class: DeskPRO\Bundle\ApiBundle\Proxy\ProxyRequestValidator
    arguments:
      - "@validator"

  api_portal_session_reader:
    class: DeskPRO\Bundle\ApiBundle\Request\PortalSessionReader
    arguments:
      - "@doctrine.orm.entity_manager"

  api_tickets_term_builder:
    class: DeskPRO\Bundle\ApiBundle\TicketFilters\TermBuilder
    arguments:
      - "@ticketfilters.queryparser"
