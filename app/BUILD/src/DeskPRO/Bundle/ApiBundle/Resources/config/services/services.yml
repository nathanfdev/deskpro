services:

  deskpro.api.request_auth:
    class: Application\LegacyApiBundle\Request\RequestAuth
    scope: request
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@request"
      - "@settings_resolver"

  api_view_representation_factory:
    class: DeskPRO\Bundle\ApiBundle\View\ApiViewRepresentationFactory

  version_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\VersionListener
    arguments:
      - "@api.version_info"
      - "@request_matcher"
    tags:
      - { name: kernel.event_subscriber }

  content_type_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\ContentTypeListener
    tags:
      - { name: kernel.event_subscriber }

  jsonp_format_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\JsonpFormatListener
    tags:
      - { name: kernel.event_subscriber }

  json_headers_response_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\JsonHeadersResponseListener
    arguments:
      - "@serializer"
      - "@settings_resolver"
    tags:
    - { name: 'kernel.event_subscriber' }

  follow_redirect_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\FollowLocationListener
    tags:
    - { name: 'kernel.event_subscriber' }

  api_url_inflector:
    class: DeskPRO\Bundle\ApiBundle\Util\UrlInflector

  api_error_listener:
    class: DeskPRO\Bundle\ApiBundle\EventListener\ApiExceptionListener
    tags:
    - { name: kernel.event_subscriber }

  job.scheduler:
    class: Application\DeskPRO\JobQueue\JobScheduler
    arguments:
      - "@doctrine.orm.entity_manager"

  job.queue:
    class: Application\DeskPRO\JobQueue\JobQueue
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@job.scheduler"

  api_client_info:
    class: DeskPRO\Bundle\ApiBundle\Request\ApiClientInfo
    factory: [DeskPRO\Bundle\ApiBundle\Request\ApiClientInfo, createFromRequestStack]
    arguments: ["@request_stack"]

  DeskPRO\Bundle\ApiBundle\Apps\StateFilterParamConverter:
    class: DeskPRO\Bundle\ApiBundle\Apps\StateFilterParamConverter
    factory: [DeskPRO\Bundle\ApiBundle\Apps\ParamConverters, createStateFilterConverter]
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\ApiBundle\Apps\StateFilterParamConverter }

  DeskPRO\Bundle\ApiBundle\Apps\AssetFilterParamConverter:
    class: DeskPRO\Bundle\ApiBundle\Apps\AssetFilterParamConverter
    factory: [DeskPRO\Bundle\ApiBundle\Apps\ParamConverters, createAssetFilterConverter]
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\ApiBundle\Apps\AssetFilterParamConverter }

  DeskPRO\Bundle\ApiBundle\Apps\AppInstanceParamConverter:
    class: DeskPRO\Bundle\ApiBundle\Apps\AppInstanceParamConverter
    factory: [DeskPRO\Bundle\ApiBundle\Apps\ParamConverters, createAppInstanceConverter]
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\ApiBundle\Apps\AppInstanceParamConverter }

  DeskPRO\Bundle\ApiBundle\Apps\AppParamConverter:
    class: DeskPRO\Bundle\ApiBundle\Apps\AppParamConverter
    factory: [DeskPRO\Bundle\ApiBundle\Apps\ParamConverters, createAppConverter]
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\ApiBundle\Apps\AppParamConverter }

  DeskPRO\Bundle\ApiBundle\Apps\AppStateParamConverter:
    class: DeskPRO\Bundle\ApiBundle\Apps\AppStateParamConverter
    factory: [DeskPRO\Bundle\ApiBundle\Apps\ParamConverters, createAppStateConverter]
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
        - { name: request.param_converter, converter: DeskPRO\Bundle\ApiBundle\Apps\AppStateParamConverter }


