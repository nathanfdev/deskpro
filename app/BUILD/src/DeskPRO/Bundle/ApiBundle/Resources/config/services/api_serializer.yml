services:

  api_serializer.entity_serialization_handler:
    class: DeskPRO\Bundle\ApiBundle\Serializer\SerializationHandler\EntitySerializationHandler
    tags:
      - { name: "jms_serializer.subscribing_handler" }

  api_serializer.api_person_factory:
    class: DeskPRO\Bundle\ApiBundle\Model\Factory\ApiPersonFactory
    arguments:
      - "@avatar_resolver"
      - "@data.agent"

  api_serializer.sideload_listener:
    class: DeskPRO\Bundle\ApiBundle\Serializer\EventListener\SideloadListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
    tags:
      - { name: "jms_serializer.event_subscriber" }

parameters:
  fos_rest.view_handler.default.class: "DeskPRO\Bundle\ApiBundle\Serializer\ViewHandler"