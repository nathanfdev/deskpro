services:

  reports.dashboard_manager:
    class: DeskPRO\Bundle\ReportBundle\Dashboard\DashboardManager

  reports.dashboard_widget.service:
    class: DeskPRO\Bundle\ReportBundle\Dashboard\DashboardWidgetManager
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@dpql.compiler"
      - "@reports.renderer_registry"
      - "@logger"
    tags:
      - { name: monolog.logger, channel: reports.widgets }

  reports.report_saver:
    class: DeskPRO\Bundle\ReportBundle\Service\ReportSaver
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@reports.dashboard_widget.service"

  reports.report_pdf_generator:
    class: DeskPRO\Bundle\ReportBundle\Service\ReportPdfGenerator
    arguments:
      - "@deskpro.app_env"
      - "@settings_resolver"
