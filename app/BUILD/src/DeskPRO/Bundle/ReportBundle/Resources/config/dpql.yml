  dpql.placeholder.next6months:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Next6Months
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.next7days:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Next7Days
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.nexthour:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\NextHour
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.past_6_month:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Past6Months
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.past_7_days:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Past7Days
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.past_12_hours:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Past12Hours
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.past_12_months:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Past12Months
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.past_24_hours:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Past24Hours
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.past_30_days:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Past30Days
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.past_hour:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\PastHour
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.this_month:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\ThisMonth
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.this_week:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\ThisWeek
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.this_year:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\ThisYear
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.today:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Today
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.tomorrow:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Tomorrow
    arguments:
      - "@dpql.context_storage"
    tags:
