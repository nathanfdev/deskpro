services:

  dpql.statement_factory:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Statement\DpqlStatementFactory
    arguments:
      - "@service_container"

  dpql.func_registry:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlFuncRegistry
    arguments:
      - "@service_container"

  dpql.placeholder_registry:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\DpqlPlaceholderRegistry
    arguments:
      - "@service_container"

  dpql.lexer:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Lexer
    shared: false

  dpql.parser:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Parser
    arguments:
      - "@dpql.statement_factory"
    shared: false

  dpql.compiler:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\DpqlCompiler
    arguments:
      - "@settings_resolver"
      - "@doctrine.orm.default_entity_manager"
      - "@reports.widget.service"
      - "@dpql.lexer"
      - "@dpql.parser"
      - "@dpql.context_storage"
      - "@security.token_storage"
    shared: false

  dpql.context_storage:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\DpqlContextStorage

  # DPQL functions
  dpql.func.alias:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlAlias
    tags:
      - { name: dpql.func }

  dpql.func.count:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlCount
    tags:
      - { name: dpql.func }

  dpql.func.count_distinct:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlCountDistinct
    tags:
      - { name: dpql.func }

  dpql.func.cur_date:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlCurDate
    tags:
      - { name: dpql.func }

  dpql.func.cur_time:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlCurTime
    tags:
      - { name: dpql.func }

  dpql.func.date:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlDate
    tags:
      - { name: dpql.func }

  dpql.func.date_offset_group:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlDateOffsetGroup
    tags:
      - { name: dpql.func }

  dpql.func.day_name:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlDayName
    tags:
      - { name: dpql.func }

  dpql.func.day_of_month:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlDayOfMonth
    tags:
      - { name: dpql.func }

  dpql.func.day_of_week:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlDayOfWeek
    tags:
      - { name: dpql.func }

  dpql.func.format:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlFormat
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.func }

  dpql.func.hierarchy:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlHierarchy
    tags:
      - { name: dpql.func }

  dpql.func.hierarchy_descends_from:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlHierarchyDescendsFrom
    arguments:
      - "@dpql.statement_factory"
      - "@dpql.helper.custom_data"
    tags:
      - { name: dpql.func }

  dpql.func.hour:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlHour
    tags:
      - { name: dpql.func }

  dpql.func.link:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlLink
    arguments:
      - "@router"
    tags:
      - { name: dpql.func }

  dpql.func.matrix:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlMatrix
    tags:
      - { name: dpql.func }

  dpql.func.minute:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlMinute
    tags:
      - { name: dpql.func }

  dpql.func.month:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlMonth
    tags:
      - { name: dpql.func }

  dpql.func.month_name:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlMonthName
    tags:
      - { name: dpql.func }

  dpql.func.now:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlNow
    tags:
      - { name: dpql.func }

  dpql.func.obj_lang:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlObjLang
    arguments:
      - "@doctrine.dbal.default_connection"
      - "@dpql.context_storage"
    tags:
      - { name: dpql.func }

  dpql.func.percent:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlPercent
    tags:
      - { name: dpql.func }

  dpql.func.printable:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlPrintable
    tags:
      - { name: dpql.func }

  dpql.func.stack_group:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlStackGroup
    tags:
      - { name: dpql.func }

  dpql.func.time_length:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlTimeLength
    tags:
      - { name: dpql.func }

  dpql.func.total:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlTotal
    tags:
      - { name: dpql.func }

  dpql.func.to_utc:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlToUtc
    tags:
      - { name: dpql.func }

  dpql.func.utc:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlUtc
    tags:
      - { name: dpql.func }

  dpql.func.x:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlX
    tags:
      - { name: dpql.func }

  dpql.func.y:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlY
    tags:
      - { name: dpql.func }

  dpql.func.year:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlYear
    tags:
      - { name: dpql.func }

  dpql.func.json_extract:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlJsonExtract
    tags:
      - { name: dpql.func }

  dpql.func.concat:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Func\DpqlConcat
    arguments:
      - "@dpql.func_registry"
    tags:
      - { name: dpql.func }

  # DPQL placeholders
  dpql.placeholder.ever:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\Ever
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.last_month:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\LastMonth
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.last_week:
    class: DeskPRO\Bundle\ReportBundle\Dpql2\Placeholder\LastWeek
    arguments:
      - "@dpql.context_storage"
    tags:
      - { name: dpql.placeholder }

  dpql.placeholder.last_year:
