services:

  dpdev.mass_loader:
    class: DeskPRO\Bundle\DevBundle\MassLoader\MassLoader
    arguments: ["@doctrine.orm.entity_manager"]

  dpdev.language.copy_identical_phrases:
    class: DeskPRO\Bundle\DevBundle\Language\CopyIdenticalPhrases

  dpdev.template.twig_extension_scanner:
    class: DeskPRO\Bundle\DevBundle\Template\TwigExtensionScanner

  dpdev.template.twig_template_parser:
    class: DeskPRO\Bundle\DevBundle\Template\TwigTemplateParser
    arguments:
      - "@twig"
