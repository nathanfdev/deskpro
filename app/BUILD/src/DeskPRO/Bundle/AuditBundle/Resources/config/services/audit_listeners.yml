services:

  audit_log.doctrine_listener:
    class: DeskPRO\Bundle\AuditBundle\EventListener\AuditListener
    arguments:
      - "@event_dispatcher"
      - "@audit_log.helper"
    tags:
      - { name: doctrine.event_listener, connection: default, event: preFlush }
      - { name: doctrine.event_listener, connection: default, event: onFlush }
      - { name: doctrine.event_listener, connection: default, event: postFlush }

  audit_log.disable_listener_subscriber:
    class: DeskPRO\Bundle\AuditBundle\EventListener\DisableListenerSubscriber
    arguments:
      - "@service_container"
    tags:
      - { name: kernel.event_subscriber }

  audit_log.decide_listener:
    class: DeskPRO\Bundle\AuditBundle\EventListener\DecideListener
    arguments:
      - "@=service('audit_log.configuration_builder_wrapper').buildConfigurationSet()"
    tags:
      - { name: kernel.event_listener, event: audit_log.pre_log, method: onPreLog}

  audit_log.object_collector:
    class: DeskPRO\Bundle\AuditBundle\Log\ObjectCollector

  audit_log.collect_listener:
    class: DeskPRO\Bundle\AuditBundle\EventListener\CollectListener
    arguments:
      - "@audit_log.object_collector"
    tags:
      - { name: kernel.event_listener, event: audit_log.start_log, method: onStartLog, priority: 8 }

  audit_log.object_listener:
    class: DeskPRO\Bundle\AuditBundle\EventListener\ObjectListener
    arguments:
      - "@=service('audit_log.configuration_builder_wrapper').buildConfigurationSet()"
    tags:
      - { name: kernel.event_listener, event: audit_log.start_log, method: setObject}

  audit_log.action_listener:
    class: DeskPRO\Bundle\AuditBundle\EventListener\ActionListener
    tags:
      - { name: kernel.event_listener, event: audit_log.start_log, method: setAction}

  audit_log.data_listener:
    class: DeskPRO\Bundle\AuditBundle\EventListener\DataListener
    arguments:
      - "@=service('audit_log.configuration_builder_wrapper').buildConfigurationSet()"
      - "@audit_log.field_filter_service"
    tags:
      - { name: kernel.event_listener, event: audit_log.start_log, method: setData, priority: -1}

  audit_log.description_listener:
    class: DeskPRO\Bundle\AuditBundle\EventListener\DescriptionListener
    tags:
      - { name: kernel.event_listener, event: audit_log.start_log, method: setDescription, priority: -2}

  audit_log.write_listener:
    class: DeskPRO\Bundle\AuditBundle\EventListener\WriteListener
    arguments:
      - "@service_container"
    tags:
      - { name: kernel.event_listener, event: audit_log.finish_log, method: onFinish }
      - { name: kernel.event_listener, event: audit_log.finish_all, method: onFinishAll }
      - { name: doctrine.event_listener, connection: default, event: postFlush, priority: -1 }

  audit_log.naming_strategy.theme:
    class: DeskPRO\Bundle\AuditBundle\Entity\NamingStrategy\ThemeNamingStrategy
    arguments:
      - "@doctrine.orm.default_entity_manager"