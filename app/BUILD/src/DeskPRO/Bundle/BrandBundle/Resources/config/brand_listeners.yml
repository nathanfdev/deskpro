services:

  brand_detector.listener:
    class: DeskPRO\Bundle\BrandBundle\EventListener\BrandDetectionListener
    arguments:
      - "@brand_stack"
      - "@settings_resolver"
      - "@brand_repository"
      - "@default_brand_finder"
      - "@portal_mode_storage"
      - "@logger"
      - "@url_host_checker"
    tags:
      - { name: kernel.event_subscriber }

  brand_access.listener:
    class: DeskPRO\Bundle\BrandBundle\EventListener\BrandAccessListener
    arguments:
      - "@brand_stack"
      - "@security.token_storage"
    tags:
      - { name: kernel.event_subscriber }

  brand_slug.listener:
    class: DeskPRO\Bundle\BrandBundle\EventListener\BrandSlugListener
    arguments:
      - "@request_brand_corrector"
    tags:
      - { name: kernel.event_subscriber }

  brand_url.listener:
    class: DeskPRO\Bundle\BrandBundle\EventListener\BrandUrlListener
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@security.token_storage"
      - "@brand_stack"
      - "@original_url_generator"
      - "@original_request_storage"
    tags:
      - { name: kernel.event_subscriber }

  original_request.listener:
    class: DeskPRO\Bundle\BrandBundle\EventListener\OriginalRequestListener
    arguments:
      - "@original_request_storage"
    tags:
      - { name: kernel.event_subscriber }
