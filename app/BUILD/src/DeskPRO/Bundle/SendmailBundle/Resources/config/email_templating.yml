services:
  templating.email.twig:
    class: DeskPRO\SendmailBundle\Twig\Environment
    arguments:
      - "@templating.email.twig.loader"
      - []

  templating.new_email.twig.engine:
    class: DeskPRO\SendmailBundle\Twig\TwigEngine
    arguments:
      - "@templating.new_email.twig"
      - "@templating.new_email.twig.template_name_parser"
      - "@templating.new_email.twig.file_locator"