services:

  dp.voice.event_dispatcher:
    class: Symfony\Component\EventDispatcher\EventDispatcher

  dp.voice.listener.voice_agent_notify:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\VoiceAgentNotifyListener
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@dp.voice.voice_task_helper"
      - "@dp.voice.task_router.storage"
      - "@event_dispatcher"
      - "@serializer"
    tags:
      - { name: dp.voice.event_subscriber }

  dp.voice.listener.voice_queue_count:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\VoiceQueueCountListener
    arguments:
      - "@dp.voice.voice_task_helper"
      - "@dp.voice.task_router.storage"
      - "@event_dispatcher"
      - "@serializer"
    tags:
      - { name: dp.voice.event_subscriber }

  dp.voice.listener.chat_queue_count:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\ChatQueueCountListener
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@dp.voice.chat_task_helper"
      - "@dp.voice.task_router.storage"
    tags:
      - { name: dp.voice.event_subscriber }

  dp.voice.listener.chat_agent_notify:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\ChatAgentNotifyListener
    arguments:
      - "@dp.voice.chat_task_helper"
      - "@serializer"
      - "@dp.voice.task_router.storage"
      - "@event_dispatcher"
    tags:
      - { name: dp.voice.event_subscriber }

  dp.voice.listener.incoming_call_listener:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\TwilioIncomingCallListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@dp.voice.task_router.storage"
      - "@dp.voice.voice_task_helper"
      - "@service_container"
      - "@dp.voice.logger"
    tags:
      - { name: dp.voice.event_subscriber }

  dp.voice.listener.voicemail:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\VoicemailListener
    arguments:
      - "@dp.voice.voice_task_helper"
      - "@dp.voice.task_router.storage"
      - "@service_container"
    tags:
      - { name: dp.voice.event_subscriber }

  dp.voice.listener.cancel_forwarding_calls:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\CancelForwardingCallsListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@dp.voice.voice_task_helper"
      - "@dp.voice.task_router.storage"
      - "@service_container"
    tags:
      - { name: dp.voice.event_subscriber }

  dp.voice.listener.worker_last_call_at:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\WorkerLastCallAtListener
    arguments:
      - "@dp.voice.task_router.storage"
    tags:
      - { name: dp.voice.event_subscriber }


  dp.voice.listener.last_pending_task_timestamp:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\LastPendingTaskListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
    tags:
      - { name: dp.voice.event_subscriber }

  event_listener.doctrine.twilio_account:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\TwilioAccountListener
    arguments:
      - "@twilio_adapter"
      - "@doctrine.orm.default_entity_manager"
      - "@router"
    tags:
      - { name: doctrine.entity_listener }

  event_listener.doctrine.plivo_account:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\PlivoAccountListener
    arguments:
      - "@settings_resolver"
      - "@plivo_adapter"
      - "@doctrine.orm.default_entity_manager"
      - "@router"
    tags:
      - { name: doctrine.entity_listener }

  event_listener.doctrine.voice_queue:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\VoiceQueueListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
    tags:
      - { name: doctrine.entity_listener }

  event_listener.doctrine.voice_worker:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\VoiceWorkerListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@event_dispatcher"
      - "@dp.voice.task_router.storage"
    tags:
      - { name: doctrine.entity_listener }

  event_listener.doctrine.voice_permission_removal:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\VoicePermissionRemovalListener
    tags:
      - { name: doctrine.entity_listener }
      - { name: doctrine.event_subscriber, connection: default }

  event_listener.doctrine.voice_number:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\VoiceNumberListener
    arguments: ["@service_container", "@event_dispatcher"]
    tags:
      - { name: doctrine.entity_listener }
      - { name: doctrine.event_subscriber, connection: default }

  event_listener.doctrine.voice_settings:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\VoiceSettingsListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@event_dispatcher"
    tags:
      - { name: doctrine.entity_listener }

  event_listener.doctrine.voice_agent_target:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\VoiceAgentTargetListener
    arguments: ["@doctrine.orm.default_entity_manager"]
    tags:
      - { name: doctrine.entity_listener }

  event_listener.doctrine.user_chat_queue:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\UserChatQueueListener
    arguments:
      - "@doctrine.orm.default_entity_manager"
      - "@chat_settings_resolver"
    tags:
      - { name: doctrine.entity_listener }

  event_listener.doctrine.voicet_ticket:
    class: DeskPRO\Bundle\VoiceBundle\EventListener\Doctrine\VoiceTicketListener
    arguments:
      - "@service_container"
    tags:
      - { name: doctrine.entity_listener }
      - { name: doctrine.event_subscriber, connection: default }
