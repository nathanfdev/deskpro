<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.0.11/handlebars.min.js" integrity="sha256-+JMHsXRyeTsws/tzbIh5YHQxRdKCuNjmvNcTFtY6DLc=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.3/FileSaver.min.js" integrity="sha256-FPJJt8nA+xL4RU6/gsriA8p8xAeLGatoyTjldvQKGdE=" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
    <script>$(window).ready(function() { run(); });</script>

    <title>Third-party software in Deskpro</title>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <a class="navbar-brand" href="#">Third-Party Software List</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExampleDefault" aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarsExampleDefault">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item ">
                <a class="nav-link" href="#" id="downloadJson">Download JSON</a>
            </li>
            <li class="nav-item ">
                <a class="nav-link" href="#" id="downloadCsv">Download CSV</a>
            </li>
        </ul>
    </div>
</nav>

<script id="licListTpl" type="text/x-handlebars-template">
    {{#each licData}}
        <tr>
            <td>
                {{#if link}}
                    <a href="{{link}}" target="_blank">{{name}}</a>
                {{else}}
                    {{name}}
                {{/if}}
            </td>
            <td>
                {{#each license}}
                    <a href="./licenses/{{.}}.txt" target="_blank">{{.}}</a>{{#unless @last}}, {{/unless}}
                {{/each}}
            </td>
            <td style="width: 100px">
                {{managedVia}}
            </td>
        </tr>
    {{/each}}
</script>

<script id="licIdsTpl" type="text/x-handlebars-template">
    {{#each licIds}}
        <a href="./licenses/{{.}}.txt" target="_blank">{{.}}</a>{{#unless @last}}, {{/unless}}
    {{/each}}
</script>

<main role="main" class="container">
    <br><br>

    <div class="jumbotron">
        <p class="lead">This page lists all third-party software and libraries used in Deskpro.</p>
        <hr class="my-4">
        <p id="licIds"></p>
    </div>

    <table class="table" width="100%">
        <thead class="thead-dark">
            <tr>
                <th>Name</th>
                <th>License</th>
                <th>Managed By</th>
            </tr>
        </thead>
        <tbody id="licList">
        </tbody>
    </table>
</main>

</body>
</html>
